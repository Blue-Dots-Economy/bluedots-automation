# Dependabot (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300)
#
# This repo had no Dependabot config. There is no application dependency manifest
# here — no package.json, no pyproject.toml — so the two things worth watching are
# the ones this repo actually pins:
#
#   * github-actions — the actions used by this repo's own workflows, INCLUDING
#     security-scan.yml, which the other five repos call. A stale or compromised
#     action here would execute in all six.
#   * docker — the base images in dockerfiles/postgres and dockerfiles/keycloak.
#     Both are deliberately rarely rebuilt (manual workflow_dispatch only), which
#     is exactly why they need something watching them: nothing else will notice
#     the base image ageing.
#
# Note on SHA-pinned actions: where a workflow pins an action by commit SHA with a
# trailing `# vX.Y.Z` comment, Dependabot reads that comment and still offers
# upgrades, bumping both the SHA and the comment together. Pinning does not opt
# out of updates.
#
# Branch model here is feature -> develop -> main, and `feature` is where work
# integrates, so PRs target it rather than the default branch.


# Cooldown: do not adopt a release until it has been public for 7 days. A
# freshly-published version is the window in which a compromised release is
# still undetected, and this repo's actions execute in jobs holding GITHUB_TOKEN
# and SONAR_TOKEN — including security-scan.yml, which the other four repos call.
# GitHub applies an implicit 3-day cooldown already; 7 is the threshold zizmor
# checks for (zizmor dependabot-cooldown).
#
# This does NOT delay security patches: per GitHub's docs, "the cooldown option
# is only available for version updates, not security updates". A CVE fix still
# arrives immediately.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "feature"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directories:
      - "/dockerfiles/postgres"
      - "/dockerfiles/keycloak"
    target-branch: "feature"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
