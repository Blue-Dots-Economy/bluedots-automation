# Build & push the hardened OPA image with the Envoy plugin (DHI OPA base +
# upstream opa-envoy static binary), used as the aggregator api's OPA sidecar.
#
# Triggered manually (workflow_dispatch) for ad-hoc rebuilds, on release tags
# so a release cut produces an image carrying the release tag, and on a push to
# main, develop or feature that changes the Dockerfile or this workflow, so a
# merged version bump publishes its image. Never runs on PRs or on other branch
# pushes. Otherwise the same shape as the Postgres image workflow next to this
# one. Dockerfile + rationale: dockerfiles/opa-envoy/Dockerfile.
#
# Pushes to GHCR using the built-in GITHUB_TOKEN (no extra secrets needed). The
# image is ghcr.io/<repo-owner>/opa-envoy, tagged with the OPA version (the tag
# the chart uses by default), the commit SHA it was built from and, on a
# release tag, with the release tag verbatim. The base is
# pulled from this repo's own DHI mirror on GHCR, so the login runs on every
# run, build-only included.
name: Build OPA Envoy image

on:
  # Release tags — a release cut rebuilds this image and tags it with the release
  # tag, so opentofu/aws/<env>/global-images.yaml can name the release instead of
  # a commit SHA (Blue-Dots-Economy/bluedots-automation#146). Two schemes:
  #   v*.*.*      semver releases   e.g. v1.2.0
  #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
  # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a commit
  # predating this change will not pick the patterns up.
  #
  # A merged change to the image builds it. The mirror workflow copies the DHI
  # base on the same kind of push; when one change adds both, run this again
  # once the mirror has finished if the base pull fails.
  push:
    tags: ['v*.*.*', '20*-s*-rc*']
    branches: [main, develop, feature]
    paths:
      - dockerfiles/opa-envoy/**
      - .github/workflows/build-opa-envoy-image.yml
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push:
        description: "Push to the registry (false = build only)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy image scan uploads SARIF to code-scanning

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image name (ghcr.io/<owner>/opa-envoy)
        id: ref
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Untagged name: metadata-action below owns the tags, and the Trivy step
          # addresses the image by digest (name@sha256:...) rather than by tag.
          echo "repo=ghcr.io/${owner_lc}/opa-envoy" >> "$GITHUB_OUTPUT"

      # Publish vs build-only, resolved once so the build, the scan and the
      # scan's image reference cannot drift apart. Mirrors
      # build-keycloak-image.yml — see the longer note there for why a
      # build-only run must still scan: image rebuilds happen on release tags,
      # so their SARIF uploads against the tag ref and main's image findings
      # never refresh. `load:` handles one platform, so a build-only run is
      # pinned to linux/amd64; publishing runs still honour the input.
      - name: Resolve run mode
        id: mode
        # Inputs reach the script through `env:` rather than `${{ }}` inside it:
        # `platforms` is free text, so interpolating it into the shell is a
        # template-injection sink (zizmor template-injection).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: |
          if [ "$EVENT_NAME" != 'workflow_dispatch' ] || [ "$INPUT_PUSH" = 'true' ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "platforms=${INPUT_PLATFORMS:-linux/amd64}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
          echo "local_tag=opa-envoy:scan" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Always: the BASE image is this repo's GHCR mirror of DHI OPA.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The OPA version is the BASE tag in the Dockerfile, which must equal the
      # OPA version of the Envoy-plugin binary copied in.
      - name: Read the OPA version
        id: ver
        run: |
          v=$(sed -nE 's/^ARG BASE=.*:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' dockerfiles/opa-envoy/Dockerfile)
          if [ -z "$v" ]; then
            echo "::error::no OPA version in the ARG BASE line of dockerfiles/opa-envoy/Dockerfile"
            exit 1
          fi
          echo "opa=$v" >> "$GITHUB_OUTPUT"

      # `type=raw` is the OPA version, the tag the chart uses by default
      # (aggregator-api.rbac.opa.image.tag); a rebuild moves it to the newest
      # build of that version. `type=sha,format=short` tags the build with its
      # commit (sha-<7 chars>), which does not move, for a pin that must not
      # change. `type=ref,event=tag` emits a release tag VERBATIM and nothing on
      # other runs, which is what makes the image tag equal the release tag.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.opa }}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dockerfiles/opa-envoy
          file: dockerfiles/opa-envoy/Dockerfile
          # `inputs.*` exist only on workflow_dispatch. On a release tag they are
          # empty, so both are defaulted: an ungated `inputs.push` would be falsy
          # and the release build would silently BUILD WITHOUT PUSHING.
          platforms: ${{ steps.mode.outputs.platforms }}
          push: ${{ steps.mode.outputs.publish == 'true' }}
          # Build-only: keep the image locally so the scan below has a source.
          load: ${{ steps.mode.outputs.publish != 'true' }}
          tags: ${{ steps.mode.outputs.publish == 'true' && steps.meta.outputs.tags || steps.mode.outputs.local_tag }}
          provenance: false

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # The opa binary is upstream's, not DHI's, so the scan is what inventories
      # its Go dependencies. It is also rebuilt manually and rarely, which means
      # it ages quietly between rebuilds.
      #
      # Gated on the same condition that drives the build's `push:` (true for a
      # release tag, `inputs.push` for a manual run).
      # A `digest != ''` guard would look equivalent but is not reliable: with some
      # buildx drivers the digest output is populated even for a build-only run, and
      # Trivy would then try to pull an image that was never published
      # (MANIFEST_UNKNOWN). Build-only runs therefore skip the scan cleanly.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.mode.outputs.publish == 'true' && format('{0}@{1}', steps.ref.outputs.repo, steps.build.outputs.digest) || steps.mode.outputs.local_tag }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-opa-envoy
