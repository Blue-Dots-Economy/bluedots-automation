name: pr-gate-tests
on:
  pull_request:
    paths: ['.github/actions/pr-gate/**']
  push:
    branches: [feature, develop, main]
    paths: ['.github/actions/pr-gate/**']
# Declared explicitly rather than inheriting the repo default, which may be
# read-write. This job only runs the pr-gate unit tests: it reads the checkout
# and nothing else (zizmor excessive-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Unit tests
        working-directory: .github/actions/pr-gate
        run: node --test
