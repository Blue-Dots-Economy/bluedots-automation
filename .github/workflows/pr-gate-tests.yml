name: pr-gate-tests
on:
  pull_request:
    paths: ['.github/actions/pr-gate/**']
  push:
    branches: [feature, develop, main]
    paths: ['.github/actions/pr-gate/**']
# Declared explicitly rather than inheriting the repo default, which may be
# read-write. This job only runs the pr-gate unit tests: it reads the checkout
# and nothing else (zizmor excessive-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Unit tests
        working-directory: .github/actions/pr-gate
        run: node --test
