name: CI

# Minimal static-check CI for the infra repo (PLAN 1.15): catch Helm chart and
# OpenTofu module errors in a PR instead of at deploy time. No cluster or cloud
# credentials are used — `helm lint`/`template` render locally and `tofu
# validate` runs with `-backend=false` (no S3 backend, no AWS calls).
#
# Path-filtered to helm/opentofu changes so unrelated PRs don't pay for it.
on:
  pull_request:
    branches: [develop, main, feature]
    paths:
      - 'helm/**'
      - 'opentofu/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/dhi-mirror-images.txt'
  push:
    branches: [develop, main]
    paths:
      - 'helm/**'
      - 'opentofu/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/dhi-mirror-images.txt'

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: assert shared realm invariants
        # Guards the deployment realm this repo OWNS. Not a diff against the app
        # repos — their infra/keycloak/ trees are independent developer-local
        # setups and are SUPPOSED to differ (localhost redirects, sslRequired).
        # These are the properties that must hold regardless, and the first one
        # (no localhost in a production client's allow-lists) is a security
        # property that is completely invisible in a working deployment.
        run: bash scripts/assert-realm.sh

      - name: helm lint (all charts)
        run: |
          for chart in monitoring common-services keycloak signals aggregator; do
            echo "::group::helm lint $chart"
            # The aggregator chart guards its mandatory secrets (renders fail on
            # `change-me`/empty defaults); skip that block for the static check
            # with a placeholder existingSecret — real deploys validate real
            # values from global-secrets.yaml.
            case "$chart" in
              aggregator)
                helm lint "helm/$chart" --set global.existingSecret=ci-smoke
                ;;
              keycloak)
                # Same secret guard, PLUS a required realm name: the realm is
                # per-instance and deliberately has no literal default.
                helm lint "helm/$chart" \
                  --set global.existingSecret=ci-smoke \
                  --set global.keycloakRealm=ci-smoke
                ;;
              *)
                helm lint "helm/$chart"
                ;;
            esac
            echo "::endgroup::"
          done

      - name: helm template (render smoke test)
        run: |
          # `signals` is intentionally excluded: its api subchart renders network
          # schema files that install.sh fetches at deploy time
          # (fetch_signals_configs) and are not committed, so a bare `helm
          # template` fails on the missing files. `helm lint` above still covers it.
          for chart in monitoring common-services keycloak aggregator; do
            echo "::group::helm template $chart"
            # aggregator: bypass the mandatory-secret guard + the fetched-config
            # requirement (see helm lint step).
            case "$chart" in
              aggregator)
                helm template "$chart" "helm/$chart" -f helm/global-resources.yaml \
                  --set global.existingSecret=ci-smoke \
                  --set global.networkConfigDelivery=false >/dev/null
                ;;
              keycloak)
                helm template "$chart" "helm/$chart" -f helm/global-resources.yaml \
                  --set global.existingSecret=ci-smoke \
                  --set global.keycloakRealm=ci-smoke >/dev/null
                ;;
              *)
                helm template "$chart" "helm/$chart" -f helm/global-resources.yaml >/dev/null
                ;;
            esac
            echo "::endgroup::"
          done

      # Every Docker Hardened Image the charts deploy is served from OUR GHCR
      # mirror, not from dhi.io (see the header of helm/*/values.yaml for why).
      # The mirror only contains what .github/dhi-mirror-images.txt lists, so a
      # values.yaml that names a ref absent from that list deploys a pod that
      # can never pull — and the error at deploy time is a bare `denied`, which
      # reads like a permissions problem rather than a missing mirror. Catch it
      # in the PR instead.
      #
      # `helm template` is the right source here rather than grepping values:
      # the refs are assembled from split registry/repository/tag keys nested at
      # different depths per subchart, and only the render resolves them. The
      # grep runs over the WHOLE rendered manifest, not just `image:` keys —
      # cert-manager passes its acmesolver image as a controller FLAG
      # (--acme-http01-solver-image) and would otherwise be missed.
      - name: DHI mirror list covers every rendered image
        run: |
          set -euo pipefail
          for chart in monitoring common-services; do
            helm template "$chart" "helm/$chart" -f helm/global-resources.yaml
          done \
            | grep -oE 'ghcr\.io/blue-dots-economy/dhi/[A-Za-z0-9._-]+:[A-Za-z0-9._-]+' \
            | sed 's|ghcr\.io/blue-dots-economy/dhi/||' \
            | sort -u > /tmp/rendered-dhi.txt

          grep -vE '^[[:space:]]*(#|$)' .github/dhi-mirror-images.txt \
            | tr -d '[:blank:]' | sort -u > /tmp/listed-dhi.txt

          echo "rendered $(wc -l < /tmp/rendered-dhi.txt), listed $(wc -l < /tmp/listed-dhi.txt)"

          # One-directional on purpose. Rendered-but-not-listed is a hard error:
          # that pod cannot pull. Listed-but-not-rendered is only a stale line in
          # the list — it costs one redundant copy, breaks nothing, and is the
          # expected state while an image is being staged ahead of the values
          # change that starts using it.
          missing=$(comm -23 /tmp/rendered-dhi.txt /tmp/listed-dhi.txt)
          if [ -n "$missing" ]; then
            echo "::error::these images are deployed but not mirrored — add them to .github/dhi-mirror-images.txt:"
            echo "$missing"
            exit 1
          fi
          echo "OK — every rendered DHI ref is in the mirror list."

  tofu:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.4
          tofu_wrapper: false

      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ runner.os }}

      # Create the plugin cache dir before ANY tofu command. tofu warns
      # ("plugin cache dir cannot be opened ... may not behave as intended")
      # whenever TF_PLUGIN_CACHE_DIR is set but missing — which happens on a
      # cache miss when the restore above finds nothing.
      - name: Prepare provider plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # Blocking: formatting drift fails the check. Keep the tree `tofu fmt`-clean.
      - name: tofu fmt
        run: tofu fmt -check -recursive opentofu/aws

      - name: tofu validate (all modules)
        run: |
          rc=0
          for module in opentofu/aws/modules/*/; do
            echo "::group::tofu validate $module"
            if ( cd "$module" && tofu init -backend=false -no-color >/dev/null && tofu validate -no-color ); then
              echo "$module OK"
            else
              echo "::error::tofu validate failed for $module"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"
