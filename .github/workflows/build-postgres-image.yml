# Build & push the custom PostgreSQL image (Bitnami base + portable pgvector).
#
# Triggered manually (workflow_dispatch) for ad-hoc rebuilds, and on release tags
# so a release cut produces a postgres image carrying the release tag. Still never
# runs on branch pushes or PRs — this is a rarely-rebuilt base image, not part of
# app CI/CD. Dockerfile + rationale: dockerfiles/postgres/Dockerfile.
#
# Pushes to GHCR using the built-in GITHUB_TOKEN (no extra secrets needed). The
# image is ghcr.io/<repo-owner>/postgres-pgvector, tagged with the commit SHA it
# was built from and, on a release tag, with the release tag verbatim.
name: Build Postgres pgvector image

on:
  # Release tags — a release cut rebuilds this image and tags it with the release
  # tag, so opentofu/aws/<env>/global-images.yaml can name the release instead of
  # a commit SHA (Blue-Dots-Economy/bluedots-automation#146). Two schemes:
  #   v*.*.*      semver releases   e.g. v1.2.0
  #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
  # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a commit
  # predating this change will not pick the patterns up.
  #
  # Still NOT run on branch pushes or PRs — this stays out of app CI/CD.
  push:
    tags: ['v*.*.*', '20*-s*-rc*']
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64"
      push:
        description: "Push to the registry (false = build only)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy image scan uploads SARIF to code-scanning

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve image name (ghcr.io/<owner>/postgres-pgvector)
        id: ref
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Untagged name: metadata-action below owns the tags, and the Trivy step
          # addresses the image by digest (name@sha256:...) rather than by tag.
          echo "repo=ghcr.io/${owner_lc}/postgres-pgvector" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=sha,format=short` reproduces exactly the tag this workflow used to
      # build by hand (sha-<7 chars>), so existing pins keep resolving.
      # `type=ref,event=tag` emits a release tag VERBATIM and nothing on a manual
      # run, which is what makes the image tag equal the release tag.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.ref.outputs.repo }}
          tags: |
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dockerfiles/postgres
          file: dockerfiles/postgres/Dockerfile
          # `inputs.*` exist only on workflow_dispatch. On a release tag they are
          # empty, so both are defaulted: an ungated `inputs.push` would be falsy
          # and the release build would silently BUILD WITHOUT PUSHING.
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # This is a Bitnami PostgreSQL base with pgvector compiled in, so essentially
      # none of its contents are described by anything in this repo — the image scan
      # is the only thing that inventories it. It is also rebuilt manually and
      # rarely, which means its base layers age quietly between rebuilds.
      #
      # Gated on the same condition that drives the build's `push:` (true for a
      # release tag, `inputs.push` for a manual run).
      # A `digest != ''` guard would look equivalent but is not reliable: with some
      # buildx drivers the digest output is populated even for a build-only run, and
      # Trivy would then try to pull an image that was never published
      # (MANIFEST_UNKNOWN). Build-only runs therefore skip the scan cleanly.
      - name: Trivy image scan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.repo }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-postgres-pgvector
