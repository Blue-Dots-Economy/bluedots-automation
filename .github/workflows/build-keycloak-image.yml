# Build & push the custom Keycloak image (upstream base + OTP authenticator SPI).
#
# MANUAL TRIGGER ONLY (workflow_dispatch) — like the Postgres image, this is a
# rarely-rebuilt base image, not part of app CI/CD, so it never runs on push/PR.
# Rebuild when the OTP jar is bumped or the Keycloak minor changes. Dockerfile +
# rationale: dockerfiles/keycloak/Dockerfile.
#
# Pushes to GHCR using the built-in GITHUB_TOKEN (no extra secrets needed). The
# image is ghcr.io/<repo-owner>/keycloak-server — same owner-level naming as the
# postgres-pgvector image next to it.
#
# TAGS: unlike the postgres image (sha-only), this one also gets a branch tag,
# because opentofu/aws/<env>/global-images.yaml pins `keycloak.image.tag` by
# branch name (e.g. "develop"). Dropping that would silently break every
# environment's image resolution. Tags produced:
#   <branch>            e.g. develop, unified-keycloak
#   sha-<7-char-sha>    immutable, prefer this for production pins
#   latest              default branch only
#
# Moved here from aggregator-dpg/.github/workflows/keycloak-image-build.yaml:
# Keycloak is a common service serving BOTH DPGs, so its image is released from
# the repo that deploys it rather than from one of its two consumers.
name: Build Keycloak image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64"
      push:
        description: "Push to the registry (false = build only)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: keycloak-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (ghcr.io/<owner>/keycloak-server)
        id: ref
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/keycloak-server" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=keycloak-server
            org.opencontainers.image.description=Keycloak with the OTP authenticator SPI baked in and pre-indexed
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: dockerfiles/keycloak
          file: dockerfiles/keycloak/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak-server
          cache-to: type=gha,mode=max,scope=keycloak-server
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Keycloak image"
            echo
            echo "Digest: \`${DIGEST:-not pushed}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Pin one of these in \`opentofu/aws/<env>/global-images.yaml\` → \`keycloak.image.tag\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
