# Build & push the custom Keycloak image (upstream base + OTP authenticator SPI).
#
# Triggered manually (workflow_dispatch) for ad-hoc rebuilds, and on release tags
# so a release cut produces a Keycloak image carrying the release tag. Still never
# runs on branch pushes or PRs — like the Postgres image next to it, this is a
# rarely-rebuilt base image, not part of app CI/CD. Rebuild manually when the OTP
# jar is bumped or the Keycloak minor changes. Dockerfile + rationale:
# dockerfiles/keycloak/Dockerfile.
#
# Pushes to GHCR using the built-in GITHUB_TOKEN (no extra secrets needed). The
# image is ghcr.io/<repo-owner>/keycloak-server — same owner-level naming as the
# postgres-pgvector image next to it.
#
# TAGS: unlike the postgres image (sha-only), this one also gets a branch tag,
# because opentofu/aws/<env>/global-images.yaml pins `keycloak.image.tag` by
# branch name (e.g. "develop"). Dropping that would silently break every
# environment's image resolution. Tags produced:
#   <branch>            e.g. develop, unified-keycloak
#   sha-<7-char-sha>    immutable, prefer this for production pins
#   latest              default branch only
#   <release tag>       release-tag runs only, e.g. 202608-s1-rc1 — equals the
#                       git tag verbatim, so a release can be pinned by name
#
# Moved here from aggregator-dpg/.github/workflows/keycloak-image-build.yaml:
# Keycloak is a common service serving BOTH DPGs, so its image is released from
# the repo that deploys it rather than from one of its two consumers.
name: Build Keycloak image

on:
  # Release tags — a release cut rebuilds this image and tags it with the release
  # tag, so opentofu/aws/<env>/global-images.yaml can name the release instead of
  # a commit SHA (Blue-Dots-Economy/bluedots-automation#146). Two schemes:
  #   v*.*.*      semver releases   e.g. v1.2.0
  #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
  # GitHub reads this workflow FROM THE TAGGED COMMIT, so a tag cut from a commit
  # predating this change will not pick the patterns up.
  #
  # Still NOT run on branch pushes or PRs — this stays out of app CI/CD.
  push:
    tags: ['v*.*.*', '20*-s*-rc*']
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64"
      push:
        description: "Push to the registry (false = build only)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write
  security-events: write   # Trivy image scan uploads SARIF to code-scanning

concurrency:
  group: keycloak-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name (ghcr.io/<owner>/keycloak-server)
        id: ref
        run: |
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/keycloak-server" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The base image is now a Docker Hardened Image (dockerfiles/keycloak/Dockerfile
      # builds FROM dhi.io/keycloak). dhi.io refuses anonymous pulls even for the
      # free Apache-2.0 catalog, so without this the build fails at the first FROM.
      # NOT gated on inputs.push: a build-only run still has to pull the base.
      # Username is a repo/org VARIABLE, token a SECRET — same pair the app repos'
      # build workflows use.
      - name: Log in to dhi.io
        env:
          DHI_USER: ${{ vars.DOCKERHUB_USERNAME }}
          DHI_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DHI_USER}" ] || [ -z "${DHI_TOKEN}" ]; then
            echo "::error::dhi.io needs a Docker Hub login — set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret."
            exit 1
          fi
          echo "${DHI_TOKEN}" | docker login dhi.io -u "${DHI_USER}" --password-stdin

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ref.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=keycloak-server
            org.opencontainers.image.description=Keycloak with the OTP authenticator SPI baked in and pre-indexed
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: dockerfiles/keycloak
          file: dockerfiles/keycloak/Dockerfile
          # `inputs.*` exist only on workflow_dispatch. On a release tag they are
          # empty, so both are defaulted: an ungated `inputs.push` would be falsy
          # and the release build would silently BUILD WITHOUT PUSHING.
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak-server
          cache-to: type=gha,mode=max,scope=keycloak-server
          provenance: false

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # An upstream Keycloak base plus a bundled OTP authenticator jar — almost
      # nothing in it is described by this repo, so the image scan is the only
      # inventory of its contents. Keycloak fronts authentication for both DPGs,
      # which makes this the highest-consequence image in the estate.
      #
      # Gated on the same condition that drives the build's `push:` (true for a
      # release tag, `inputs.push` for a manual run).
      # A `digest != ''` guard would look equivalent but is not reliable: with some
      # buildx drivers the digest output is populated even for a build-only run, and
      # Trivy would then try to pull an image that was never published
      # (MANIFEST_UNKNOWN). Build-only runs therefore skip the scan cleanly.
      #
      # Addressed by digest rather than by tag: this image is tagged by BRANCH
      # (see the header note), so `:develop` is deliberately mutable — the digest
      # ties each result to the exact artifact that run produced.
      - name: Trivy image scan
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-keycloak-server

      - name: Summary
        run: |
          {
            echo "### Keycloak image"
            echo
            echo "Digest: \`${DIGEST:-not pushed}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Pin one of these in \`opentofu/aws/<env>/global-images.yaml\` → \`keycloak.image.tag\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
