# Copy to global-secrets.yaml (gitignored); never commit the copy.
# Run ./generate-passwords.sh once: it fills the random passwords and lists what it filled.
# Fill the rest by hand. Where a key says "same as", paste the same string into both places.

# ─── common-services ─────────────────────────────────────────────────────────
credentials:
  postgresAdminPassword: ""            # MOLE's existing managed Postgres admin password (not generated)
  dpgPassword: ""                      # signals DB role `dpg`
  keycloakPassword: ""                 # keycloak DB role; same as secrets.keycloakPostgresPassword
  aggregatorPassword: ""               # unused here, but the bootstrap Job creates the role
  aggregatorExportRoPassword: ""
  campaignManagerSignalsRoPassword: ""
  redisPassword: ""
  postgresql:
    password: ""                       # same as dpgPassword
  redis:
    password: ""                       # same as redisPassword

# ─── monitoring (only if deployed) ───────────────────────────────────────────
prometheus:
  grafana:
    adminPassword: ""
alerting:
  email:
    smtpAuthPassword: ""               # same as secrets.smtpPassword
  discord:
    criticalWebhook: "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/x"   # must stay URL-shaped
    warningWebhook:  "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/x"
    infoWebhook:     "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/x"

# ─── keycloak (shared realm: aggregator clients still need secrets) ──────────
secrets:
  kcBootstrapAdminPassword: ""
  keycloakPostgresPassword: ""         # same as credentials.keycloakPassword
  keycloakAdminClientSecret: ""
  oidcClientSecret: ""
  signalsApiSecret: ""                 # same as api.secrets.data.KEYCLOAK_API_CLIENT_SECRET
  signalstackClientSecret: ""
  voiceDpgSignalsSecret: ""
  campaignManagerSecret: ""
  ssoOidcClientSecret: ""              # same as api.secrets.data.SSO_OIDC_CLIENT_SECRET
  smsHttpSecret: ""                    # only for keycloak smsProvider=http (needs notification-service; leave empty)
  smtpUser: ""
  smtpPassword: ""
  msg91AuthKey: ""
  redisPassword: ""                    # same as credentials.redisPassword

keycloak:
  msg91TemplateId: ""

# ─── signals ─────────────────────────────────────────────────────────────────
api:
  secrets:
    authSecret: ""                     # same as data.AUTH_SECRET
    notificationSecret: ""             # same as data.NOTIFICATION_SERVICE_SECRET
    data:
      AUTH_SECRET: ""
      SIGNALS_PII_KEY: ""
      POSTGRES_PASSWORD: ""            # same as credentials.dpgPassword
      REDIS_PASSWORD: ""               # same as credentials.redisPassword
      NOTIFICATION_SERVICE_SECRET: ""
      INSTANCE_SHARED_SECRET: ""
      KEYCLOAK_API_CLIENT_SECRET: ""   # same as secrets.signalsApiSecret
      GOOGLE_GEOCODING_API_KEY: ""
      # Required by the migrate Job even without an aggregator; 32+ chars, letters/digits only.
      AGGREGATOR_DPG_API_KEY: ""
      SIGNALS_SEARCH_API_KEY: ""
      RAYA_VOICE_BOT_API_KEY: ""
      # NCS partner SSO (signals-dpg#766)
      SSO_OIDC_SIGNING_KEY: ""         # EC P-256 PKCS#8 PEM: openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt
      SSO_OIDC_CLIENT_SECRET: ""       # same as secrets.ssoOidcClientSecret
      SSO_NCS_CLIENT_ID: ""            # issued by NCS
      SSO_NCS_CLIENT_SECRET: ""        # issued by NCS

ui:
  runtimeConfig:
    VITE_GOOGLE_MAPS_API_KEY: ""

search:
  secrets:
    data:
      POSTGRES_PASSWORD: ""            # same as credentials.dpgPassword
      REDIS_PASSWORD: ""               # same as credentials.redisPassword
