# =============================================================================
# Manual (hand-entered) secrets — INPUT to the output-file tofu module.
#
# Setup (once per environment, after cloning template/ → <env>/):
#   cp secrets.example.yaml secrets.yaml
#   ...then fill in the real values below.
# Must exist before the output-file module runs (create_tf_resources /
# apply_tf_output_file) — that's when tofu reads it.
#
# secrets.yaml is GITIGNORED — never commit real values.
# Tofu reads it on every apply and templates the values into the generated
# global-secrets.yaml, so re-running `apply_tf_output_file` (or a full apply)
# re-renders the SAME values — nothing to re-enter after a regenerate.
#
# NOTE the two different files:
#   secrets.yaml        — this one: hand-entered INPUT, you edit it, persists.
#   global-secrets.yaml — GENERATED output (secrets from here + the random
#                         passwords tofu creates). Don't hand-edit that one.
#
# One key per distinct secret: values used by several charts (smtp_password,
# msg91_auth_key, msg91_template_id) are templated into every consumer from the
# single key here, so the copies can never drift. The two Google keys are the
# deliberate exception — see the note below them.
# =============================================================================

# Gmail App Password (16 chars — strip the display spaces; needs 2-Step
# Verification: Google Account → Security → App passwords).
# Feeds: notification-service GMAIL_PASS, aggregator secrets.smtpPassword,
# monitoring alerting.email.smtpAuthPassword.
smtp_password: "UPDATE_THIS_VALUE"

# MSG91 (SMS OTP — leave as placeholders if SMS is unused).
# auth_key feeds: notification-service MSG91_AUTH_KEY, aggregator secrets.msg91AuthKey.
# template_id feeds: notification-service MSG91_TEMPLATE_ID, aggregator keycloak.msg91TemplateId.
msg91_auth_key: "UPDATE_THIS_VALUE"
msg91_template_id: "UPDATE_THIS_VALUE"

# ── Google Maps: TWO SEPARATE KEYS, on purpose ───────────────────────────────
# A Google API key accepts only ONE "Application restriction" type — HTTP
# referrers OR IP addresses, never both. The browser and the server therefore
# need their own key, or neither can be locked down:
#
#   google_maps_api_key       browser  → restrict by HTTP REFERRERS
#                                        (https://<each signals public host>/*)
#                                        API restriction: Maps JavaScript API
#   google_geocoding_api_key  server   → restrict by IP ADDRESSES
#                                        (the env's NAT gateway Elastic IPs —
#                                        both of them; pods egress via either AZ)
#                                        API restriction: Geocoding API
#
# They may hold the same key value if you don't intend to restrict them, but keep
# the two entries so restrictions can be tightened later without a code change.

# Browser / frontend → signals ui.runtimeConfig.VITE_GOOGLE_MAPS_API_KEY.
google_maps_api_key: "UPDATE_THIS_VALUE"
# Server / backend → signals api GOOGLE_GEOCODING_API_KEY.
google_geocoding_api_key: "UPDATE_THIS_VALUE"

# Discord alert webhooks (monitoring alertmanager) — one per channel:
# Channel Settings → Integrations → Webhooks. Only used when
# alerting.discord.enabled is true in global-values.yaml. Kept URL-shaped:
# Alertmanager validates webhook_url as a URL at config load.
discord_critical_webhook: "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/UPDATE_THIS_VALUE"
discord_warning_webhook:  "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/UPDATE_THIS_VALUE"
discord_info_webhook:     "https://discord.com/api/webhooks/UPDATE_THIS_VALUE/UPDATE_THIS_VALUE"
