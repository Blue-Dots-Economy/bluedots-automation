# campaign-manager chart — skeleton values.
# Review every line tagged `# UPDATE:` before deploying.

global:
  # UPDATE: public FQDN served by the ingress (or set ingress.host).
  publicHost: ""
  publicProtocol: https
  # List of Secret NAMES used as imagePullSecrets.
  imagePullSecrets:
    - ghcr-pull

replicaCount: 1

image:
  # UPDATE: set once the image build pipeline publishes the image.
  repository: ghcr.io/blue-dots-economy/agg-campaign-manager-v2
  tag: ""                        # UPDATE: required; no default tag exists
  pullPolicy: IfNotPresent

# Optional: render a ghcr.io dockerconfigjson pull secret from these credentials.
imagePullSecret:
  create: false
  name: ghcr-pull
  registry: ghcr.io
  username: ""
  password: ""

service:
  type: ClusterIP
  port: 80
  # Port the Node server listens on inside the container.
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to global.publicHost when empty. One of them is required when enabled.
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: campaign-manager-tls

# Extra non-secret env for the app, rendered into a ConfigMap.
config: {}

# App credentials, rendered into a Secret. Empty values are skipped.
secrets:
  existingSecret: ""             # or your own Secret with the same keys (see the README)
  SESSION_SECRET: ""             # UPDATE: required, at least 32 characters (openssl rand -hex 32)
  CRON_SECRET: ""                # UPDATE: required
  CRON_SECRET_PREVIOUS: ""       # only while rotating CRON_SECRET
  RAYA_API_KEY: ""               # UPDATE
  GOOGLE_SERVICE_ACCOUNT_JSON: ""   # UPDATE: service-account JSON as one string

# Postgres used by the app, the migrations and the pipeline, all through one login.
database:
  host: ""                       # UPDATE
  port: 5432
  name: campaign_manager
  user: campaign_manager         # the one login for the app, migrations and pipeline
  password: ""                   # UPDATE
  admin:
    user: postgres
    password: ""                 # UPDATE: used only by the database setup step

# Init container on the app pods that creates the login, database and schemas if missing.
dbInit:
  enabled: true
  image:
    repository: postgres         # only used to run psql
    tag: "17-alpine"
    pullPolicy: IfNotPresent

# Init container on the app pods that applies the app's schema migrations, after the database setup.
migrate:
  enabled: true
  image:
    repository: ""               # empty = the app image
    tag: ""                      # empty = the app image tag
    pullPolicy: IfNotPresent
  command: ["node", "migrate/migrate.mjs"]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# UPDATE: confirm the health path once the container image exists.
probes:
  path: /
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

podAnnotations: {}

# Applied to the app pods, including the database setup and migrate init containers.
# The app image runs as the non-root node user (uid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
nodeSelector: {}
tolerations: []
affinity: {}

# Purple Dots data pipeline: CronJob loading Raya calls and the S3 dump into Postgres.
pipeline:
  enabled: false

  image:
    repository: ghcr.io/blue-dots-economy/purple-dots
    tag: ""                      # UPDATE: required when enabled; no default tag exists
    pullPolicy: IfNotPresent

  schedule: "0 2 * * *"          # UPDATE: cron expression, evaluated in timeZone
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid      # a slow run must not overlap the next one
  startingDeadlineSeconds: 900
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: false

  args: []                       # extra run_pipeline.py arguments, e.g. ["--skip", "inbound"]

  config:                        # empty values are not rendered, so the pipeline defaults apply
    BASE_URL: ""                 # UPDATE: Purple Dots signals API, for the S3 dump
    KEYCLOAK_URL: ""             # UPDATE: Keycloak base URL, for the S3 dump
    REALM: ""
    CLIENT_ID: ""
    PD_INSTANCE: ""
    PD_REFRESH_DAYS: ""
    PD_TEST_BATCHES: ""

  secrets:
    CLIENT_SECRET: ""            # UPDATE: Keycloak service-account secret, for the S3 dump

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
