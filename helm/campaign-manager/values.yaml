# campaign-manager chart — skeleton values.
# Review every line tagged `# UPDATE:` before deploying.

global:
  # UPDATE: public FQDN served by the ingress.
  publicHost: campaign-manager.example.com
  publicProtocol: https
  # List of Secret NAMES used as imagePullSecrets.
  imagePullSecrets:
    - ghcr-pull

replicaCount: 1

image:
  # UPDATE: set once the image build pipeline publishes the image.
  repository: ghcr.io/blue-dots-economy/agg-campaign-manager-v2
  # Empty = Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Optional: render a ghcr.io dockerconfigjson pull secret from these credentials.
imagePullSecret:
  create: false
  name: ghcr-pull
  registry: ghcr.io
  username: ""
  password: ""

service:
  type: ClusterIP
  port: 80
  # Port the Node server listens on inside the container.
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to global.publicHost when empty.
  host: ""
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: campaign-manager-tls

# Non-secret runtime config, rendered into a ConfigMap and injected as env.
config:
  # UPDATE: Supabase project URLs (server-side).
  SUPABASE_URL: ""
  PURPLE_SUPABASE_URL: ""
  PURPLE_CUTOVER: ""

# Sensitive runtime config, rendered into a Secret unless existingSecret is set.
secrets:
  # Name of a pre-created Secret carrying the same keys as below.
  existingSecret: ""
  SUPABASE_PUBLISHABLE_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  PURPLE_SUPABASE_SERVICE_ROLE_KEY: ""
  LOVABLE_CRON_SECRET: ""
  LOVABLE_CRON_SECRET_PREVIOUS: ""
  GOOGLE_SERVICE_ACCOUNT_JSON: ""
  GOOGLE_SHEETS_API_KEY: ""
  LOVABLE_API_KEY: ""
  RAYA_API_KEY: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# UPDATE: confirm the health path once the container image exists.
probes:
  path: /
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Purple Dots data pipeline: CronJob loading Raya calls and the S3 dump into Postgres.
pipeline:
  enabled: false

  image:
    repository: ghcr.io/blue-dots-economy/purple-dots
    tag: ""                      # UPDATE: required when enabled; no default tag exists
    pullPolicy: IfNotPresent

  schedule: "0 2 * * *"          # UPDATE: cron expression, evaluated in timeZone
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid      # a slow run must not overlap the next one
  startingDeadlineSeconds: 900
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: false

  args: []                       # extra run_pipeline.py arguments, e.g. ["--skip", "inbound"]

  config:                        # empty values are not rendered, so the pipeline defaults apply
    BASE_URL: ""                 # UPDATE: Purple Dots signals API, for the S3 dump
    KEYCLOAK_URL: ""             # UPDATE: Keycloak base URL, for the S3 dump
    REALM: ""
    CLIENT_ID: ""
    PD_INSTANCE: ""
    PD_REFRESH_DAYS: ""
    PD_TEST_BATCHES: ""

  secrets:
    existingSecret: ""           # or a Secret with DATABASE_URL, RAYA_API_KEY, CLIENT_SECRET
    RAYA_API_KEY: ""             # UPDATE
    CLIENT_SECRET: ""            # UPDATE: Keycloak service-account secret, for the S3 dump

  database:                      # DATABASE_URL is built from these
    host: ""                     # UPDATE: Postgres host
    port: 5432
    name: campaign_manager
    user: campaign_manager
    password: ""                 # UPDATE: password for the pipeline's own role

  dbInit:                        # creates the role, database and tables if missing
    enabled: true
    image:
      repository: postgres       # only used to run psql
      tag: "17-alpine"
      pullPolicy: IfNotPresent
    admin:
      user: postgres
      password: ""               # UPDATE: admin password, used only by this Job

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
