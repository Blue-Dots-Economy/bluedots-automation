{{- /* Creates the pipeline's platform tables, as purple_loader, after the migrate Job. Idempotent. */ -}}
{{- if .Values.pipeline.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "campaign-manager.pipeline.name" . }}-schema
  labels:
    {{- include "campaign-manager.pipeline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campaign-manager-pipeline-schema
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- include "campaign-manager.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: schema
          image: {{ include "campaign-manager.pipeline.image" . | quote }}
          imagePullPolicy: {{ .Values.pipeline.image.pullPolicy }}
          command:
            - python
            - -c
            - "import pathlib, db; db.run_sql_file(pathlib.Path('sql/create_purple_dots_s3.sql')); print('platform tables ready')"
          envFrom:
            - secretRef:
                name: {{ include "campaign-manager.pipeline.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
{{- end }}
