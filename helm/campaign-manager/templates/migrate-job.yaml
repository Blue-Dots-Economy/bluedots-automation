{{- /* Runs after the database Job, from the app image unless migrate.image is set. */ -}}
{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "campaign-manager.fullname" . }}-migrate
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: campaign-manager-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- include "campaign-manager.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: "{{ default .Values.image.repository .Values.migrate.image.repository }}:{{ default (default .Chart.AppVersion .Values.image.tag) .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrate.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "campaign-manager.fullname" . }}-migrate
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
{{- end }}
