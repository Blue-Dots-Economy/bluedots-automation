apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campaign-manager.fullname" . }}
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "campaign-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "campaign-manager.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll pods when config or chart-rendered secrets change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "campaign-manager.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The database and its migrations are ready before the app starts, on install and on every upgrade. */}}
      {{- if or .Values.dbInit.enabled .Values.migrate.enabled }}
      initContainers:
        {{- if .Values.dbInit.enabled }}
        {{- include "campaign-manager.dbInitContainer" . | nindent 8 }}
        {{- end }}
        {{- if .Values.migrate.enabled }}
        - name: migrate
          image: "{{ default .Values.image.repository .Values.migrate.image.repository }}:{{ default (include "campaign-manager.imageTag" .) .Values.migrate.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrate.command | nindent 12 }}
          env:
            {{- include "campaign-manager.secretEnv" (dict "ctx" . "name" "DATABASE_URL") | nindent 12 }}
            {{- /* The first admin is created after migrating (BOOTSTRAP_ADMIN_EMAIL), through Keycloak. */}}
            {{- include "campaign-manager.secretEnv" (dict "ctx" . "name" "KEYCLOAK_CLIENT_SECRET" "optional" true) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "campaign-manager.fullname" . }}-config
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        {{- end }}
      {{- end }}
      containers:
        - name: campaign-manager
          image: {{ include "campaign-manager.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- range $name := list "DATABASE_URL" "SESSION_SECRET" "CRON_SECRET" }}
            {{- include "campaign-manager.secretEnv" (dict "ctx" $ "name" $name) | nindent 12 }}
            {{- end }}
            {{- range $name := list "CRON_SECRET_PREVIOUS" "RAYA_API_KEY" "GOOGLE_SERVICE_ACCOUNT_JSON" "KEYCLOAK_CLIENT_SECRET" }}
            {{- include "campaign-manager.secretEnv" (dict "ctx" $ "name" $name "optional" true) | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "campaign-manager.fullname" . }}-config
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
