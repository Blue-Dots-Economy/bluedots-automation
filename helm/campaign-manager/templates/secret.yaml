{{- /* The one Secret for the whole chart. Skipped when secrets.existingSecret is set; that Secret must carry the same keys. */ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campaign-manager.secretName" . }}
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "campaign-manager.databaseUrl" .Values.database | quote }}
  {{- /* Empty values are skipped: an empty CRON_SECRET_PREVIOUS would otherwise be accepted as a valid secret. */}}
  {{- /* The app refuses to start without these, so fail the install instead. */}}
  {{- $session := required "secrets.SESSION_SECRET is required (openssl rand -hex 32)" .Values.secrets.SESSION_SECRET }}
  {{- if lt (len $session) 32 }}
  {{- fail "secrets.SESSION_SECRET must be at least 32 characters (openssl rand -hex 32)" }}
  {{- end }}
  SESSION_SECRET: {{ $session | quote }}
  CRON_SECRET: {{ required "secrets.CRON_SECRET is required" .Values.secrets.CRON_SECRET | quote }}
  {{- with .Values.secrets.CRON_SECRET_PREVIOUS }}
  CRON_SECRET_PREVIOUS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.RAYA_API_KEY }}
  RAYA_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: {{ . | quote }}
  {{- end }}
  {{- if .Values.pipeline.enabled }}
  {{- with .Values.pipeline.secrets.CLIENT_SECRET }}
  CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.dbInit.enabled }}
  DB_ADMIN_PASSWORD: {{ required "database.admin.password is required" .Values.database.admin.password | quote }}
  DB_PASSWORD: {{ required "database.password is required" .Values.database.password | quote }}
  {{- end }}
{{- end }}
