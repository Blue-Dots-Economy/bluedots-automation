{{- /*
  Skipped when secrets.existingSecret is set — the operator then owns a Secret
  carrying the same keys as .Values.secrets.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campaign-manager.secretName" . }}
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := omit .Values.secrets "existingSecret" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
