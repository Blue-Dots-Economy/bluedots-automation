{{- /* Skipped when secrets.existingSecret is set; that Secret must carry DATABASE_URL too. */ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campaign-manager.secretName" . }}
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "campaign-manager.databaseUrl" (dict "db" .Values.database "user" "cm_app" "password" .Values.database.appPassword "key" "database.appPassword") | quote }}
  {{- /* Empty values are skipped: an empty CRON_SECRET_PREVIOUS would otherwise be accepted as a valid secret. */}}
  {{- range $key, $value := omit .Values.secrets "existingSecret" }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
