{{- if and .Values.pipeline.enabled (not .Values.pipeline.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campaign-manager.pipeline.secretName" . }}
  labels:
    {{- include "campaign-manager.pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "campaign-manager.databaseUrl" (dict "db" .Values.database "user" "purple_loader" "password" .Values.database.pipelinePassword "key" "database.pipelinePassword") | quote }}
  RAYA_API_KEY: {{ default .Values.secrets.RAYA_API_KEY .Values.pipeline.secrets.RAYA_API_KEY | quote }}
  CLIENT_SECRET: {{ .Values.pipeline.secrets.CLIENT_SECRET | quote }}
{{- end }}
