{{- /* Post-install/upgrade hook; idempotent. Step 2 mirrors init_db.py, which is not in the image. */ -}}
{{- if and .Values.pipeline.enabled .Values.pipeline.dbInit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "campaign-manager.pipeline.name" . }}-dbinit
  labels:
    {{- include "campaign-manager.pipeline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "campaign-manager.pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pipeline-dbinit
    spec:
      restartPolicy: Never
      {{- include "campaign-manager.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: create-database
          image: "{{ .Values.pipeline.dbInit.image.repository }}:{{ .Values.pipeline.dbInit.image.tag }}"
          imagePullPolicy: {{ .Values.pipeline.dbInit.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ required "pipeline.database.host is required" .Values.pipeline.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.pipeline.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.pipeline.dbInit.admin.user | quote }}
            - name: PD_ROLE
              value: {{ .Values.pipeline.database.user | quote }}
            - name: PD_DB
              value: {{ .Values.pipeline.database.name | quote }}
          envFrom:
            - secretRef:
                name: {{ include "campaign-manager.pipeline.name" . }}-dbinit
          command:
            - sh
            - -ec
            - |
              echo "waiting for postgres at $PGHOST:$PGPORT"
              i=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -gt 60 ] && { echo "postgres not reachable" >&2; exit 1; }
                sleep 3
              done
              echo "creating role $PD_ROLE, database $PD_DB and the Supabase grant roles if missing"
              psql -v ON_ERROR_STOP=1 -d postgres -v role="$PD_ROLE" -v pw="$PD_ROLE_PASSWORD" -v db="$PD_DB" <<'EOSQL'
                SELECT format('CREATE ROLE %I LOGIN', :'role')
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role')\gexec
                SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'role', :'pw')\gexec
                -- RDS: the master must be a member of the owner role to create its database
                GRANT :"role" TO CURRENT_USER;
                SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role')
                  WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
                -- Roles the schema grants to; the pipeline role cannot create them
                SELECT format('CREATE ROLE %I NOLOGIN', r)
                  FROM unnest(ARRAY['anon', 'authenticated', 'service_role']) AS r
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = r)\gexec
              EOSQL
              echo "database ready"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: apply-schema
          image: {{ include "campaign-manager.pipeline.image" . | quote }}
          imagePullPolicy: {{ .Values.pipeline.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "campaign-manager.pipeline.secretName" . }}
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - sh
            - -ec
            - |
              python - <<'PY'
              import pathlib
              import db
              db.require_url()
              print(db.describe())
              db.ensure_supabase_roles()
              for table in ("purple_dots_calls", "purple_dots_connections"):
                  db.disable_rls(table)
              for name in ("sql/create_purple_dots.sql", "sql/create_purple_dots_s3.sql"):
                  db.run_sql_file(pathlib.Path(name))
                  print("ok", name)
              PY
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
{{- end }}
