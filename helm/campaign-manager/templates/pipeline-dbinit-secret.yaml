{{- if and .Values.pipeline.enabled .Values.pipeline.dbInit.enabled }}
{{- /* Admin and role passwords, for the DB init Job only — kept out of the CronJob's env. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campaign-manager.pipeline.name" . }}-dbinit
  labels:
    {{- include "campaign-manager.pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  PGPASSWORD: {{ required "pipeline.dbInit.admin.password is required when pipeline.dbInit.enabled" .Values.pipeline.dbInit.admin.password | quote }}
  PD_ROLE_PASSWORD: {{ required "pipeline.database.password is required" .Values.pipeline.database.password | quote }}
{{- end }}
