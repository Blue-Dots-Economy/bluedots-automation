{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rayaSync.fullname" . }}-config
  labels:
    {{- include "rayaSync.labels" . | nindent 4 }}
data:
  {{- /* Empty values are skipped: a set-but-empty variable would beat the pipeline's own default. */}}
  {{- range $key, $value := .Values.config }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
