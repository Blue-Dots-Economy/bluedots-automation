{{- if and .Values.global.enabled .Values.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "rayaSync.fullname" . }}
  labels:
    {{- include "rayaSync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "rayaSync.selectorLabels" . | nindent 12 }}
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
            checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        spec:
          restartPolicy: Never
          {{- include "rayaSync.imagePullSecrets" . | nindent 10 }}
          containers:
            - name: raya-sync
              image: {{ include "rayaSync.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # The image's entrypoint is load_purple.py; run the whole pipeline instead.
              command: ["python", "run_pipeline.py"]
              {{- with .Values.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                {{- include "rayaSync.secretEnv" (dict "ctx" . "name" "DATABASE_URL") | nindent 16 }}
                {{- include "rayaSync.secretEnv" (dict "ctx" . "name" "RAYA_API_KEY" "optional" true) | nindent 16 }}
              envFrom:
                - configMapRef:
                    name: {{ include "rayaSync.fullname" . }}-config
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
