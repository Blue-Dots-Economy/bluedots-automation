{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rayaSync.secretName" . }}
  labels:
    {{- include "rayaSync.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "rayaSync.databaseUrl" .Values.global.database | quote }}
  {{- with .Values.global.rayaApiKey }}
  RAYA_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
