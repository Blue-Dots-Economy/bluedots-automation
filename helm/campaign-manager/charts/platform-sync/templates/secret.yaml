{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platformSync.secretName" . }}
  labels:
    {{- include "platformSync.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "platformSync.databaseUrl" .Values.global.database | quote }}
  {{- with .Values.secrets.SIGNALS_DATABASE_URL }}
  SIGNALS_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.AGG_DATABASE_URL }}
  AGG_DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
