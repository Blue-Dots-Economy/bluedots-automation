{{- /* The one Secret for the app. Skipped when secrets.existingSecret is set; that Secret must carry the same keys. */ -}}
{{- if and .Values.global.enabled (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ include "app.databaseUrl" .Values.global.database | quote }}
  {{- with .Values.secrets.SESSION_SECRET }}
  SESSION_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.CRON_SECRET }}
  CRON_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.CRON_SECRET_PREVIOUS }}
  CRON_SECRET_PREVIOUS: {{ . | quote }}
  {{- end }}
  {{- with .Values.global.rayaApiKey }}
  RAYA_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GOOGLE_SERVICE_ACCOUNT_JSON: {{ . | quote }}
  {{- end }}
  KEYCLOAK_CLIENT_SECRET: {{ required "app.secrets.KEYCLOAK_CLIENT_SECRET is required" .Values.secrets.KEYCLOAK_CLIENT_SECRET | quote }}
  {{- if .Values.dbInit.enabled }}
  DB_ADMIN_PASSWORD: {{ required "database.admin.password is required" .Values.database.admin.password | quote }}
  DB_PASSWORD: {{ required "global.database.password is required" .Values.global.database.password | quote }}
  {{- end }}
{{- end }}
