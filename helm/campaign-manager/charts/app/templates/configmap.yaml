{{- if .Values.global.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}-config
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := merge (include "app.loginEnv" . | fromYaml) (.Values.config | default dict) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
