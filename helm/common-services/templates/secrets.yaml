{{- /*
Render the two Secrets the Bitnami subcharts consume by name:
  data-postgres  — keys: postgres-password, aggregator-password, dpg-password
  data-redis     — key:  redis-password
Passwords come from .Values.credentials.* (layered in from the generated global-secrets.yaml).
Skipped at template/lint time if a password is blank.
*/}}
{{- if .Values.credentials.postgresAdminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: data-postgres
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
type: Opaque
stringData:
  postgres-password: {{ .Values.credentials.postgresAdminPassword | quote }}
  aggregator-password: {{ .Values.credentials.aggregatorPassword | quote }}
  dpg-password: {{ .Values.credentials.dpgPassword | quote }}
  {{- if .Values.credentials.signalsExportRoPassword }}
  signals-export-ro-password: {{ .Values.credentials.signalsExportRoPassword | quote }}
  {{- end }}
  {{- if .Values.credentials.keycloakPassword }}
  {{- /* Login password for the shared Keycloak's own Postgres role. The SAME
         value must reach the keycloak release's Secret as POSTGRES_PASSWORD —
         generate it once in global-secrets.yaml and reference it from both, or
         the bootstrap Job and Keycloak disagree and Keycloak cannot connect. */}}
  keycloak-password: {{ .Values.credentials.keycloakPassword | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.credentials.redisPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: data-redis
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
type: Opaque
stringData:
  redis-password: {{ .Values.credentials.redisPassword | quote }}
{{- end }}

{{- /*
  MinIO root credentials. Rendered only when the MinIO subchart is enabled AND a
  password was supplied, so AWS deployments (real S3 + IRSA) emit nothing.

  The KEY NAMES are fixed by the upstream chart, not chosen here: its deployment
  reads `rootUser` and `rootPassword` from whatever Secret `minio.existingSecret`
  names. Rename either key and MinIO starts with empty credentials and rejects
  every request — so keep them in step with charts/minio/templates/secrets.yaml.

  The username is deliberately not a generated secret: MinIO needs a stable
  root identity, and the password is what protects it.
*/}}
{{- if and .Values.minio.enabled .Values.credentials.minioRootPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: data-minio
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
type: Opaque
stringData:
  rootUser: {{ .Values.minio.rootUser | default "bluedots" | quote }}
  rootPassword: {{ .Values.credentials.minioRootPassword | quote }}
  {{- /*
    Secret key for the non-root application user. Lives on THIS Secret rather
    than its own so there is a single MinIO credential object, and is referenced
    from minio.users[].existingSecret/existingSecretKey -- which is what keeps
    it out of global-values.yaml. Emitted only when set, so an environment that
    only wants a root user renders exactly as before.
  */}}
  {{- with .Values.credentials.minioAppSecretKey }}
  appSecretKey: {{ . | quote }}
  {{- end }}
{{- end }}
