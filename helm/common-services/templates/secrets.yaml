{{- /*
Render the two Secrets the Bitnami subcharts consume by name:
  data-postgres  — keys: postgres-password, aggregator-password, dpg-password
  data-redis     — key:  redis-password
Passwords come from .Values.credentials.* (layered in from the generated global-secrets.yaml).
Skipped at template/lint time if a password is blank.
*/}}
{{- if .Values.credentials.postgresAdminPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: data-postgres
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
type: Opaque
stringData:
  postgres-password: {{ .Values.credentials.postgresAdminPassword | quote }}
  aggregator-password: {{ .Values.credentials.aggregatorPassword | quote }}
  dpg-password: {{ .Values.credentials.dpgPassword | quote }}
  {{- if .Values.credentials.signalsExportRoPassword }}
  signals-export-ro-password: {{ .Values.credentials.signalsExportRoPassword | quote }}
  {{- end }}
  {{- if .Values.credentials.keycloakPassword }}
  {{- /* Login password for the shared Keycloak's own Postgres role. The SAME
         value must reach the keycloak release's Secret as POSTGRES_PASSWORD —
         generate it once in global-secrets.yaml and reference it from both, or
         the bootstrap Job and Keycloak disagree and Keycloak cannot connect. */}}
  keycloak-password: {{ .Values.credentials.keycloakPassword | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.credentials.redisPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: data-redis
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
type: Opaque
stringData:
  redis-password: {{ .Values.credentials.redisPassword | quote }}
{{- end }}
