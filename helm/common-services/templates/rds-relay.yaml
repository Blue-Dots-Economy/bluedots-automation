# -----------------------------------------------------------------------------
# rds-relay — in-cluster TCP relay to the (private) RDS Postgres, for laptop
# access via `kubectl port-forward` + DBeaver/psql.
#
# Why: the RDS instance is PubliclyAccessible=false in isolated subnets, so it is
# only reachable from inside the VPC. This pod (on an EKS node whose SG is allowed
# on the DB SG) relays localhost:5432 -> RDS:5432. It is DB-agnostic — pick the
# database/user at connect time (dpg, aggregator, keycloak all live on this RDS).
#
# Usage — from a laptop (socat + port-forward):
#   kubectl -n default port-forward svc/rds-relay 5432:5432   # keep open
#   # DBeaver/psql -> localhost:5432, database+user of your choice
#
# Usage — one-off queries in-cluster (the `psql` sidecar):
#   kubectl -n default exec deploy/rds-relay -c psql -- \
#     env PGPASSWORD=... psql -h <rds-host> -U dpg -d dpg -tAc 'SELECT 1;'
#
# The sidecar exists because with RDS the Bitnami Postgres StatefulSet is
# disabled, so there is no database pod to exec into. Operator tooling
# (get-signalstack-org-id.sh) would otherwise have to spawn a throwaway pod per
# query; this makes the relay the one predictable place to run psql, mirroring
# how the in-cluster Postgres pod has always been used. It only sleeps — it
# opens no port and is not in the relay path, so it cannot affect socat.
#
# Retarget a different RDS: edit DB_HOST below (and DB_PORT if needed).
#
# SECURITY: this exposes a PROD database to anything in-cluster that can reach the
# pod on 5432. Keep it short-lived; delete when not actively used. Consider a
# NetworkPolicy if it must live longer.
# -----------------------------------------------------------------------------
{{- if and .Values.rdsRelay.enabled .Values.postgres.host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-relay
  namespace: default
  labels:
    app.kubernetes.io/name: rds-relay
    app.kubernetes.io/component: db-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-relay
        app.kubernetes.io/component: db-tunnel
    spec:
      # socat listens on 5432 (>1024), so it needs no privileges.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: socat
          image: alpine/socat:latest   # pin to a digest/tag for reproducibility
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.postgres.port | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - exec socat -d -d "TCP-LISTEN:${LISTEN_PORT},fork,reuseaddr" "TCP:${DB_HOST}:${DB_PORT}"
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            tcpSocket: { port: pg }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: pg }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
        {{- if .Values.rdsRelay.psql.enabled }}
        # psql client for one-off in-cluster queries. Sleeps forever; the only
        # way anything runs here is `kubectl exec`. No port, no probes — it must
        # never gate the relay's readiness, since socat is the actual service.
        - name: psql
          image: "{{ .Values.rdsRelay.psql.image.repository }}:{{ .Values.rdsRelay.psql.image.tag }}"
          imagePullPolicy: {{ .Values.rdsRelay.psql.image.pullPolicy }}
          command: ["sleep", "infinity"]
          env:
            # The pod runs as uid 65532, which owns no home directory in this
            # image. Without HOME pointing somewhere writable, psql fails to
            # write .psql_history and warns on every interactive session.
            # Non-interactive `-tAc` calls are unaffected either way.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # Not readOnlyRootFilesystem: psql writes a history file and temp
            # files under $HOME, and the postgres image's entrypoint expects a
            # writable /tmp. socat above keeps its read-only root regardless.
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.rdsRelay.psql.resources | nindent 12 }}
        {{- end }}
{{- end }}
---
{{- if and .Values.rdsRelay.enabled .Values.postgres.host }}
apiVersion: v1
kind: Service
metadata:
  name: rds-relay
  namespace: default
  labels:
    app.kubernetes.io/name: rds-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rds-relay
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}