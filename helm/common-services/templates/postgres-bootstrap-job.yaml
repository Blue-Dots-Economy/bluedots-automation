{{- /*
Bootstrap the managed (RDS) Postgres: create the per-tenant roles, databases and
extensions that the Bitnami initdb script used to create in-cluster. Runs as a
post-install/post-upgrade hook so it executes after the `data-postgres` Secret
(rendered by secrets.yaml) exists, and before signals/aggregator deploy.

Idempotent: roles are created-if-missing then password-synced; databases use the
SELECT ... \gexec guard (CREATE DATABASE cannot run inside a transaction/DO block);
extensions use CREATE EXTENSION IF NOT EXISTS.

Renders only when bootstrap is enabled AND the RDS host + admin password are known,
so `helm template`/`lint` stay clean before the opentofu overlay populates them.
*/}}
{{- if and .Values.postgresBootstrap.enabled .Values.postgres.host .Values.credentials.postgresAdminPassword }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-postgres-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: common-services
    app.kubernetes.io/component: postgres-bootstrap
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: common-services
        app.kubernetes.io/component: postgres-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: postgres-bootstrap
          image: "{{ .Values.postgresBootstrap.image.repository }}:{{ .Values.postgresBootstrap.image.tag }}"
          imagePullPolicy: {{ .Values.postgresBootstrap.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: postgres-password
            - name: AGG_PW
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: aggregator-password
            - name: DPG_PW
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: dpg-password
            - name: KC_PW
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: keycloak-password
                  optional: true
            - name: CM_SIGNALS_RO_PW
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: campaign-manager-signals-ro-password
                  optional: true
            - name: AGG_EXPORT_RO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-postgres
                  key: aggregator-export-ro-password
                  optional: true
          command:
            - sh
            - -ec
            - |
              echo "waiting for postgres at $PGHOST:$PGPORT"
              i=0
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U postgres >/dev/null 2>&1; do
                i=$((i+1)); [ "$i" -gt 60 ] && { echo "postgres not reachable" >&2; exit 1; }
                sleep 3
              done
              echo "postgres ready; creating roles + databases"
              # Roles + databases on the default `postgres` db. Passwords passed as
              # psql variables (:'var') so they are safely quoted, never interpolated.
              psql -v ON_ERROR_STOP=1 -d postgres -v agg_pw="$AGG_PW" -v dpg_pw="$DPG_PW" -v kc_pw="${KC_PW:-}" -v cm_signals_ro_pw="${CM_SIGNALS_RO_PW:-}" -v agg_export_ro_password="${AGG_EXPORT_RO_PASSWORD:-}" <<-'EOSQL'
                SELECT 'CREATE ROLE aggregator LOGIN'
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='aggregator')\gexec
                SELECT 'CREATE ROLE dpg LOGIN'
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='dpg')\gexec
                ALTER ROLE aggregator WITH PASSWORD :'agg_pw';
                ALTER ROLE dpg        WITH PASSWORD :'dpg_pw';
                {{- if .Values.postgresBootstrap.keycloakRole.enabled }}
                -- Keycloak is a common service now, so it gets its own role rather
                -- than logging in as `aggregator`. Creating the role is always safe;
                -- what matters is the OWNER of the keycloak database below.
                --
                -- EXISTING ENVIRONMENTS: the `keycloak` database already exists owned
                -- by `aggregator`, and the CREATE DATABASE guard below is a no-op, so
                -- the owner does NOT change. Those environments must keep pointing
                -- Keycloak at the `aggregator` role (set postgres.username=aggregator
                -- in the keycloak release). Re-owning a live database is not worth the
                -- risk — see the plan's §11.4.
                SELECT 'CREATE ROLE {{ .Values.postgresBootstrap.keycloakRole.name }} LOGIN'
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='{{ .Values.postgresBootstrap.keycloakRole.name }}')\gexec
                ALTER ROLE {{ .Values.postgresBootstrap.keycloakRole.name }} WITH PASSWORD :'kc_pw';
                {{- end }}
                {{- if .Values.postgresBootstrap.campaignManagerSignalsRole.enabled }}
                SELECT 'CREATE ROLE {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }} LOGIN'
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='{{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }}')\gexec
                ALTER ROLE {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }} WITH PASSWORD :'cm_signals_ro_pw';
                ALTER ROLE {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }} SET default_transaction_read_only = on;
                {{- end }}
                {{- if .Values.postgresBootstrap.aggregatorExportRole.enabled }}
                SELECT 'CREATE ROLE {{ .Values.postgresBootstrap.aggregatorExportRole.name }} LOGIN'
                  WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname='{{ .Values.postgresBootstrap.aggregatorExportRole.name }}')\gexec
                ALTER ROLE {{ .Values.postgresBootstrap.aggregatorExportRole.name }} WITH PASSWORD :'agg_export_ro_password';
                ALTER ROLE {{ .Values.postgresBootstrap.aggregatorExportRole.name }} SET default_transaction_read_only = on;
                {{- end }}
                -- On RDS the master is not a true superuser: to CREATE DATABASE owned
                -- by a role it must be a member of that role (PG16+ "must be able to
                -- SET ROLE"). Grant each owner to the current (master) user first.
                {{- range .Values.postgresBootstrap.databases }}
                GRANT {{ .owner }} TO CURRENT_USER;
                {{- end }}
                {{- range .Values.postgresBootstrap.databases }}
                SELECT 'CREATE DATABASE {{ .name }} OWNER {{ .owner }}'
                  WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='{{ .name }}')\gexec
                {{- end }}
              EOSQL
              # Extensions per database, created as the master (rds_superuser on RDS) —
              # required for postgis/vector, which the non-super app roles cannot create.
              {{- range .Values.postgresBootstrap.databases }}
              {{- if .extensions }}
              echo "creating extensions on {{ .name }}: {{ join ", " .extensions }}"
              psql -v ON_ERROR_STOP=1 -d {{ .name }} <<-'EOSQL'
                {{- range .extensions }}
                CREATE EXTENSION IF NOT EXISTS {{ . }};
                {{- end }}
              EOSQL
              {{- end }}
              {{- end }}
              {{- if .Values.postgresBootstrap.campaignManagerSignalsRole.enabled }}
              echo "granting column-level SELECT to {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }} on {{ .Values.postgresBootstrap.campaignManagerSignalsRole.database }}"
              # Column-level GRANT targets named tables, so each is guarded on the
              # table existing (it may not, this early in the deploy order).
              psql -v ON_ERROR_STOP=1 -d {{ .Values.postgresBootstrap.campaignManagerSignalsRole.database }} <<-'EOSQL'
                GRANT CONNECT ON DATABASE {{ .Values.postgresBootstrap.campaignManagerSignalsRole.database }} TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }};
                GRANT USAGE ON SCHEMA public TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }};
                DO $grant$
                BEGIN
                  IF to_regclass('public."user"') IS NULL OR to_regclass('public.organization') IS NULL THEN
                    RAISE NOTICE 'Signals tables not created yet; re-run common-services after Signals to apply these grants';
                  END IF;
                  IF to_regclass('public."user"') IS NOT NULL THEN
                    EXECUTE 'GRANT SELECT (id, created_at, updated_at, domains, onboarded_by_org_id, '
                      || 'onboarded_via, onboarded_source_id, onboarded_at, onboarded_by_default, tags) ON "user" TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }}';
                  END IF;
                  IF to_regclass('public.items') IS NOT NULL THEN
                    EXECUTE 'GRANT SELECT (item_network, item_domain, item_type, item_id, lifecycle_status, '
                      || 'created_by, item_locations, created_at, updated_at, item_state) ON items TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }}';
                  END IF;
                  IF to_regclass('public.item_actions') IS NOT NULL THEN
                    EXECUTE 'GRANT SELECT (action_id, partition_network, action_type, action_status, update_count, '
                      || 'source_item_network, source_item_domain, source_item_type, source_item_id, source_item_owner, '
                      || 'target_item_network, target_item_domain, target_item_type, target_item_id, target_item_owner, '
                      || 'performed_by_org_id, created_at, updated_at) ON item_actions TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }}';
                  END IF;
                  IF to_regclass('public.organization') IS NOT NULL THEN
                    EXECUTE 'GRANT SELECT (id, type) ON organization TO {{ .Values.postgresBootstrap.campaignManagerSignalsRole.name }}';
                  END IF;
                END $grant$;
              EOSQL
              {{- end }}
              {{- if .Values.postgresBootstrap.aggregatorExportRole.enabled }}
              {{- $r := .Values.postgresBootstrap.aggregatorExportRole }}
              echo "granting column-level SELECT to {{ $r.name }} on {{ $r.database }}"
              psql -v ON_ERROR_STOP=1 -d {{ $r.database }} <<-'EOSQL'
                GRANT CONNECT ON DATABASE {{ $r.database }} TO {{ $r.name }};
                GRANT USAGE ON SCHEMA public TO {{ $r.name }};
                -- Only the columns platform-sync reads; skipped until the tables exist.
                DO $grant$
                BEGIN
                  IF to_regclass('public.organisations') IS NOT NULL
                     AND to_regclass('public.users') IS NOT NULL THEN
                    GRANT SELECT (id, name, org_type, status, rejected_at)
                      ON organisations TO {{ $r.name }};
                    GRANT SELECT (org_id, user_type, signalstack_org_id, signalstack_org_name,
                                  serves, status, created_at)
                      ON users TO {{ $r.name }};
                  ELSE
                    RAISE NOTICE 'aggregator tables not created yet; grants applied on a later upgrade';
                  END IF;
                END
                $grant$;
              EOSQL
              {{- end }}
              echo "[common-services] postgres bootstrap complete"
          resources: {{- toYaml .Values.postgresBootstrap.resources | nindent 12 }}
{{- end }}
