# ═══════════════════════════════════════════════════════════════════════════
# aggregator-dpg umbrella chart — single values file (dev + prod).
#
# Defaults are dev-safe. For any deployment, review every line tagged
# `# UPDATE:` and override via:
#   1. Editing this file directly (single-cluster / dev), OR
#   2. `helm upgrade ... --set key=value` (CI / per-deploy overrides), OR
#   3. A vaulted Secret pointed to by `global.existingSecret` (prod).
# ═══════════════════════════════════════════════════════════════════════════

global:
  # UPDATE: public FQDN that ingress + KC issuer + email links use.
  publicHost: purpledots.servehalflife.com
  # UPDATE: http for local, https when cert-manager issues a cert.
  publicProtocol: https

  # Campaign PII export retention (days). Drives EXPORT_URL_TTL_SECONDS (× 86400) here AND
  # the S3 lifecycle expiry in opentofu — set it once in global-values.yaml. Default 1 day.
  campaignExportExpiryDays: 1

  # Container registry — left empty intentionally. Bitnami subcharts
  # (postgresql, redis) read `global.imageRegistry` first and would otherwise
  # have `docker.io/bitnamilegacy/...` rewritten to `<registry>/bitnamilegacy/...`
  # causing ImagePullBackOff. Set the full registry path in each
  # `image.repository` field below instead.
  imageRegistry: ''
  # List of Secret NAMES (strings) — helper renders `- name: <value>`.
  # Source: either pre-created Secret OR rendered via templates/ghcr-pull-secret.yaml
  # (toggle via `imagePullSecret.create=true` below).
  imagePullSecrets:
    - ghcr-pull

  # Cluster storage class for PVCs. Empty = cluster default.
  storageClass: ''

  # Shared realm name. MUST match the keycloak release's global.keycloakRealm and
  # signals' KEYCLOAK_REALM — one realm holds both DPGs' clients. Per-instance,
  # derived from the network/domain; set it in global-values.yaml.
  keycloakRealm: aggregator

  # Where the shared Keycloak lives. The PUBLIC issuer is still
  # <publicProtocol>://<publicHost>/auth (Kong serves it), so this only covers
  # server-to-server calls that should not egress via the ingress.
  keycloak:
    namespace: common-services
    serviceName: keycloak-keycloak   # <release>-<subchart> of the keycloak release
    servicePort: 8080
    # Full-URL override, e.g. while an environment still runs a local Keycloak.
    internalUrl: ''

  # Active signalstack network. Drives the api/worker/web config-folder
  # selection and the keycloak themes-init image tag. Set per environment
  # via the _network anchor in opentofu/aws/<env>/global-values.yaml.
  aggregatorNetwork: purple_dot

  # Brand skin over the network (UI/config skin; does NOT change the upstream
  # network identity). Exposed to api/worker/web as AGGREGATOR_BRAND. Empty =
  # standard dots. Set per release (e.g. upsdm over blue_dot, onetac over
  # orange_dot); switching brand = change this value + redeploy the matching
  # keycloak theme image tag.
  aggregatorBrand: ''

  # Deliver aggregator.config.yaml to api + worker from the {release}-network-config
  # ConfigMap (source: files/network-config/aggregator.config.yaml, fetched per
  # deploy by scripts/fetch-configs.sh) instead of the copy baked into the image.
  # Keep true: it is what makes the network binding, brand strings, domain labels
  # and registration modes changeable without an image rebuild.
  #
  # false falls back to the image-baked config, and is how static renders with no
  # fetched file pass (install.sh lint, CI helm job).
  #
  # A change to that file needs a pod restart — subPath mounts don't hot-update and
  # the config is boot-cached in-process. deploy_aggregator handles this.
  networkConfigDelivery: true

  # ── Upstream network.json source ──────────────────────────────────────────
  # The aggregator fetches network.json over HTTPS at boot rather than mounting it,
  # so a URL is the only interface. This block builds it and emits it as
  # AGGREGATOR_NETWORK_SOURCE to api + worker (both run the loader; web does not),
  # overriding `aggregator.network.source` in the delivered config file.
  #
  # The derivation mirrors scripts/fetch-configs.sh's signals target
  # (<raw>/<repo>/<ref>/<network>/network.json) so both halves resolve the same
  # network.json, and install.sh passes repo/ref from $SIGNALS_DPG_REPO /
  # $SIGNALS_DPG_REF to keep them in lockstep. Requires aggregator-dpg#513 in the
  # deployed image; older images ignore the env var.
  networkSource:
    # UPDATE: pin a tag/SHA for prod — via SIGNALS_DPG_REF, so signals moves with it.
    repo: Blue-Dots-Economy/bluedots-schemas
    ref: main
    # Filename inside the per-network directory.
    file: network.json
    # Brand sub-directory, when the brand ships its OWN network.json (a full copy,
    # not a partial) — mirrors scripts/fetch-configs.sh, which prefers
    # <network>/<brand>/network.json and falls back to <network>/network.json.
    #
    # EMPTY BY DEFAULT and NOT derived from global.aggregatorBrand on purpose. A
    # templated URL cannot fall back on a 404 the way try_fetch does, so coupling
    # this to aggregatorBrand would point every brand-ed deployment at a file that
    # may not exist and break the loader at boot. Set it only where the brand
    # folder really carries network.json.
    brand: ''
    # Full-URL override, for a mirror / internal host / S3 instead of the derivation.
    # Prefer `brand` over hardcoding a URL here: `url` also freezes repo/ref, which
    # breaks the lockstep with $SIGNALS_DPG_REF that keeps both halves on one schema.
    url: ''

  # Support/grievance email injected into the aggregator consent T&C / Privacy /
  # Grievances copy at deploy time — it replaces the __SUPPORT_EMAIL__ placeholder
  # in files/consent/consent.json. Change the email HERE (one place), never in the
  # consent content. A consent change needs a rollout restart of web + api (subPath
  # mount doesn't hot-update).
  consentSupportEmail: hello@bluedotseconomy.org

  # ── Onboarding capability allow-list (AGGREGATOR_ONBOARDING_ENABLED) ───────
  # Comma-separated allow-list of the registration modes this deployment offers.
  # Recognised today: `form`, `voice` (`bulk` is reserved and currently gates
  # nothing). Emitted to the api only — worker and web do not read it.
  #
  # READ THIS BEFORE CHANGING: empty is NOT the same as unset.
  #   unset / omitted  -> ALL capabilities enabled (the api's default)
  #   "form"           -> form only; voice registration is off
  #   ""  (empty!)     -> NOTHING enabled — every registration mode is disabled
  #                       and every public-link creation fails with a 400
  # The api is fail-closed by design, so the api ConfigMap template OMITS the key
  # entirely when this is empty rather than rendering `""`. That conditional is
  # load-bearing; do not "tidy" it into an unconditional line.
  #
  # UAT: blue_dot and purple_dot want `form` (voice forms off).
  onboardingEnabled: ''

  # ── Signals UI hand-off (SIGNALS_UI_URLS) ─────────────────────────────────
  # Comma-separated `domain=url` pairs mapping each network domain to the login
  # page of the Signals UI that fronts it, e.g.
  #   seeker=https://seeker.example.org/auth/login,provider=https://provider.example.org/auth/login
  # Each network domain is served by its OWN Signals UI, so there is one pair per
  # domain — not one shared URL. Emitted to the api only.
  #
  # It powers the "Already Registered — Sign In" chooser and the post-submit
  # redirect; leave it empty and that hand-off is invisible to every user.
  #
  # The URL MUST be the Signals **UI** login page (normally `<origin>/auth/login`)
  # and NEVER a Keycloak authorization URL. A Keycloak authorize URL embeds
  # one-time `state`/PKCE values bound to the browser session that generated them,
  # so a copied one fails for every user who follows it.
  #
  # Omitted from the rendered ConfigMap when empty — an empty value here is merely
  # inert rather than dangerous, but it keeps both new keys consistent.
  signalsUiUrls: ''

  # Signal-stack integration. Used by api/worker to call the signal-stack
  # admin API (POST /api/v1/admin/aggregator/upsert, etc.).
  #   - actingOrgId: signal-stack `organization` row of type `network_service`
  #     that represents aggregator-dpg itself. Sent as `x-acting-org-id` on
  #     every admin call. Read from signal-stack DB after install — match the
  #     SLUG too, since every integrating service (signals-search-client,
  #     raya-voice-bot, …) also has type `network_service`:
  #       SELECT id FROM organization WHERE type='network_service' AND slug='aggregator-dpg';
  #   - baseUrl + adminKey are wired via secret/configmap elsewhere.
  signalstack:
    actingOrgId: '' # REQUIRED before login; otherwise SIGNALSTACK_ORG_NOT_REGISTERED

  oidc:
    clientId: aggregator-portal
    scope: 'openid profile email'

  # ── Token client-scoping (`azp` allow-lists, api-only) ────────────────────
  # Defence-in-depth over issuer-only verification: `azp` is the client that
  # requested the token, so an allow-list stops a token minted for a DIFFERENT
  # client in the same realm being replayed against this API.
  #
  # BOTH ARE FAIL-OPEN IN THE APP, which is why they carry real defaults here
  # rather than empty strings. `assertAllowedAzp` returns early on an empty
  # list ("gate disabled when unconfigured"), so a blank value is not a
  # tightening — it silently removes the check. Keep them populated.
  #
  # keycloakAllowedAzp: the three clients the shared realm defines for this DPG
  # (helm/keycloak realm.json). Must stay in step with that realm — a client
  # renamed there and not here fails every exchange with AzpNotAllowedError.
  keycloakAllowedAzp: 'aggregator-portal,aggregator-api,aggregator-bff'
  # campaignManagerAllowedAzp: REPLACES the list above on the /v1/campaign/*
  # routes only (export, email, voice, dump), scoping them to the external
  # campaign-manager client. The app falls back to this same literal when the
  # var is blank or parses to an empty list, so it can never un-gate the most
  # sensitive routes — set explicitly anyway, so the deployed value is visible
  # in the ConfigMap instead of implied by the image.
  campaignManagerAllowedAzp: 'campaign-manager'

  # UPDATE: S3 wiring for bulk uploads, QR PNGs, error CSVs.
  s3:
    region: ap-south-1
    bucket: aggregator-bulk-uploads
    forcePathStyle: false

  # ── Signals non-PII dump download API (api-only) ──────────────────────────
  # `GET /v1/campaign/dump` hands the campaign manager pre-signed URLs for the
  # Signals non-PII snapshot, so it needs no S3 credentials of its own. The
  # objects are written by the SIGNALS `s3-export` CronJob — a different helm
  # release — at three fixed keys, overwritten in place every run:
  #
  #     [<prefix>/]<network>/<instance_id>/{user,items,item_actions}.ndjson.gz
  #
  # There is no manifest and no dated run folder, so the key root is CONFIGURED
  # and never probed: a wrong value returns 404 DUMP_NOT_AVAILABLE rather than
  # serving a different dataset. `<network>` is read from the resolved
  # aggregator.config.yaml, not from env, so it cannot drift; the other two
  # segments are the two knobs below.
  #
  # THE BUCKET MUST ALSO MATCH. The api reads global.s3.bucket above; the
  # exporter writes to s3-export.s3.bucket in the signals release. Both are
  # pinned to the same generated `public` bucket by global-cloud-values.yaml
  # (see opentofu/CLAUDE.md — "One bucket, one role").
  #
  # instanceId: the Signals instance THIS deployment serves — one aggregator
  # deployment serves exactly one, hence no request parameter. It must equal
  # `s3-export.instances[].id` in the signals values. NO DEFAULT ON PURPOSE:
  # empty is inert (every dump call returns 503 DUMP_NOT_CONFIGURED with
  # reason CAMPAIGN_DUMP_INSTANCE_ID_UNSET) rather than booting the API onto a
  # guessed dataset, so deployments that do not use the campaign manager are
  # unaffected. Bind it to the same anchor as the exporter's id in
  # <env>/global-values.yaml so the two cannot drift apart.
  campaignDumpInstanceId: ''
  # prefix: MUST equal `s3-export.s3.prefix` in the signals release. Empty on
  # both sides means keys start at the <network> segment, which is the
  # exporter's default — if DevOps sets a prefix on the cron, change it here in
  # the same window or every dump call 404s.
  campaignDumpPrefix: ''

  # ── Raya voice provider (worker-only) ─────────────────────────────────────
  # Outbound leg of the campaign voice channel: the worker calls Raya's hosted
  # API to place calls. The API KEY is a real third-party credential and lives
  # in the umbrella Secret as `secrets.rayaApiKey` below, never here.
  #
  # Leave this EMPTY to use the app's own default (https://v1.getraya.app/api);
  # the worker ConfigMap omits the key entirely when blank. Do not "helpfully"
  # render it unconditionally: the worker parses it as
  # `z.string().url().default(...)`, and `""` is not a valid URL, so an empty
  # render fails ConfigSchema.parse at boot and takes the WHOLE worker down —
  # every queue, not just voice jobs. Set it only for a non-prod Raya endpoint.
  rayaBaseUrl: ''

  # If set, subcharts reference this Secret name instead of the umbrella's
  # templated `{release}-secrets`. The named Secret MUST exist before
  # `helm install` and carry every key listed under `secrets.*` below.
  existingSecret: ''

  # Shared data layer location (common-services release). Cross-namespace
  # service coordinates for the shared Postgres + Redis. Lives under `global`
  # so subcharts (keycloak) can resolve the DB host too. Defaults assume the
  # common-services release name `platform` in namespace `common-services`.
  dataPlatform:
    namespace: common-services
    # Full Postgres endpoint (e.g. an RDS hostname). When set, it takes precedence
    # over postgresService in the aggregator.postgresHost helper + keycloak KC_DB_URL.
    # Populated by the opentofu overlay; empty falls back to the in-cluster FQDN.
    postgresHost: ""
    postgresService: platform-postgresql
    redisService: platform-redis-master
    redisPort: 6379

  # Workaround for compose `extra_hosts: PUBLIC_HOST:host-gateway`. Add an
  # entry per app pod so server-side OIDC discovery doesn't bounce through
  # external DNS. Usually empty in cloud clusters.
  hostAliases: []

  # UPDATE: debug for local, info for prod.
  appLogLevel: debug

  # Signalstack (signals-DPG) integration. When both are set, api + worker
  # push participants outward via POST /api/v1/admin/* with `x-api-key`.
  # baseUrl = in-cluster DNS to the signals api svc; adminKey = raw key
  # provisioned by signals-DPG's helm migrate-job (see secrets.signalstackAdminKey).
  signalstackBaseUrl: 'http://signals-api.signals.svc.cluster.local:2742'

# ─── Image pull Secret (optional, renders templates/ghcr-pull-secret.yaml) ──
# Default: pre-create the Secret out-of-band; chart only references it.
# Set create=true + supply username/password to let helm manage it instead.
# DO NOT commit a real PAT here — pass via --set at install time.
imagePullSecret:
  create: false
  name: ghcr-pull
  registry: ghcr.io
  username: ''
  password: '' # GHCR PAT with read:packages scope
  email: ''

# ─── Ingress (Kong) ────────────────────────────────────────────────────────
# The Ingress OBJECTS are now template-driven and owned per subchart
# (api/keycloak/web → templates/ingress.yaml in each). Per-route config lives
# under each subchart's `ingress:` block below (api.ingress / keycloak.ingress /
# web.ingress). The shared host comes from global.publicHost.
#
# This top-level block now only feeds the OPTIONAL in-chart ClusterIssuer
# (templates/clusterissuer.yaml), which renders only when this chart also owns
# cert-manager (cert-manager.enabled). On this platform common-services owns the
# issuer, so it is inert here.
ingress:
  className: kong
  # cert-manager ClusterIssuer name (for the in-chart issuer + the web ingress
  # cert annotation). Empty disables TLS issuance.
  clusterIssuer: letsencrypt-prod
  # ACME registration email for Let's Encrypt account.
  acmeEmail: ops@sanketika.in

# ─── Secrets ───────────────────────────────────────────────────────────────
# All values land in Secret `<release>-secrets`. For prod, set
# `global.existingSecret` and skip this block — values here are ignored.
secrets:
  # Deprecated alias of global.existingSecret. If set, global.existingSecret
  # takes precedence (kept for ergonomic top-level reference).
  existingSecret: ''
  # Postgres password for the shared `aggregator` user in the common-services
  # Postgres. Layered in from the generated global-secrets.yaml at deploy time.
  postgresPassword: change-me-postgres-password
  # Redis password for the shared common-services Redis. Layered in from the
  # generated global-secrets.yaml at deploy time.
  redisPassword: change-me-redis-password
  kcBootstrapAdminPassword: change-me-keycloak-admin
  keycloakAdminClientSecret: change-me-kc-admin-client-secret
  approvalTokenSecret: change-me-32-hex-min-chars-required-here
  sessionKey: change-me-32-hex-min-chars-required-here
  oidcClientSecret: change-me-portal-client-secret
  bffServiceClientSecret: ''
  smtpUser: ''
  smtpPassword: ''
  twilioAccountSid: ''
  twilioAuthToken: ''
  twilioFromNumber: ''
  msg91AuthKey: ''
  awsAccessKeyId: ''
  awsSecretAccessKey: ''
  # Raw apikey for signals-DPG admin onboard. Must match the value in the
  # signals helm release Secret `AGGREGATOR_DPG_API_KEY`.
  signalstackAdminKey: ''
  # Raya API key — the OUTBOUND voice credential (worker → Raya's hosted API).
  # A real third-party secret: it can neither be committed nor generated.
  #
  # Plumbed through the same chain as smtpPassword and msg91AuthKey: hand-entered
  # in <env>/secrets.yaml (key `raya_api_key`), read by the opentofu output-file
  # module on every apply, rendered into the generated global-secrets.yaml, and
  # layered in here via -f at deploy time. Not generated — no generator can invent
  # a third-party API key.
  #
  # The generated file uses the house "UPDATE_THIS_VALUE" placeholder for any
  # hand-entered secret left unfilled. templates/secrets.yaml treats that literal
  # as UNCONFIGURED and omits the Secret key, exactly as it does for empty, so an
  # unfilled placeholder cannot reach the worker as a bogus credential.
  #
  # NOT the same credential as signals' RAYA_VOICE_BOT_API_KEY (INBOUND: the
  # raya bot → the signals api, a better-auth apikey generated by
  # random_passwords) and not secrets.voiceDpgSignalsSecret (the same bot's
  # Keycloak client-credentials secret). Three separate values for one vendor —
  # do not deduplicate them.
  #
  # Empty is SAFE and is the default: templates/secrets.yaml omits the key
  # entirely rather than writing an empty one, and the worker's env is left
  # unset. Voice jobs then still ACCEPT with 202 and fail at dispatch with a
  # lazy ConfigError — every other queue is unaffected. An empty-but-PRESENT
  # value would instead crash the worker at boot (see rayaBaseUrl above:
  # `z.string().min(1).optional()` rejects "", it only accepts undefined).
  rayaApiKey: ''

# ─── Mail wiring (shared by api + keycloak) ────────────────────────────────
mail:
  provider: smtp # smtp | ses
  smtp:
    # Real SMTP relay host. No in-cluster mailcatcher — wire to SES /
    # SendGrid / Workspace SMTP / etc. Empty value disables SMTP wiring.
    host: 'smtp.gmail.com'
    port: 587
    from: no-reply@bluedots.local
    fromDisplay: 'Blue Dots Aggregator'
    secure: false
    starttls: true
    auth: true
  ses:
    from: ''
    configurationSet: ''

# ─── App subcharts ─────────────────────────────────────────────────────────
web:
  # UPDATE: bump for prod (2-3 replicas typical). HPA below scales further.
  replicaCount: 1
  image:
    repository: ghcr.io/blue-dots-economy/aggregator-dpg/web
    tag: 'sha-a374c46'
    pullPolicy: Always
  service:
    port: 3000
  # Template-driven ingress (charts/web/templates/ingress.yaml): path / is fixed
  # in the template. This object owns the cert-manager issuance for the shared
  # host cert; api + keycloak reuse it. Host = global.publicHost.
  ingress:
    enabled: true
    className: kong
    clusterIssuer: letsencrypt-prod
    plugin: rl-agg-web
    annotations:
      konghq.com/read-timeout: "300000"
      konghq.com/write-timeout: "300000"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 1Gi }
    # Tune up for prod (apps/web is a Next.js standalone build).
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70

aggregator-api:
  replicaCount: 1
  image:
    repository: ghcr.io/blue-dots-economy/aggregator-dpg/api
    tag: 'sha-a374c46'
    pullPolicy: Always
  service:
    port: 4000
  # Template-driven ingress (charts/api/templates/ingress.yaml): path /backend +
  # strip-path are fixed in the template. No issuer (web owns the shared cert).
  ingress:
    enabled: true
    className: kong
    plugin: rl-agg-api
    annotations:
      konghq.com/read-timeout: "300000"
      konghq.com/write-timeout: "300000"
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2, memory: 1Gi }
  runMigrationsOnBoot: true
  bulk:
    uploadUrlTtlSeconds: 900
    uploadMaxBytes: 10485760
    qrDownloadUrlTtlSeconds: 900
  adminEmails: ''
  publicLinkBaseUrl: '' # empty => derived from global.publicProtocol+publicHost
  serviceAccount:
    create: true
    # IRSA role for S3/SES (EKS). Pods assume this role via the SA token.
    annotations:
      eks.amazonaws.com/role-arn: ""
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/blue-dots-economy/aggregator-dpg/worker
    tag: 'sha-a374c46'
    pullPolicy: Always
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 1Gi }
  bulk:
    maxRows: 10000
    maxRowBytes: 65536
  cron:
    linkMetricsRollupIntervalMs: 300000
    watchdogIntervalMs: 3600000
  serviceAccount:
    create: true
    # IRSA role for S3/SES (EKS). Pods assume this role via the SA token.
    annotations:
      eks.amazonaws.com/role-arn: ""

# ─── Shared Keycloak ────────────────────────────────────────────────────────
# Keycloak MOVED OUT of this chart. It is now the shared `keycloak` release in the
# common-services namespace (helm/keycloak), serving BOTH DPGs from one realm.
# Its image, replicas, ingress, SMS provider and resources are configured there.
# This chart keeps only what it needs to TALK to it: the realm name
# (global.keycloakRealm), the public issuer (derived from global.publicHost) and
# the cross-namespace coordinates in global.keycloak below.

# ─── Shared Postgres (common-services release) ─────────────────────────────
# The Postgres subchart was removed; api/worker/keycloak connect to the shared
# instance in the common-services release. The `aggregator` user + `aggregator`
# and `keycloak` databases are created by the common-services Postgres bootstrap.
# Host/namespace are resolved by the `aggregator.postgresHost` helper.
postgresql:
  auth:
    username: aggregator
    database: aggregator

# ─── cert-manager toggle ───────────────────────────────────────────────────
# The ingress-nginx + cert-manager subcharts were REMOVED from this chart: the
# shared `common-services` release owns both controllers cluster-wide. This is
# now only a feature flag read by templates/clusterissuer.yaml — keep it false
# so the chart never tries to render its own ClusterIssuer (common-services
# already provides `letsencrypt-prod`).
cert-manager:
  enabled: false

# Namespace-scoped ingress isolation (#1.12). Default OFF: enabling applies an
# Ingress-only NetworkPolicy (templates/networkpolicy.yaml) that restricts which
# namespaces may connect TO aggregator pods. Egress is intentionally unrestricted.
# Keep `common-services` listed — Kong ingress proxies public traffic from there.
networkPolicy:
  enabled: false
  allowedFromNamespaces:
    - common-services
    - monitoring
