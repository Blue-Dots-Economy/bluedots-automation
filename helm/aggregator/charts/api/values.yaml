# Shared host for the ingress; overridden by the umbrella chart's global
# (Helm propagates parent global to subcharts).
global:
  publicHost: aggregator.example.com

# Template-driven ingress (templates/ingress.yaml): path /backend + strip-path
# are fixed in the template; only these scalars vary. Host = global.publicHost.
ingress:
  enabled: false
  className: ""        # e.g. kong
  plugin: ""           # KongClusterPlugin tier, e.g. rl-agg-api
  annotations: {}
  # Kong route-level protocol restriction: only accept https, and redirect a
  # plain-http request to https (see httpsRedirectStatusCode) instead of erroring (GITHUB-ISSUES #10).
  # No-op unless className is "kong".
  forceSSLRedirect: true
  # Status code Kong uses for the plain-http -> https redirect. 308 on API
  # routes, NOT 301: this route carries POSTs (e.g. the aggregator-registration
  # decision endpoint), and clients have historically re-issued a 301'd POST as
  # a GET, which turns a rejected registration into a silent no-op. 308 requires
  # the method and body to be preserved. Kong accepts 426, 301, 302, 307, 308.
  httpsRedirectStatusCode: 308
  # HSTS via a per-chart KongPlugin (response-transformer), referenced alongside
  # `plugin` above through the ingress's konghq.com/plugins annotation — see
  # templates/kong-hsts-plugin.yaml. The API route serves the approval HTML
  # pages and the PII CSV export. No-op unless className is "kong".
  hsts:
    enabled: true
    maxAge: 31536000           # 1 year
    includeSubDomains: true
    # `preload` is deliberately OFF. It is the one HSTS directive that cannot be
    # walked back on browser timescales: combined with includeSubDomains, a
    # preload-list submission commits EVERY subdomain to https-only, and removal
    # ships with browser releases months later. Emitting the directive does not
    # by itself enrol the domain (that needs a submission at hstspreload.org) —
    # but it advertises the intent, and this org still has legacy hosts that
    # would not survive it. Turn it on per environment, after auditing every
    # subdomain of the public host, never as a chart default.
    preload: false

# Per-API (per-resource-group) rate limiting — see
# templates/api-endpoint-groups-ingress.yaml. Each `groups` entry becomes its own
# Kong route (more specific than the /backend catch-all) with its OWN per-IP
# counter. Paths sharing the same effective limit are grouped into ONE generated
# KongPlugin + Ingress, so N APIs with M distinct limits render only M plugins +
# M Ingresses. Renders only when ingress.enabled + ingress.className (kong) are set.
# NOTE: the /backend prefix is stripped by Kong, so each route uses a regex path
# + konghq.com/rewrite to strip ONLY /backend (matching the catch-all's forwarding).
# `path` entries are the segment UNDER /backend (no leading slash, no /backend).
apiRateLimit:
  enabled: true
  defaultMinute: 600   # uniform per-IP requests/min for every API (the one knob; ~10 req/s)
  redis:               # shared common-services Redis Kong uses for counters
    host: common-services-redis-master.common-services.svc.cluster.local
    port: 6379
  # Full coverage — every aggregator-api resource group, all at the uniform
  # default (→ 1 plugin + 1 Ingress). Each prefix is its own Kong route with its
  # OWN per-IP counter and covers all operations beneath it. `public/v1/aggregators`
  # covers the anonymous links/registrations/lookup endpoints. Add a `limit: <n>`
  # on a line only for a rare exception.
  # NOTE: renders only while this chart's ingress is enabled — if aggregator-api
  # is made internal (web BFF proxies to it), the rate-limit Ingress drops too.
  groups:
    - { path: v1/aggregator-registrations }
    - { path: admin/v1/aggregator-registrations }
    - { path: v1/aggregators }
    - { path: v1/bulk-uploads }
    - { path: v1/links }
    - { path: public/v1/aggregators }
    - { path: v1/onboarding }
    - { path: v1/dashboard }
    - { path: v1/aggregator-config }

replicaCount: 1
image:
  repository: aggregator-dpg/api
  tag: ""
  pullPolicy: Always
service:
  port: 4000
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: 2,    memory: 1Gi   }
runMigrationsOnBoot: true
bulk:
  uploadUrlTtlSeconds: 900
  uploadMaxBytes: 10485760
  qrDownloadUrlTtlSeconds: 900
adminEmails: "admin@bluedots.local"
publicLinkBaseUrl: ""
serviceAccount:
  create: true
  annotations: {}
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Pod/container security hardening (#1.12). Mirrors the signals-api baseline:
# non-root uid 1000, drop all Linux capabilities, no privilege escalation.
# Override per-service if an image genuinely needs root (cf. the signals `ui`
# nginx exception in helm/signals/values.yaml).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# RBAC (aggregator-dpg docs/rbac/rbac-edge-enforcement.md). `mode` is the api's
# RBAC_MODE, one switch for the api and its edge:
#   off     — no RBAC and no edge: the pod is the api alone, as before (default)
#   log     — the edge records what it would refuse; a missing route permission
#             is not refused. It still refuses a bad or expired token (401),
#             and every request while OPA cannot answer (fail closed).
#   enforce — the edge refuses a missing route permission (403); the api's
#             per-organisation checks refuse too
# With log or enforce the pod runs the edge: an Envoy sidecar that every
# request reaches first (the Service points at it), which asks the OPA sidecar
# whether the caller's token roles grant the route's permission. The api
# listens on 127.0.0.1 only, so nothing reaches it around Envoy. An init
# container copies the policy and the Envoy template out of the api image
# (/app/policy), so the image must be a build that ships them (aggregator-dpg
# #910); an older image fails the init container and the pod never starts.
# Needs Kubernetes 1.32 or later. See docs/aggregator-rbac-opa-plan.md.
rbac:
  mode: "off"
  # How often each api replica re-reads the role catalogue, reloads it when a
  # role changed and re-publishes it to OPA (RBAC_CATALOGUE_REFRESH_MS); 0 = never.
  catalogueRefreshMs: 30000
  opa:
    # OPA with the Envoy plugin, built by this repo on the DHI OPA base
    # (dockerfiles/opa-envoy, .github/workflows/build-opa-envoy-image.yml).
    # The tag is the OPA version; a rebuild republishes it on a refreshed base.
    # `digest` pins an exact build when set.
    image:
      repository: ghcr.io/blue-dots-economy/opa-envoy
      tag: "1.21.1"
      digest: ""
      pullPolicy: IfNotPresent
    # REST port (the api's decisions and its catalogue push), bound to 127.0.0.1.
    port: 8181
    # Envoy's ext_authz gRPC check is on 127.0.0.1:9191, fixed in the Envoy
    # template (aggregator-dpg infra/envoy/envoy.yaml).
    # Health and metrics only; the kubelet probes it on the pod IP.
    diagnosticPort: 8282
    # The api's per-attempt timeout, retries after the first attempt, and base
    # backoff (doubles per retry). An engine failure is a deny.
    timeoutMs: 500
    retries: 1
    backoffMs: 50
    logLevel: error
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { cpu: 250m, memory: 128Mi }
  envoy:
    # Docker Hardened Image, mirrored to GHCR from dhi.io/envoy
    # (.github/dhi-mirror-images.txt). Tag only, like the other mirrored images.
    image:
      repository: ghcr.io/blue-dots-economy/dhi/envoy
      tag: "1.37"
      digest: ""
      pullPolicy: IfNotPresent
    # The edge's listener: the Service's targetPort. Not the api's port, which
    # the api holds on 127.0.0.1 in the same pod network.
    port: 8000
    logLevel: warn
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
