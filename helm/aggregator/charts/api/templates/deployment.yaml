{{- /*
  Consent loader path: /app/config/<network>[/<brand>]/schemas/aggregator/consent.json
  (brand path when a brand is set — the loader checks brand → network → default).
  Mounted single-file (subPath) from the umbrella `{release}-consent` ConfigMap.
*/ -}}
{{- $net := .Values.global.aggregatorNetwork -}}
{{- $brand := .Values.global.aggregatorBrand | default "" -}}
{{- $consentPath := printf "/app/config/%s/schemas/aggregator/consent.json" $net -}}
{{- if $brand }}{{- $consentPath = printf "/app/config/%s/%s/schemas/aggregator/consent.json" $net $brand -}}{{- end -}}
{{- /*
  aggregator.config.yaml loader path, reproducing the app's own derivation
  (packages/network-config resolveConfigPath):
    CONFIG_ROOT(/app/config)/<network>[/<brand>]/aggregator.config.yaml
  Brand is a path segment, not a suffix. Leave AGGREGATOR_CONFIG_PATH unset in
  configmap.yaml — an explicit value wins over this derivation and bypasses the
  mount below.
*/ -}}
{{- $configPath := printf "/app/config/%s/aggregator.config.yaml" $net -}}
{{- if $brand }}{{- $configPath = printf "/app/config/%s/%s/aggregator.config.yaml" $net $brand -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if include "api.rbacEdge" . }}
        checksum/rbac: {{ include (print $.Template.BasePath "/rbac-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "api.serviceAccountName" . }}
      {{- include "api.imagePullSecrets" . | nindent 6 }}
      {{- include "api.hostAliases" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if include "api.rbacEdge" . }}
      initContainers:
        # Copies the RBAC policy and the edge route table out of the api image,
        # and fills in its Envoy template (files/edge-init.js), so the sidecars
        # run what this api build was tested with. The runtime image has no shell.
        - name: edge-init
          image: {{ include "api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/scripts/edge-init.js"]
          env:
            {{- include "api.edgeTemplateEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: rbac-policy
              mountPath: /policy
            - name: envoy-config
              mountPath: /envoy
            - name: rbac
              mountPath: /scripts/edge-init.js
              subPath: edge-init.js
              readOnly: true
        # OPA as a native sidecar: it starts before the api and the api starts
        # only after this startup probe passes. Its REST API (the api's
        # decisions and catalogue push) and Envoy's ext_authz gRPC check are on
        # 127.0.0.1 only; the kubelet probes the diagnostic port (health and
        # metrics only).
        - name: opa
          image: {{ include "api.opaImage" . }}
          imagePullPolicy: {{ .Values.rbac.opa.image.pullPolicy }}
          restartPolicy: Always
          args:
            - run
            - --server
            - --addr=127.0.0.1:{{ .Values.rbac.opa.port }}
            - --diagnostic-addr=0.0.0.0:{{ .Values.rbac.opa.diagnosticPort }}
            - --config-file=/authz/opa-config.yaml
            - --authorization=basic
            - --disable-telemetry
            - --log-level={{ .Values.rbac.opa.logLevel }}
            - /policy
            - /authz/authz.rego
          ports:
            - name: opa-diag
              containerPort: {{ .Values.rbac.opa.diagnosticPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: opa-diag
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: opa-diag
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: opa-diag
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) (deepCopy .Values.securityContext)) | nindent 12 }}
          {{- with .Values.rbac.opa.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: rbac-policy
              mountPath: /policy
              readOnly: true
            - name: rbac
              mountPath: /authz/authz.rego
              subPath: authz.rego
              readOnly: true
            - name: rbac
              mountPath: /authz/opa-config.yaml
              subPath: opa-config.yaml
              readOnly: true
        # Envoy, the RBAC edge, as a native sidecar: every request to the api
        # arrives here first (the Service targets this container's `http`
        # port), is checked with OPA, and only an allowed one is forwarded to
        # the api on 127.0.0.1. Its admin port stays on 127.0.0.1, so the
        # kubelet checks the listener instead.
        - name: envoy
          image: {{ include "api.envoyImage" . }}
          imagePullPolicy: {{ .Values.rbac.envoy.image.pullPolicy }}
          restartPolicy: Always
          command: ["envoy"]
          args:
            - -c
            - /envoy/envoy.yaml
            - --log-level
            - {{ .Values.rbac.envoy.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.rbac.envoy.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- toYaml (merge (dict "readOnlyRootFilesystem" true) (deepCopy .Values.securityContext)) | nindent 12 }}
          {{- with .Values.rbac.envoy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: envoy-config
              mountPath: /envoy
              readOnly: true
      {{- end }}
      containers:
        - name: api
          image: {{ include "api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if include "api.rbacEdge" . }}
          # Listens on 127.0.0.1:{{ .Values.service.port }} (HOST in configmap.yaml):
          # reached only through the envoy sidecar, so no containerPort here.
          {{- else }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "api.globalConfigMap" . }}
            - configMapRef:
                name: {{ include "api.appConfigMap" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: POSTGRES_PASSWORD
            # POSTGRES_USER + POSTGRES_DB + POSTGRES_HOST come from the
            # umbrella's `{release}-global` ConfigMap (envFrom above).
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            # REDIS_HOST + REDIS_PORT come from the umbrella's `{release}-global`
            # ConfigMap (envFrom above); REDIS_PASSWORD from the umbrella Secret.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
            - name: APPROVAL_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: APPROVAL_TOKEN_SECRET
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: SMTP_PASSWORD
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: SIGNALSTACK_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "api.secretName" . }}
                  key: SIGNALSTACK_ADMIN_KEY
                  optional: true
          readinessProbe:
            {{- include "api.readyCheck" . | nindent 12 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            {{- include "api.readyCheck" . | nindent 12 }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            {{- include "api.readyCheck" . | nindent 12 }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Consent config overlaid on the loader path. subPath does not
          # hot-update, so a consent change needs a rollout restart (see
          # docs/CONSENT_CONFIGMAP_DEPLOYMENT.md).
          volumeMounts:
            - name: consent
              mountPath: {{ $consentPath }}
              subPath: consent.json
              readOnly: true
            {{- if .Values.global.networkConfigDelivery }}
            # aggregator.config.yaml from the umbrella {release}-network-config
            # ConfigMap, overlaid on the derived loader path. Single-file subPath
            # because the same directory holds brand.json (read as a sibling),
            # keycloak.env and bulk-samples/ from the image.
            - name: network-config
              mountPath: {{ $configPath }}
              subPath: aggregator.config.yaml
              readOnly: true
            {{- end }}
      volumes:
        - name: consent
          configMap:
            name: {{ .Release.Name }}-consent
        {{- if .Values.global.networkConfigDelivery }}
        - name: network-config
          configMap:
            name: {{ .Release.Name }}-network-config
        {{- end }}
        {{- if include "api.rbacEdge" . }}
        - name: rbac-policy
          emptyDir:
            sizeLimit: 1Mi
        - name: envoy-config
          emptyDir:
            sizeLimit: 1Mi
        - name: rbac
          configMap:
            name: {{ include "api.fullname" . }}-rbac
        {{- end }}
