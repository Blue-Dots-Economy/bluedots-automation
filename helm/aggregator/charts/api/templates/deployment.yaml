{{- /*
  Consent loader path: /app/config/<network>[/<brand>]/schemas/aggregator/consent.json
  (brand path when a brand is set — the loader checks brand → network → default).
  Mounted single-file (subPath) from the umbrella `{release}-consent` ConfigMap.
*/ -}}
{{- $net := .Values.global.aggregatorNetwork -}}
{{- $brand := .Values.global.aggregatorBrand | default "" -}}
{{- $consentPath := printf "/app/config/%s/schemas/aggregator/consent.json" $net -}}
{{- if $brand }}{{- $consentPath = printf "/app/config/%s/%s/schemas/aggregator/consent.json" $net $brand -}}{{- end -}}
{{- /*
  aggregator.config.yaml loader path, reproducing the app's own derivation
  (packages/network-config resolveConfigPath):
    CONFIG_ROOT(/app/config)/<network>[/<brand>]/aggregator.config.yaml
  Brand is a path segment, not a suffix. Leave AGGREGATOR_CONFIG_PATH unset in
  configmap.yaml — an explicit value wins over this derivation and bypasses the
  mount below.
*/ -}}
{{- $configPath := printf "/app/config/%s/aggregator.config.yaml" $net -}}
{{- if $brand }}{{- $configPath = printf "/app/config/%s/%s/aggregator.config.yaml" $net $brand -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "api.serviceAccountName" . }}
      {{- include "api.imagePullSecrets" . | nindent 6 }}
      {{- include "api.hostAliases" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- include "api.envFrom" . | nindent 10 }}
          {{- include "api.env" . | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Consent config overlaid on the loader path. subPath does not
          # hot-update, so a consent change needs a rollout restart (see
          # docs/CONSENT_CONFIGMAP_DEPLOYMENT.md).
          volumeMounts:
            - name: consent
              mountPath: {{ $consentPath }}
              subPath: consent.json
              readOnly: true
            {{- if .Values.global.networkConfigDelivery }}
            # aggregator.config.yaml from the umbrella {release}-network-config
            # ConfigMap, overlaid on the derived loader path. Single-file subPath
            # because the same directory holds brand.json (read as a sibling),
            # keycloak.env and bulk-samples/ from the image.
            - name: network-config
              mountPath: {{ $configPath }}
              subPath: aggregator.config.yaml
              readOnly: true
            {{- end }}
      volumes:
        - name: consent
          configMap:
            name: {{ .Release.Name }}-consent
        {{- if .Values.global.networkConfigDelivery }}
        - name: network-config
          configMap:
            name: {{ .Release.Name }}-network-config
        {{- end }}
