{{- if .Values.ingress.enabled -}}
{{- /*
  Template-driven ingress for the aggregator API. Routing STRUCTURE is fixed
  here: path /backend, strip-path "true" — the api Service listens at root and
  /backend is a public router prefix (replaces the old nginx regex + rewrite).
  Host comes from global.publicHost; className/plugin/annotations from ingress.*.
  No cert-manager annotation: the web ingress owns issuance of the shared host
  cert; this object only references the derived TLS secret.
*/ -}}
{{- $svc := include "api.serviceName" . -}}
{{- $host := required "global.publicHost is required" .Values.global.publicHost -}}
{{- $isKong := eq .Values.ingress.className "kong" -}}
{{- /* konghq.com/plugins takes a comma-separated list — combine the existing
   rate-limit-tier reference (if any) with this chart's own HSTS plugin (if
   enabled), rather than clobbering one with the other. */ -}}
{{- $plugins := list -}}
{{- if .Values.ingress.plugin }}{{ $plugins = append $plugins .Values.ingress.plugin }}{{ end -}}
{{- if and $isKong .Values.ingress.hsts.enabled }}{{ $plugins = append $plugins (printf "%s-hsts" $svc) }}{{ end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "true"
    {{- if $plugins }}
    konghq.com/plugins: {{ join "," $plugins | quote }}
    {{- end }}
    {{- if and $isKong .Values.ingress.forceSSLRedirect }}
    {{- /* Route-level protocol restriction: only match https, and 301-redirect
       a plain-http request instead of erroring (GITHUB-ISSUES #10). */}}
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ printf "%s-tls" ($host | replace "." "-") }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
