{{- /*
  Upstream network.json URL. Derived from global.networkSource to MIRROR
  scripts/fetch-configs.sh's signals target, so the aggregator fetches the same
  network.json the signals deploy did. global.networkSource.url overrides the
  derivation wholesale. Keep this expression identical to the worker's copy —
  a subchart cannot share the umbrella's _helpers.tpl, hence the duplication.

  The brand path segment comes from networkSource.brand (explicit opt-in), NEVER
  from global.aggregatorBrand. A templated URL cannot fall back on a 404 the way
  fetch-configs.sh's try_fetch does, so deriving it from aggregatorBrand points
  EVERY branded deploy at a file that may not exist — blue_dot/upsdm and
  orange_dot/onetac ship consent.json but no network.json, so the loader fails at
  boot while fetch-configs.sh quietly falls back to <network>/network.json,
  re-splitting the two halves this expression exists to keep together. Brand wins
  outright when networkSource.brand IS set (a brand folder is a full copy, not a
  partial override) — same rule fetch-configs.sh uses. See values.yaml
  networkSource.brand.
*/ -}}
{{- $ns := .Values.global.networkSource | default dict -}}
{{- $networkSource := $ns.url | default "" -}}
{{- if and (not $networkSource) $ns.repo $ns.ref -}}
{{- $netPath := .Values.global.aggregatorNetwork -}}
{{- if $ns.brand -}}{{- $netPath = printf "%s/%s" $netPath $ns.brand -}}{{- end -}}
{{- $networkSource = printf "https://raw.githubusercontent.com/%s/%s/%s/%s" $ns.repo $ns.ref $netPath ($ns.file | default "network.json") -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.appConfigMap" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  PORT: "{{ .Values.service.port }}"
  HOST: "0.0.0.0"
  CORS_ORIGINS: "{{ include "api.publicBaseUrl" . }}"
  RUN_MIGRATIONS_ON_BOOT: "{{ .Values.runMigrationsOnBoot }}"
  ADMIN_EMAILS: "{{ .Values.adminEmails }}"
  PUBLIC_API_URL: "{{ include "api.publicBaseUrl" . }}/backend"
  BULK_UPLOAD_URL_TTL_SECONDS: "{{ .Values.bulk.uploadUrlTtlSeconds }}"
  BULK_UPLOAD_MAX_BYTES: "{{ .Values.bulk.uploadMaxBytes }}"
  QR_DOWNLOAD_URL_TTL_SECONDS: "{{ .Values.bulk.qrDownloadUrlTtlSeconds }}"
  PUBLIC_LINK_BASE_URL: "{{ default (include "api.publicBaseUrl" .) .Values.publicLinkBaseUrl }}"
  # Per-network deployment: every path-dependent var keys off
  # `global.aggregatorNetwork` so flipping it in values-<net>.yaml
  # redirects api + worker at the matching config folder.
  # AGGREGATOR_CONFIG_PATH: "/app/config/{{ .Values.global.aggregatorNetwork }}/aggregator.config.yaml"
  SCHEMA_ROOT_DIR: "/app/config/{{ .Values.global.aggregatorNetwork }}/schemas"
  # Upstream network.json URL. The aggregator fetches this over HTTPS at boot rather
  # than mounting it, so a URL is the only interface. Wins over
  # `aggregator.network.source` in the mounted aggregator.config.yaml, letting the
  # schema source move without an image rebuild or a config edit. Blank = use the
  # YAML value; a malformed URL fails boot with CONFIG_PARSE_FAILED.
  #
  # Requires aggregator-dpg#513 in the deployed image; older images ignore it.
  # Must match the worker's value — both run the loader.
  AGGREGATOR_NETWORK_SOURCE: "{{ $networkSource }}"
  SIGNALSTACK_ITEM_NETWORK: "{{ .Values.global.aggregatorNetwork }}"
  AGGREGATOR_NETWORK: "{{ .Values.global.aggregatorNetwork }}"
  # Brand skin over the network (UI/config skin). Empty = standard dots.
  AGGREGATOR_BRAND: "{{ .Values.global.aggregatorBrand }}"
  SIGNALSTACK_BASE_URL: "{{ .Values.global.signalstackBaseUrl }}"
  # network_service org id in signal-stack DB; sent as `x-acting-org-id` on
  # admin calls. Without it the login-time upsert fallback fails with
  # SIGNALSTACK_CONFIG_MISSING and dashboard returns SIGNALSTACK_ORG_NOT_REGISTERED.
  SIGNALSTACK_ACTING_ORG_ID: "{{ .Values.global.signalstack.actingOrgId }}"
  S3_FORCE_PATH_STYLE: "{{ .Values.global.s3.forcePathStyle }}"
  ORG_HIERARCHY_ENABLED: "{{ .Values.global.orgHierarchyEnabled }}"
  SUPPORT_EMAIL: "{{ .Values.supportEmail }}"
{{- /*
  Onboarding capability allow-list (aggregator-dpg#663, issue #637) and the
  Signals UI hand-off (aggregator-dpg#653/#654, issues #652/#635). Both are
  API-ONLY -- the worker and web read neither, which is why they live here and
  not in the umbrella's configmap-global.yaml.

  BOTH KEYS ARE RENDERED CONDITIONALLY, ON PURPOSE. This is the only place in
  this ConfigMap that does so, so it will look out of place -- please leave it.

  AGGREGATOR_ONBOARDING_ENABLED is fail-closed in the api:
    unset / key absent  -> ALL capabilities enabled (the api's default)
    "form" / "form,voice" -> only the listed modes
    ""  (empty string!) -> NOTHING enabled: every registration mode is off and
                           every public-link creation fails with a 400
  So an unconditional `{{ .Values.global.onboardingEnabled | quote }}` would emit
  AGGREGATOR_ONBOARDING_ENABLED: "" on the empty chart default and disable
  onboarding in every environment this chart touches. aggregator-dpg's
  docker-compose.yml hit exactly this with `${AGGREGATOR_ONBOARDING_ENABLED:-}`
  and had to be changed to a value-less passthrough. Omitting the key is the fix.

  SIGNALS_UI_URLS is conditional for consistency and to keep the rendered
  ConfigMap clean; an empty value there is inert rather than dangerous.

  These comments are Helm comments, not YAML comments, so they are stripped from
  the render -- a `#` block here would leave the key name in the output even when
  the key itself is omitted, which defeats the point of the conditional.
*/}}
{{- if .Values.global.onboardingEnabled }}
  # Registration modes this deployment offers: form, voice (bulk is reserved and
  # gates nothing yet). Unset = all modes; empty = none, so the key is omitted
  # rather than rendered empty. See values.yaml global.onboardingEnabled.
  AGGREGATOR_ONBOARDING_ENABLED: {{ .Values.global.onboardingEnabled | quote }}
{{- end }}
{{- if .Values.global.signalsUiUrls }}
  # `domain=url` pairs, one per network domain, each pointing at THAT domain's own
  # Signals UI login page (<origin>/auth/login) -- never a Keycloak authorization
  # URL, which embeds one-time state/PKCE values bound to a single browser.
  # Drives the "Already Registered - Sign In" chooser and post-submit redirect.
  SIGNALS_UI_URLS: {{ .Values.global.signalsUiUrls | quote }}
{{- end }}
