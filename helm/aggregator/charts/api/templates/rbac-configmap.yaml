{{- /*
  RBAC sidecar inputs (aggregator-dpg docs/rbac/rbac-edge-enforcement.md): OPA's
  own API authorisation policy and its edge configuration, and the script the
  edge-init container runs. The RBAC policy itself and the Envoy template come
  from the api image (see the edge-init init container in deployment.yaml).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-rbac
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  authz.rego: |
{{ .Files.Get "files/opa-authz.rego" | indent 4 }}
  opa-config.yaml: |
{{ .Files.Get "files/opa-config.yaml" | indent 4 }}
  edge-init.js: |
{{ .Files.Get "files/edge-init.js" | indent 4 }}
