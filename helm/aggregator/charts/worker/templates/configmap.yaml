{{- /*
  Upstream network.json URL. Keep identical to charts/api/templates/configmap.yaml —
  duplicated because a subchart cannot use the umbrella's _helpers.tpl, and both
  halves must resolve the same network.json.

  The brand path segment comes from networkSource.brand (explicit opt-in), NEVER
  from global.aggregatorBrand — a templated URL cannot 404-fall-back the way
  fetch-configs.sh's try_fetch does, so deriving it from aggregatorBrand breaks
  every branded deploy whose schemas folder carries no network.json. Brand wins
  outright when networkSource.brand IS set. See the api copy + values.yaml.
*/ -}}
{{- $ns := .Values.global.networkSource | default dict -}}
{{- $networkSource := $ns.url | default "" -}}
{{- if and (not $networkSource) $ns.repo $ns.ref -}}
{{- $netPath := .Values.global.aggregatorNetwork -}}
{{- if $ns.brand -}}{{- $netPath = printf "%s/%s" $netPath $ns.brand -}}{{- end -}}
{{- $networkSource = printf "https://raw.githubusercontent.com/%s/%s/%s/%s" $ns.repo $ns.ref $netPath ($ns.file | default "network.json") -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "worker.appConfigMap" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
data:
  # Per-network deployment — mirrors the api configmap so worker
  # validates rows against the same schema the api accepts.
  #
  # AGGREGATOR_CONFIG_PATH is deliberately unset: an explicit value wins over the
  # app's own derivation from AGGREGATOR_NETWORK + AGGREGATOR_BRAND below
  # (packages/network-config resolveConfigPath), which is also where the
  # aggregator.config.yaml ConfigMap is mounted. Setting it here would have to
  # reproduce the brand segment exactly or the mount is bypassed.
  # AGGREGATOR_CONFIG_PATH: "/app/config/{{ .Values.global.aggregatorNetwork }}/aggregator.config.yaml"
  # SCHEMA_ROOT_DIR: "/app/config/{{ .Values.global.aggregatorNetwork }}/schemas"
  # Deploy-time override for the upstream network.json URL. See the api configmap
  # for the full rationale — must match the api's value exactly.
  AGGREGATOR_NETWORK_SOURCE: "{{ $networkSource }}"
  SIGNALSTACK_ITEM_NETWORK: "{{ .Values.global.aggregatorNetwork }}"
  AGGREGATOR_NETWORK: "{{ .Values.global.aggregatorNetwork }}"
  # Brand skin over the network (UI/config skin). Empty = standard dots.
  AGGREGATOR_BRAND: "{{ .Values.global.aggregatorBrand }}"
  SIGNALSTACK_BASE_URL: "{{ .Values.global.signalstackBaseUrl }}"
  # network_service org id in signal-stack DB; sent as `x-acting-org-id` on admin calls.
  SIGNALSTACK_ACTING_ORG_ID: "{{ .Values.global.signalstack.actingOrgId }}"
  BULK_MAX_ROWS: "{{ .Values.bulk.maxRows }}"
  BULK_MAX_ROW_BYTES: "{{ .Values.bulk.maxRowBytes }}"
  LINK_METRICS_ROLLUP_INTERVAL_MS: "{{ .Values.cron.linkMetricsRollupIntervalMs }}"
  WATCHDOG_INTERVAL_MS: "{{ .Values.cron.watchdogIntervalMs }}"
  S3_FORCE_PATH_STYLE: "{{ .Values.global.s3.forcePathStyle }}"
  S3_BUCKET: "{{ .Values.global.s3.bucket }}"
  S3_REGION: "{{ .Values.global.s3.region }}"
{{- /*
  Raya voice provider base URL (campaign voice channel). WORKER-ONLY — the api
  submits voice jobs but never dials out, so this does not belong in the
  umbrella's configmap-global.yaml. The API KEY is a secret and arrives via the
  umbrella Secret (see the deployment's RAYA_API_KEY env), not from here.

  RENDERED CONDITIONALLY, AND THAT IS LOAD-BEARING. The worker parses it as
  `z.string().url().default('https://v1.getraya.app/api')`, and "" is not a
  valid URL — `.default()` only applies to an ABSENT key. So an unconditional
  `RAYA_BASE_URL: "{{ ... }}"` on the empty chart default emits `""`, fails
  ConfigSchema.parse(process.env) at boot, and CrashLoopBackOffs the entire
  worker — every queue (bulk rows, exports, cron, link rollups), not just voice.
  Omitting the key is what lets the app's own default apply. Set the value only
  for a non-prod Raya endpoint.

  Same trap, same shape as AGGREGATOR_ONBOARDING_ENABLED in the api ConfigMap,
  for a different reason: there an empty string is a VALID value with dangerous
  semantics, here it is an INVALID value that refuses to boot. Both are fixed by
  omitting the key rather than rendering it blank.

  Helm comment, not a YAML comment, so it is stripped from the render — a `#`
  block here would leave text in the output even when the key is omitted.
*/}}
{{- if .Values.global.rayaBaseUrl }}
  RAYA_BASE_URL: {{ .Values.global.rayaBaseUrl | quote }}
{{- end }}
