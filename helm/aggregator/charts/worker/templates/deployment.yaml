{{- /*
  aggregator.config.yaml loader path, reproducing the app's own derivation
  (packages/network-config resolveConfigPath):
    CONFIG_ROOT(/app/config)/<network>[/<brand>]/aggregator.config.yaml
  Brand is a path segment, not a suffix. Must match the api's derivation — the
  worker validates bulk rows against the config the api accepts registrations with.
*/ -}}
{{- $net := .Values.global.aggregatorNetwork -}}
{{- $brand := .Values.global.aggregatorBrand | default "" -}}
{{- $configPath := printf "/app/config/%s/aggregator.config.yaml" $net -}}
{{- if $brand }}{{- $configPath = printf "/app/config/%s/%s/aggregator.config.yaml" $net $brand -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "worker.serviceAccountName" . }}
      {{- include "worker.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "worker.globalConfigMap" . }}
            - configMapRef:
                name: {{ include "worker.appConfigMap" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: POSTGRES_PASSWORD
            # POSTGRES_USER + POSTGRES_DB come from the umbrella's
            # `{release}-global` ConfigMap (envFrom above). Kubernetes
            # resolves $(VAR) at container start.
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            # REDIS_HOST + REDIS_PORT come from the umbrella's `{release}-global`
            # ConfigMap (envFrom above); REDIS_PASSWORD from the umbrella Secret.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: SIGNALSTACK_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: SIGNALSTACK_ADMIN_KEY
                  optional: true
          # No livenessProbe. The previous one was
          #   exec: [sh, -c, 'pgrep -f "node" >/dev/null || exit 1']
          # which cannot run against the worker image now that it is a Docker
          # Hardened Image — that image ships neither `sh` nor `pgrep`, so the
          # probe fails, the kubelet kills the container, and the pod restarts in
          # a loop.
          #
          # Dropping it loses almost nothing: `pgrep -f node` succeeded exactly
          # when PID 1 was node, i.e. whenever the container was alive — and if
          # node exits, the container exits and the kubelet restarts it anyway.
          # A probe that can detect a *wedged* worker needs something the process
          # actually answers (an HTTP health endpoint, or a queue-heartbeat
          # freshness check); that is app work, tracked separately.
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.global.networkConfigDelivery }}
          # aggregator.config.yaml from the umbrella {release}-network-config
          # ConfigMap, so bulk-row validation uses the same network binding the api
          # accepts registrations with. Single-file subPath — see the api deployment.
          volumeMounts:
            - name: network-config
              mountPath: {{ $configPath }}
              subPath: aggregator.config.yaml
              readOnly: true
          {{- end }}
      {{- if .Values.global.networkConfigDelivery }}
      volumes:
        - name: network-config
          configMap:
            name: {{ .Release.Name }}-network-config
      {{- end }}
