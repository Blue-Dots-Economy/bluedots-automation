{{- /*
  aggregator.config.yaml loader path, reproducing the app's own derivation
  (packages/network-config resolveConfigPath):
    CONFIG_ROOT(/app/config)/<network>[/<brand>]/aggregator.config.yaml
  Brand is a path segment, not a suffix. Must match the api's derivation — the
  worker validates bulk rows against the config the api accepts registrations with.
*/ -}}
{{- $net := .Values.global.aggregatorNetwork -}}
{{- $brand := .Values.global.aggregatorBrand | default "" -}}
{{- $configPath := printf "/app/config/%s/aggregator.config.yaml" $net -}}
{{- if $brand }}{{- $configPath = printf "/app/config/%s/%s/aggregator.config.yaml" $net $brand -}}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "worker.serviceAccountName" . }}
      {{- include "worker.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "worker.globalConfigMap" . }}
            - configMapRef:
                name: {{ include "worker.appConfigMap" . }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: POSTGRES_PASSWORD
            # POSTGRES_USER + POSTGRES_DB come from the umbrella's
            # `{release}-global` ConfigMap (envFrom above). Kubernetes
            # resolves $(VAR) at container start.
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            # REDIS_HOST + REDIS_PORT come from the umbrella's `{release}-global`
            # ConfigMap (envFrom above); REDIS_PASSWORD from the umbrella Secret.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: SIGNALSTACK_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: SIGNALSTACK_ADMIN_KEY
                  optional: true
            - name: HEALTH_PORT
              value: {{ .Values.healthPort | quote }}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: SMTP_PASSWORD
                  optional: true
            # Raya voice provider API key (campaign voice channel). Worker-only:
            # the api submits voice jobs, the worker dials out. Asserted LAZILY
            # by the provider, so an unconfigured deployment still boots and runs
            # every other queue — voice jobs accept with 202 and fail at dispatch.
            #
            # `optional: true` is what lets the pod start when the key is absent,
            # and the umbrella Secret OMITS it rather than writing "" precisely so
            # that path is taken: the worker's schema is
            # `z.string().min(1).optional()`, which rejects an empty string and
            # would fail config parse at boot. Absent = fine, empty = crash.
            - name: RAYA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "worker.secretName" . }}
                  key: RAYA_API_KEY
                  optional: true
          # /healthz endpoint (aggregator-dpg#675), not exec — the image has no shell.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.global.networkConfigDelivery }}
          # aggregator.config.yaml from the umbrella {release}-network-config
          # ConfigMap, so bulk-row validation uses the same network binding the api
          # accepts registrations with. Single-file subPath — see the api deployment.
          volumeMounts:
            - name: network-config
              mountPath: {{ $configPath }}
              subPath: aggregator.config.yaml
              readOnly: true
          {{- end }}
      {{- if .Values.global.networkConfigDelivery }}
      volumes:
        - name: network-config
          configMap:
            name: {{ .Release.Name }}-network-config
      {{- end }}
