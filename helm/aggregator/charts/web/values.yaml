# Shared host for the ingress; overridden by the umbrella chart's global
# (Helm propagates parent global to subcharts).
global:
  publicHost: aggregator.example.com

# Template-driven ingress (templates/ingress.yaml): path / (catch-all) is fixed
# in the template. This object owns the cert-manager issuance for the shared
# host cert. Host = global.publicHost.
ingress:
  enabled: false
  className: ""               # e.g. kong
  clusterIssuer: ""           # e.g. letsencrypt-prod
  plugin: ""                  # KongClusterPlugin tier, e.g. rl-agg-web
  annotations: {}
  # Kong route-level protocol restriction: only accept https, and redirect a
  # plain-http request to https (see httpsRedirectStatusCode) instead of erroring (GITHUB-ISSUES #10).
  # No-op unless className is "kong".
  forceSSLRedirect: true
  # Status code Kong uses for the plain-http -> https redirect. 301 is right for
  # a browser-facing route: it is the cacheable permanent redirect and this route
  # serves GET navigations. API routes use 308 instead, to keep a redirected POST
  # from being downgraded to GET. Kong accepts 426, 301, 302, 307, 308.
  httpsRedirectStatusCode: 301
  # HSTS via a per-chart KongPlugin (response-transformer), referenced alongside
  # `plugin` above through the ingress's konghq.com/plugins annotation — see
  # templates/kong-hsts-plugin.yaml. No-op unless className is "kong".
  hsts:
    enabled: true
    maxAge: 31536000           # 1 year
    includeSubDomains: true
    # `preload` is deliberately OFF. It is the one HSTS directive that cannot be
    # walked back on browser timescales: combined with includeSubDomains, a
    # preload-list submission commits EVERY subdomain to https-only, and removal
    # ships with browser releases months later. Emitting the directive does not
    # by itself enrol the domain (that needs a submission at hstspreload.org) —
    # but it advertises the intent, and this org still has legacy hosts that
    # would not survive it. Turn it on per environment, after auditing every
    # subdomain of the public host, never as a chart default.
    preload: false

replicaCount: 1
image:
  repository: aggregator-dpg/web
  tag: ""
  pullPolicy: Always
service:
  port: 3000
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 1,    memory: 1Gi   }
session:
  cookieName: sid
  cookieSecure: "true"
  ttlSeconds: 43200
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70

# ── Public registration form: address autocomplete + college picker ─────────
# Both reach the browser, and both are RUNTIME env vars rendered into the web
# ConfigMap — never Docker build args, never NEXT_PUBLIC_* names (Next.js would
# inline those at `next build`; see aggregator-dpg#752).

# Google Maps JS browser key. NO DEFAULT HERE ON PURPOSE — it is hand-entered
# per environment in <env>/secrets.yaml (`aggregator_google_maps_api_key`) and
# arrives via the generated global-secrets.yaml at deploy time, exactly as
# signals' ui.runtimeConfig.VITE_GOOGLE_MAPS_API_KEY does. Unset (or left at the
# UPDATE_THIS_VALUE placeholder) the ConfigMap omits the key and the form falls
# back to a plain text address input geocoded server-side.

# Which state's college/institute list backs the reference-autocomplete field:
# "ka" | "up". THE SINGLE KNOB — it picks both the dataset the form requests and
# the one file the reference ConfigMap ships (colleges-<code>.json), so the two
# cannot disagree. Set per environment from the _college_dataset anchor in
# <env>/global-values.yaml, the SAME anchor that drives signals' UI — one
# deployment serves one region on both halves.
collegeDataset: "ka"
# Base URL the reference datasets are fetched from. Leave EMPTY to use the web
# app's own /reference/ path (served out of public/, shadowed by the ConfigMap).
# Set to an absolute URL only to host the lists off-cluster (CDN/registry) —
# that host must then send permissive CORS headers, since the browser fetches it
# directly. Setting this makes reference.enabled below redundant.
referenceBaseUrl: ""

# College/institute reference list delivered to the web pod as a ConfigMap
# mounted at /app/apps/web/public/reference/, so the list updates with a value
# edit + rollout instead of a web image rebuild — the same ConfigMap-delivery
# model as consent config, and the same one signals' ui uses.
#
# EXACTLY ONE dataset ships, chosen by collegeDataset above. There is no list to
# keep in sync: scripts/fetch-configs.sh pulls colleges-<region>.json from
# Blue-Dots-Economy/bluedots-schemas at deploy time into files/reference/
# (gitignored, fetched fresh so it can't drift), and this chart renders that
# same region. One region is also a hard requirement, not just tidiness — a
# ConfigMap is one etcd object capped at 1 MiB, and the two known datasets
# minified come to 1,101,321 B, so shipping both would be rejected by the
# apiserver. One region is ~353 KB (ka) / ~748 KB (up).
reference:
  # false -> no ConfigMap, no mount, and NO dataset: aggregator-dpg no longer
  # commits fallback copies under apps/web/public/reference, so this ConfigMap
  # is the only source. Turn it off ONLY alongside referenceBaseUrl pointing at
  # a host that serves the lists; on its own it leaves the picker permanently
  # degraded to a plain text input. CI's `helm template` steps set it false on
  # purpose, since the fetched file does not exist in a fresh checkout.
  enabled: true
  # Render-time size guard, kept under the 1 MiB etcd ceiling with room for
  # ConfigMap metadata. Raising it past ~1048576 only moves the failure from
  # `helm template` to the apiserver, where the error is far less obvious.
  maxBytes: 1000000

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Pod/container security hardening (#1.12). Mirrors the signals-api baseline:
# non-root uid 1000, drop all Linux capabilities, no privilege escalation.
# Override per-service if an image genuinely needs root (cf. the signals `ui`
# nginx exception in helm/signals/values.yaml).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
