{{- if .Values.ingress.enabled -}}
{{- /*
  Template-driven ingress for the web BFF (catch-all). Routing STRUCTURE fixed
  here: path / (lowest router priority), strip-path "false". Host comes from
  global.publicHost. This object OWNS the cert-manager issuance for the shared
  host cert (ingress.clusterIssuer); the api + keycloak ingresses reuse the
  resulting TLS secret.
*/ -}}
{{- $svc := include "web.fullname" . -}}
{{- $host := required "global.publicHost is required" .Values.global.publicHost -}}
{{- $isKong := eq .Values.ingress.className "kong" -}}
{{- /* konghq.com/plugins takes a comma-separated list — combine the existing
   rate-limit-tier reference (if any) with this chart's own HSTS plugin (if
   enabled), rather than clobbering one with the other. */ -}}
{{- $plugins := list -}}
{{- if .Values.ingress.plugin }}{{ $plugins = append $plugins .Values.ingress.plugin }}{{ end -}}
{{- if and $isKong .Values.ingress.hsts.enabled }}{{ $plugins = append $plugins (printf "%s-hsts" $svc) }}{{ end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $svc }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "false"
    {{- if $plugins }}
    konghq.com/plugins: {{ join "," $plugins | quote }}
    {{- end }}
    {{- if and $isKong .Values.ingress.forceSSLRedirect }}
    {{- /* Route-level protocol restriction: only match https, and 301-redirect
       a plain-http request instead of erroring (GITHUB-ISSUES #10). */}}
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: "301"
    {{- end }}
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ printf "%s-tls" ($host | replace "." "-") }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
