image:
  repository: ghcr.io/blue-dots-economy/adhoc-scripts/signals-s3-export
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: signals-s3-export
  annotations: {}

s3:
  bucket: ""
  prefix: ""
  region: ""
  endpointUrl: ""
  forcePathStyle: false
  existingCredentialsSecret: ""

export:
  scope: aggregator_onboarded
  # Base of the registration_links registration_url (the aggregator's public
  # web URL). Empty => <global.publicProtocol|https>://<global.publicHost>, the
  # same value the aggregator api uses. The export stops if it resolves empty.
  publicLinkBaseUrl: ""

databaseUrl: ""
aggDatabaseUrl: ""
existingSecret: ""

instances: []

cronJob:
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }

nodeSelector: {}
tolerations: []
affinity: {}
