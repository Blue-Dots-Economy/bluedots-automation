{{- if and .Values.instances (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3-export.dbSecretName" . }}
  labels:
    {{- include "s3-export.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "databaseUrl (or existingSecret) is required" .Values.databaseUrl | quote }}
  AGG_DATABASE_URL: {{ required "aggDatabaseUrl (or existingSecret) is required" .Values.aggDatabaseUrl | quote }}
{{- end }}
