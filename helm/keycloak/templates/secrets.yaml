{{- /*
Release Secret for the shared Keycloak.

Holds the bootstrap admin password and ALL SIX client secrets that
render-realm.sh substitutes into the realm — including the signals-side ones,
because the realm defining those clients is rendered by this release now.

The mandatory ones go through keycloak-platform.requireSecret, which FAILS the
render on an empty or `change-me` value so identity can never come up on a
well-known default. That guard fires on any render, including `helm lint` with
chart defaults, which is why static checks pass
`--set global.existingSecret=<placeholder>`.

Note __SIGNALS_API_SECRET__ is consumed in two namespaces: here (realm render)
and by signals' api as KEYCLOAK_API_CLIENT_SECRET. Generate it ONCE in
global-secrets.yaml and reference it from both, or the two halves disagree and
signals' service-account token calls start failing.
*/ -}}
{{- $existing := default "" .Values.global.existingSecret -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-platform.secretName" . }}
  labels:
    {{- include "keycloak-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Keycloak itself ────────────────────────────────────────────────────────
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.kcBootstrapAdminPassword "name" "kcBootstrapAdminPassword") | quote }}

  # Keycloak's own Postgres login (the `keycloak` DB role created by
  # common-services' bootstrap). Deliberately sourced from
  # secrets.keycloakPostgresPassword, NOT secrets.postgresPassword — the latter is
  # the AGGREGATOR database password in the same shared global-secrets.yaml.
  # Existing environments where the DB is still owned by `aggregator` should set
  # keycloakPostgresPassword to that role's password.
  POSTGRES_PASSWORD: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.keycloakPostgresPassword "name" "keycloakPostgresPassword") | quote }}

  # ── Aggregator-side clients ────────────────────────────────────────────────
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.keycloakAdminClientSecret "name" "keycloakAdminClientSecret") | quote }}
  OIDC_CLIENT_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.oidcClientSecret "name" "oidcClientSecret") | quote }}
  # Falls back to the (guarded) admin client secret when unset — no separate guard.
  BFF_SERVICE_CLIENT_SECRET: {{ default .Values.secrets.keycloakAdminClientSecret .Values.secrets.bffServiceClientSecret | quote }}

  # ── Signals-side clients (new — these had no home before this release) ─────
  SIGNALS_API_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.signalsApiSecret "name" "signalsApiSecret") | quote }}
  # `aggregator-dpg` (Phase C service auth) and `voice-dpg` service clients.
  # GUARDED even though neither is in use yet: both clients EXIST in the shared
  # realm, and render-realm.sh fails on an empty value (`:?` trips on empty, not
  # just unset). An empty secret on a confidential client is worse than a failed
  # deploy, so these are required — they are just random strings, generate them.
  SIGNALSTACK_CLIENT_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.signalstackClientSecret "name" "signalstackClientSecret") | quote }}
  VOICE_DPG_SIGNALS_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.voiceDpgSignalsSecret "name" "voiceDpgSignalsSecret") | quote }}
  CAMPAIGN_MANAGER_SECRET: {{ include "keycloak-platform.requireSecret" (dict "value" .Values.secrets.campaignManagerSecret "name" "campaignManagerSecret") | quote }}

  # ── SMTP (optional — empty when using SES/IAM auth) ────────────────────────
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}

  # ── OTP delivery providers (used per keycloak.smsProvider) ─────────────────
  TWILIO_ACCOUNT_SID: {{ .Values.secrets.twilioAccountSid | quote }}
  TWILIO_AUTH_TOKEN: {{ .Values.secrets.twilioAuthToken | quote }}
  TWILIO_FROM_NUMBER: {{ .Values.secrets.twilioFromNumber | quote }}
  MSG91_AUTH_KEY: {{ .Values.secrets.msg91AuthKey | quote }}

  # AWS — leave empty when using IRSA / Pod Identity.
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
{{- end }}
