# keycloak-platform — shared identity for BOTH DPGs.
#
# Deployed as its own release into the common-services namespace, AFTER the
# common-services release (which creates the `keycloak` database in a post-install
# hook). It is a separate release on purpose: as a subchart of `platform` its
# Deployment would be a main resource, `--wait` would block on it becoming Ready,
# and the post-install hook that creates its database would never run — a
# deadlock that times out the whole release. See plan §9.

global:
  # UPDATE per environment: the public FQDN. Keycloak's issuer, redirect URIs and
  # email links are all built from this, so it must match what browsers use.
  publicHost: aggregator.example.com
  publicProtocol: https

  # The shared realm name. REQUIRED — there is deliberately no literal default.
  # Per-instance, derived from the network/domain. Consumed by this chart, the
  # Kong login rate-limit path, and both DPGs' KEYCLOAK_REALM.
  keycloakRealm: ""

  # Left empty intentionally, matching the other charts: set full registry paths
  # in each image.repository instead.
  imageRegistry: ''
  imagePullSecrets:
    - ghcr-pull

  # Pre-created Secret to use instead of the rendered one. Must carry every key
  # in templates/secrets.yaml. Also how static renders skip the requireSecret
  # guard (install.sh lint / CI pass a placeholder).
  existingSecret: ''

  # Hostnames the SIGNALS release serves. Layered in from global-values.yaml
  # (the _signals_public_hosts anchor). Used to build the shared realm's
  # signals-ui redirect/origin/post-logout allow-lists — those must point at the
  # signals UI, not at this Keycloak's host.
  publicHosts: []

  # Shared data layer (the common-services release).
  dataPlatform:
    namespace: common-services
    # Full endpoint (e.g. an RDS hostname); takes precedence over postgresService.
    # Populated by the opentofu output-file overlay.
    postgresHost: ""
    postgresService: common-services-postgresql

  # Block the Keycloak admin CONSOLE from the public ingress. Propagates to the
  # subchart. Default off: only validatable by a live dry_run, not CI.
  adminConsoleBlock:
    enabled: false

# ─── Keycloak's Postgres login ────────────────────────────────────────────────
postgres:
  # New environments use the dedicated `keycloak` role added to
  # common-services' postgresBootstrap. EXISTING environments still have the
  # database owned by `aggregator` — override to `aggregator` there.
  username: keycloak
  database: keycloak

# ─── Client ids (must match the realm's clientIds) ────────────────────────────
clients:
  portalClientId: aggregator-portal
  apiClientId: aggregator-api

# ─── Realm-reconciliation Job ─────────────────────────────────────────────────
init:
  image: alpine:3.20

# ─── SMTP (non-secret half; creds live in the Secret) ─────────────────────────
# Emitted both into the release ConfigMap and the init Job env. Keys are the
# names apply-user-profile.sh and render-realm.sh expect.
smtp:
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_FROM: no-reply@example.com
  SMTP_FROM_DISPLAY: Blue Dots
  SMTP_SECURE: "false"
  SMTP_STARTTLS: "true"
  SMTP_AUTH: "true"

# ─── Secrets ──────────────────────────────────────────────────────────────────
# Real deploys layer these in from the generated global-secrets.yaml. The
# mandatory ones fail the render when empty or `change-me`.
secrets:
  kcBootstrapAdminPassword: ''
  # NOT `postgresPassword`: global-secrets.yaml is layered into BOTH this release
  # and the aggregator with a single root `secrets:` block, and the aggregator's
  # secrets.postgresPassword is the AGGREGATOR database password. Sharing the key
  # would hand Keycloak the wrong credential. Must equal common-services'
  # credentials.keycloakPassword (same role, same password).
  keycloakPostgresPassword: ''
  # Aggregator-side clients
  keycloakAdminClientSecret: ''
  oidcClientSecret: ''
  bffServiceClientSecret: ''   # falls back to keycloakAdminClientSecret
  # Signals-side clients — NEW, no home before this release
  # All three are REQUIRED, not optional: the clients exist in the shared realm
  # and render-realm.sh refuses an empty client secret. Generated by the
  # random_passwords opentofu module into global-secrets.yaml.
  signalsApiSecret: ''         # == signals' KEYCLOAK_API_CLIENT_SECRET
  signalstackClientSecret: ''  # `aggregator-dpg` client (Phase C service auth)
  voiceDpgSignalsSecret: ''    # `voice-dpg` client
  # SMTP creds (optional under SES/IAM)
  smtpUser: ''
  smtpPassword: ''
  # OTP delivery
  twilioAccountSid: ''
  twilioAuthToken: ''
  twilioFromNumber: ''
  msg91AuthKey: ''
  # AWS — empty under IRSA / Pod Identity
  awsAccessKeyId: ''
  awsSecretAccessKey: ''

# ─── keycloak subchart overrides ──────────────────────────────────────────────
# Replica/HPA/PDB/resources come from helm/global-resources.yaml, matching every
# other workload in this repo.
keycloak:
  ingress:
    enabled: true
    className: kong
    plugin: rl-agg-auth
  # Realm is intentionally NOT set here — the template falls back to
  # global.keycloakRealm so the rate-limit path can never drift from the realm
  # Keycloak actually serves. See plan §4.3.
  loginRateLimit:
    enabled: true
    minute: 20
    redis:
      host: common-services-redis-master.common-services.svc.cluster.local
      port: 6379
