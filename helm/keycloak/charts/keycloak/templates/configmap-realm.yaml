apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.realmConfigMap" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  # The SHARED realm for both DPGs — 7 clients, 3 realm roles, both service
  # accounts, the per-client login-theme override and the portal entitlement
  # gate. Built by scripts/build-realm.sh and guarded by scripts/assert-realm.sh.
  #
  # Placeholders are kept intact here; the realm-renderer initContainer
  # substitutes them at pod start and fails if any survive.
  realm.json: |-
{{ .Files.Get "files/realm.json" | indent 4 }}
