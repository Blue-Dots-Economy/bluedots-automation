apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.envConfigMap" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  KC_DB: "postgres"
  KC_DB_URL: "jdbc:postgresql://{{ if .Values.global.dataPlatform.postgresHost }}{{ .Values.global.dataPlatform.postgresHost }}{{ else }}{{ .Values.global.dataPlatform.postgresService }}.{{ .Values.global.dataPlatform.namespace }}.svc.cluster.local{{ end }}:5432/keycloak"
  # Keycloak's OWN host, not the aggregator app's. Drives the `iss` claim.
  #
  # A FULL URL, not a bare host. With a bare host Keycloak resolves the scheme
  # and port from each request (`KC_PROXY_HEADERS: xforwarded` below), so it
  # answers with a DIFFERENT issuer depending on which door the caller used:
  #   via Kong        X-Forwarded-Proto: https  -> https://<host>/auth/realms/…
  #   via the ClusterIP  no forwarded headers   -> http://<host>:8080/auth/realms/…
  # Tokens are stamped with the first, but a refresh_token grant is validated
  # against the second, so any in-cluster caller refreshing a token gets
  # `invalid_grant — Invalid token issuer` and its session is ended. An
  # authorization code carries no issuer, which is why login was unaffected and
  # only refresh failed. Pinning the URL makes both doors agree.
  #
  # `/auth` is hardcoded to match KC_HTTP_RELATIVE_PATH below; the two must stay
  # in step or the issuer stops matching the tokens already in circulation.
  # `authHost` itself stays a BARE host because it also feeds the Ingress
  # `host:` field, which only accepts a DNS name — putting a URL there fails the
  # hostname validator and Keycloak will not start.
  KC_HOSTNAME: "https://{{ include "keycloak.authHost" . }}/auth"
  KC_HOSTNAME_STRICT: "false"
  KC_HTTP_ENABLED: "true"
  KC_HEALTH_ENABLED: "true"
  KC_HTTP_RELATIVE_PATH: "/auth"
  KC_PROXY_HEADERS: "xforwarded"
  KC_BOOTSTRAP_ADMIN_USERNAME: "{{ .Values.bootstrapAdminUsername }}"
  PUBLIC_BASE_URL: "{{ include "keycloak.publicBaseUrl" . }}"
  KC_SPI_SMS_PROVIDER: "{{ .Values.smsProvider }}"
  MSG91_TEMPLATE_ID: "{{ .Values.msg91TemplateId }}"
  MSG91_OTP_VAR_NAME: "{{ .Values.msg91OtpVarName }}"
  {{- /*
  smsProvider=http routes login OTP through notification-service instead of a
  vendor SDK inside Keycloak. That is what lets a new SMS vendor be an NS-only
  change: Keycloak stops learning vendor names, and the login-OTP template id
  stops being duplicated between here and NS.

  otpEmailProvider picks the email OTP transport the same way. `smtp` renders
  nothing: the plugin selects smtp by provider order, so the default keeps the
  realm's SMTP server without touching Keycloak's build-time options. `http`
  renders KC_SPI_OTP_EMAIL__PROVIDER (double underscore: the current SPI option
  format, which Keycloak reads without a legacy-format warning).

  Either transport on http needs the one NS connection below (SMS_HTTP_* here,
  SMS_HTTP_SECRET in the Deployment), so it renders when either is http.
  */}}
  {{- $emailProvider := .Values.otpEmailProvider | default "smtp" }}
  {{- if not (has $emailProvider (list "smtp" "http")) }}
  {{- fail (printf "keycloak.otpEmailProvider must be smtp or http, got %q" $emailProvider) }}
  {{- end }}
  {{- if eq $emailProvider "http" }}
  KC_SPI_OTP_EMAIL__PROVIDER: "http"
  {{- end }}
  {{- if or (eq .Values.smsProvider "http") (eq $emailProvider "http") }}
  SMS_HTTP_URL: "{{ .Values.smsHttp.url | default (printf "http://%s-notification-service.%s.svc.cluster.local:3000/v1/notify" (.Values.global.signalsRelease | default "signals") (.Values.global.signalsNamespace | default "signals")) }}"
  SMS_HTTP_TEMPLATE_ID: "{{ .Values.smsHttp.templateId }}"
  SMS_HTTP_OTP_VAR_NAME: "{{ .Values.smsHttp.otpVarName }}"
  SMS_HTTP_KEY_ID: "{{ .Values.smsHttp.keyId }}"
  SMS_HTTP_TIMEOUT_MS: "{{ .Values.smsHttp.timeoutMs }}"
  {{- end }}
  AWS_REGION: "{{ .Values.awsRegion }}"
