{{- /* Without a transport the service throws on first send, breaking login OTP. Fail the render instead. */}}
{{- if and (not .Values.config.SMTP_HOST) (ne (.Values.config.SMTP_AWS_SES | toString) "true") }}
{{- fail "notification-service: no mail transport configured. Set config.SMTP_HOST (with SMTP_PORT/SMTP_SECURE and the SMTP_USER/SMTP_PASS secrets) or config.SMTP_AWS_SES=true." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dpg-notification-service.fullname" . }}
  labels:
    {{- include "dpg-notification-service.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.config }}
  {{- if ne ($val | toString) "" }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.content }}
  NS_CONTENT_FILE: "/app/content/content.json"
  {{- end }}
  {{- if .Files.Get "files/catalogue/ns-catalogue.json" }}
  NS_SEED_FILE: "/app/seed/ns-catalogue.json"
  {{- end }}
  {{- with (include "dpg-notification-service.keycloakEnv" . | trim) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  {{- if not .Values.postgres.host }}
  {{- fail "notification-service: postgres.enabled but postgres.host is empty. Set it (opentofu writes it to global-cloud-values.yaml) or disable postgres." }}
  {{- end }}
  DATABASE_HOST: {{ .Values.postgres.host | quote }}
  DATABASE_PORT: {{ .Values.postgres.port | quote }}
  DATABASE_NAME: {{ .Values.postgres.database | quote }}
  DATABASE_USER: {{ .Values.postgres.user | quote }}
  DATABASE_SSL: {{ .Values.postgres.ssl | quote }}
  {{- end }}
