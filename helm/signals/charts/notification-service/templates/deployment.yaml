apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dpg-notification-service.fullname" . }}
  labels:
    {{- include "dpg-notification-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dpg-notification-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.internalSecrets.create }}
        checksum/internal-secret: {{ include (print $.Template.BasePath "/internal-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.pinnacleTemplates }}
        checksum/pinnacle-templates: {{ include (print $.Template.BasePath "/pinnacle-templates.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dpg-notification-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "dpg-notification-service.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dpg-notification-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dpg-notification-service.fullname" . }}
            - secretRef:
                name: {{ include "dpg-notification-service.secretName" . }}
          {{- if or .Values.extraEnv .Values.pinnacleTemplates }}
          env:
            {{- if .Values.pinnacleTemplates }}
            - name: PINNACLE_TEMPLATES_FILE
              value: /app/pinnacle/pinnacle-templates.json
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: internal-secrets
              mountPath: {{ .Values.internalSecrets.mountPath }}
              readOnly: true
            {{- if .Values.pinnacleTemplates }}
            # Own directory: mounting into internalSecrets.mountPath would hide that file.
            - name: pinnacle-templates
              mountPath: /app/pinnacle
              readOnly: true
            {{- end }}
      volumes:
        - name: internal-secrets
          secret:
            secretName: {{ include "dpg-notification-service.internalSecretsName" . }}
            items:
              - key: {{ .Values.internalSecrets.fileName }}
                path: {{ .Values.internalSecrets.fileName }}
        {{- if .Values.pinnacleTemplates }}
        - name: pinnacle-templates
          configMap:
            name: {{ include "dpg-notification-service.fullname" . }}-pinnacle-templates
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
