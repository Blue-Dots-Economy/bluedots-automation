# Default values for dpg-notification-service.

replicaCount: 1

image:
  repository: ghcr.io/blue-dots-economy/signals-dpg/notification-service
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: notification.dpg.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

# Compose has no healthcheck for notification-service → default to TCP probe.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Non-secret config rendered into a ConfigMap and loaded via envFrom.
config:
  NODE_ENV: production
  SERVER_PORT: "3000"
  # Transport: SMTP_AWS_SES if set, else SMTP_HOST (any relay). One is required.
  SMTP_AWS_SES: ""
  SMTP_HOST: ""
  SMTP_PORT: ""      # default 587 when SMTP_HOST is set
  SMTP_SECURE: ""    # default: true only on port 465, else STARTTLS on 587
  SMTP_FROM: ""      # fixed envelope sender; empty = the caller's fromEmail
  SEND_WHATSAPP_NOTIFICATION: ""
  MAIL_LOG: "true"
  LOG_ACTIVITY: "true"
  # SMS vendor for this deployment: "msg91" (default) or "pinnacle". One vendor
  # per deployment; both register as channel `sms`, so no caller changes. The
  # app THROWS at boot on an unknown value rather than falling back, because the
  # wrong vendor means the wrong sender id and DLT entity.
  SMS_PROVIDER: "msg91"
  # Pinnacle DLT config — read only when SMS_PROVIDER=pinnacle. Unlike MSG91,
  # Pinnacle renders nothing: it takes final text plus the DLT ids the operator
  # matches on, so each template needs an id AND a body.
  PINNACLE_SENDER_ID: ""        # registered DLT header, 6 alpha chars or numeric
  PINNACLE_DLT_ENTITY_ID: ""    # DLT principal-entity id, one per adopter
  PINNACLE_DLT_HEADER_ID: ""    # optional; omitted from the request when empty
  PINNACLE_DLT_TAG_ID: ""       # optional
  PINNACLE_TMID: ""             # optional
  # Pinnacle's DLT template id for `login_otp`. Blank until approval lands; a
  # blank id dead-letters the job with an explicit "not configured yet".
  PINNACLE_LOGIN_OTP_TEMPLATE_ID: ""
  # The login_otp body, used by vendors that cannot render. Must be
  # BYTE-IDENTICAL to the DLT-approved text or the operator scrubs the message.
  # `{{message}}` is the OTP code.
  SMS_LOGIN_OTP_BODY: ""
  # Path the app reads for runtime secrets JSON (mounted from internalSecrets.json below).
  INTERNAL_SECRETS_JSON: /app/config/internal-secrets.json

extraEnv: []

# Secrets rendered into a Secret resource and loaded via envFrom.
secrets:
  create: true
  existingSecret: ""
  data:
    REDIS_PASSWORD: ""
    # Sending mailbox; opentofu fills both from the shared smtp_user/smtp_password.
    SMTP_USER: ""
    SMTP_PASS: ""
    # MSG91 SMS provider — required for mobile OTP login flow.
    MSG91_AUTH_KEY: ""
    MSG91_TEMPLATE_ID: ""
    # Pinnacle SMS provider — required when config.SMS_PROVIDER=pinnacle.
    PINNACLE_API_KEY: ""

# In-cluster Redis wiring. Injects REDIS_HOST/REDIS_PORT into the ConfigMap.
redis:
  enabled: true
  host: dpg-redis-master
  port: 6379

# internal-secrets.json mounted at /app/config/internal-secrets.json.
# Compose mounts a host file; in k8s we render the JSON into a Secret key and
# mount it as a file. Provide the JSON string (or use existingSecret).
internalSecrets:
  create: true
  existingSecret: ""
  # Filename under /app/config. Must match INTERNAL_SECRETS_JSON above.
  fileName: internal-secrets.json
  mountPath: /app/config
  # Raw JSON contents. Override via --set-file internalSecrets.json=./internal-secrets.json
  json: |
    {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Prometheus scraping and alerting. The app serves `/metrics` unauthenticated —
# it is the only route that is, because Prometheus cannot produce the HMAC
# signature the rest require, and the exposition carries counts and queue depths
# only (never recipients, variables or message content).
metrics:
  serviceMonitor:
    enabled: true
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  prometheusRule:
    enabled: true
    additionalLabels: {}
    # Fraction of SMS sends failing over 10m before the critical alert fires.
    smsFailureRatio: 0.25
    # Vendor balance below this warns. Units are the vendor's own credits, so
    # this needs setting per deployment once a real balance is observed.
    balanceWarnThreshold: 1000
    # DLQ entries added in an hour before warning.
    dlqGrowthThreshold: 10
    # Realtime (OTP) queue depth that means sends are lagging, not just busy.
    realtimeBacklogThreshold: 50
