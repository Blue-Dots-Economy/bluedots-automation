{{- /*
  Country boundary GeoJSON for the api's supplied-coordinate check
  (signals-dpg#789). Committed source: files/geo/<CC>.geojson, regenerated by
  scripts/build-geo-boundary.sh (Natural Earth, India point of view, public
  domain). Mounted at /app/geo/<CC>.geojson; see templates/deployment.yaml.

  A country with no committed boundary FAILS the render rather than shipping:
  the api would fail open at runtime (warn, skip the check), and a check that is
  configured but silently off is worse than a deploy that stops and says why.
*/ -}}
{{- $cc := include "dpg-api.geoBoundaryCountry" . }}
{{- if $cc }}
{{- $path := printf "files/geo/%s.geojson" $cc }}
{{- $body := .Files.Get $path }}
{{- if not $body }}
{{- fail (printf "GEOCODING_COUNTRY=%s but helm/signals/charts/api/%s is missing — generate it with scripts/build-geo-boundary.sh %s, or set api.geoBoundary.enabled=false to skip the coordinate check" $cc $path $cc) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dpg-api.fullname" . }}-geo-boundary
  labels:
    {{- include "dpg-api.labels" . | nindent 4 }}
data:
  {{ $cc }}.geojson: |-
    {{- $body | nindent 4 }}
{{- end }}
