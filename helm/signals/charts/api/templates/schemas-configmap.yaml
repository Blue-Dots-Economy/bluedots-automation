{{- if .Values.schemas.networks }}
{{- /*
  Derives the public API URL from global.publicHosts (first entry) or
  global.publicHost — the same source the ui/api ingresses use. This is the
  externally reachable instance_url embedded in BECKN network schemas so other
  participants can call this instance. It is NOT an in-cluster address.
*/ -}}
{{- $hosts := .Values.global.publicHosts | default (list (required "global.publicHost is required" .Values.global.publicHost)) -}}
{{- $publicApiUrl := printf "https://%s" (first $hosts) -}}
{{- $schemasUrl := .Values.schemas.crossNetworkUrl | default "" -}}
{{- /*
  Support/grievance email injected into the consent T&C/Privacy/Grievances copy
  at deploy time (placeholder __SUPPORT_EMAIL__ in files/consent/*.json). Change
  schemas.consentSupportEmail in values — never the consent JSON content. Mirrors
  the __PUBLIC_API_URL__ substitution used for network schemas below.
*/ -}}
{{- $supportEmail := .Values.schemas.consentSupportEmail | default "hello@bluedotseconomy.org" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dpg-api.fullname" . }}-schemas
  labels:
    {{- include "dpg-api.labels" . | nindent 4 }}
data:
{{- range .Values.schemas.networks }}
{{- $file := printf "files/networks/%s.json" . -}}
{{- $raw := $.Files.Get $file -}}
{{- if not $raw }}{{ fail (printf "missing schema file %s for network %s" $file .) }}{{- end }}
  {{ . }}.json: |
{{ $raw | replace "__PUBLIC_API_URL__" $publicApiUrl | replace "__SCHEMAS_URL__" $schemasUrl | indent 4 }}
{{- end }}
{{- /*
  Consent config for the served network. The api reads consent.json from the
  same directory as NETWORK_CONFIG_LOCAL_FILE (i.e. /app/schemas), so exposing
  it here as `consent.json` lets consent text/versions change via a ConfigMap
  edit + rollout — no image rebuild. Source files live in files/consent/<net>.json.

  NOTE: the search subchart reuses this ConfigMap and dir-scans /app/schemas for
  *.json network configs. consent.json parses fine but has no `id`, so search
  keys it under `undefined` and never looks it up (harmless). The brand override
  lives in a <brand>/ subdir, which search's readdir(...).endsWith('.json') skips.
*/ -}}
{{- if .Values.schemas.consentNetwork }}
{{- $cfile := printf "files/consent/%s.json" .Values.schemas.consentNetwork -}}
{{- $craw := $.Files.Get $cfile -}}
{{- if not $craw }}{{ fail (printf "missing consent file %s (schemas.consentNetwork=%s)" $cfile $.Values.schemas.consentNetwork) }}{{- end }}
  consent.json: |
{{ $craw | replace "__SUPPORT_EMAIL__" $supportEmail | indent 4 }}
{{- /*
  Optional brand override. Signals' consent loader deep-merges the brand file
  (partial) OVER the network default, so BOTH files must be delivered — the
  brand one is placed at /app/schemas/<brand>/consent.json via the api
  deployment's volume `items` mapping. Source: files/consent/<net>.<brand>.json.
*/ -}}
{{- if .Values.schemas.consentBrand }}
{{- $bfile := printf "files/consent/%s.%s.json" .Values.schemas.consentNetwork .Values.schemas.consentBrand -}}
{{- $braw := $.Files.Get $bfile -}}
{{- if not $braw }}{{ fail (printf "missing brand consent file %s (schemas.consentBrand=%s)" $bfile $.Values.schemas.consentBrand) }}{{- end }}
  {{ .Values.schemas.consentBrand }}-consent.json: |
{{ $braw | replace "__SUPPORT_EMAIL__" $supportEmail | indent 4 }}
{{- end }}
{{- /*
  Per-network email copy (signals-dpg#540). Same delivery as consent above and
  keyed off the same consentNetwork/consentBrand values — the api resolves BOTH
  from dirname(NETWORK_CONFIG_LOCAL_FILE), so one served network must select
  both or the pod would render one network's consent beside another's emails.

  OPTIONAL, unlike consent: the api bundles a complete set of email copy and
  merges these PER KEY, so an absent file means "keep the bundled wording", not
  a broken deploy. Hence `with` on the file contents rather than `fail`.

  Not templated. Unlike consent there is no __SUPPORT_EMAIL__ substitution here:
  the copy's own placeholders are {{`{{likeThis}}`}} and are filled by the api at
  send time, so Helm must pass the file through byte-for-byte.

  Source: files/messages/<net>.properties, fetched by scripts/fetch-configs.sh.
  The search subchart reuses this ConfigMap and dir-scans /app/schemas for
  *.json, so a .properties file is invisible to it.
*/ -}}
{{- with $.Files.Get (printf "files/messages/%s.properties" .Values.schemas.consentNetwork) }}
  messages.properties: |
{{ . | indent 4 }}
{{- end }}
{{- if .Values.schemas.consentBrand }}
{{- /*
  Brand copy is a PARTIAL override merged over the network file, so — exactly
  like brand consent — both must be delivered. Placed at
  /app/schemas/<brand>/messages.properties by the deployment's volume `items`.
  NOTE: brand email copy has no effect yet (no send resolves a brand at send
  time); it loads and validates at boot. See bluedots-schemas#14.
*/ -}}
{{- with $.Files.Get (printf "files/messages/%s.%s.properties" .Values.schemas.consentNetwork .Values.schemas.consentBrand) }}
  {{ $.Values.schemas.consentBrand }}-messages.properties: |
{{ . | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
