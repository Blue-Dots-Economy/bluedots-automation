{{- /* toggle: global.apiRateLimit.enabled (global-values.yaml) wins, else the chart's apiRateLimit.enabled */ -}}
{{- $apiRlEnabled := dig "apiRateLimit" "enabled" .Values.apiRateLimit.enabled (.Values.global | default dict) -}}
{{- if and .Values.ingress.enabled $apiRlEnabled .Values.apiRateLimit.groups }}
{{- /*
  Per-API rate limiting for signals-api (path base /api, strip-path FALSE — the
  api serves natively under /api, so each group path forwards as-is).

  Each `apiRateLimit.groups` entry → its own Kong route with a per-IP rate-limit
  plugin and its OWN counter. Paths that share the same effective limit
  (entry.limit, or apiRateLimit.defaultMinute) are grouped into ONE KongPlugin +
  ONE Ingress, so the object count tracks the number of DISTINCT limits, not the
  number of APIs. These routes are more specific than the /api catch-all
  (templates/ingress.yaml), so Kong matches them first; anything not listed falls
  through to the per-service catch-all limit.

  policy: redis + limit_by: ip + the {vault://env/redis-password} reference mirror
  the cluster rate-limit tiers (common-services/templates/kong-ratelimit.yaml);
  Kong resolves the vault reference from its own pod env, so the plaintext never
  lands on these namespaced KongPlugin CRs.
*/ -}}
{{- $fullName := include "dpg-api.fullname" . -}}
{{- $hosts := .Values.global.publicHosts | default (list (required "global.publicHost is required" .Values.global.publicHost)) -}}
{{- /* single source: global.apiRateLimit.defaultMinute (global-values.yaml), fallback to the chart default */ -}}
{{- $default := dig "apiRateLimit" "defaultMinute" .Values.apiRateLimit.defaultMinute (.Values.global | default dict) -}}
{{- $redis := .Values.apiRateLimit.redis -}}
{{- $isKong := eq .Values.ingress.className "kong" -}}
{{- /* group the configured paths by their effective per-IP limit */ -}}
{{- $byLimit := dict -}}
{{- /* A group's `limit` is a CAP, not a free-standing value: the effective limit
   is min(limit, default). An override exists to make one path TIGHTER than the
   API baseline, and an absolute number cannot do that portably — an env that
   lowers global.apiRateLimit.defaultMinute below a hardcoded override would
   silently make the overridden path the LOOSEST route on the service, which is
   the opposite of why the override was written. Clamping keeps the intent true
   in every environment. To genuinely loosen one path, raise the default and
   cap the others. */ -}}
{{- range .Values.apiRateLimit.groups }}
  {{- $n := min (int (.limit | default $default)) (int $default) -}}
  {{- $k := printf "%v" $n -}}
  {{- $cur := index $byLimit $k | default (list) -}}
  {{- $_ := set $byLimit $k (append $cur .path) -}}
{{- end }}
{{- range $limit, $paths := $byLimit }}
{{- /* Default-limit group gets a STABLE name (no value suffix) so it never churns
       when the limit is retuned; override groups keep -<value> so distinct limits
       don't collide. The real limit is config.minute, not the name. */ -}}
{{- $suffix := ternary "" (printf "-%v" $limit) (eq (int $limit) (int $default)) -}}
{{- /* These per-group routes are MORE specific than the /api catch-all, so a
   request matching one is served here and never sees the catch-all's plugin
   set. HSTS + force-SSL must therefore be re-applied on these routes too, or
   the rate-limited API paths — the sensitive ones — would answer with no HSTS
   header and serve plain http. Combine the per-IP rate-limit plugin with the
   HSTS plugin rather than replacing one with the other. */ -}}
{{- $plugins := list (printf "%s-rl%s" $fullName $suffix) -}}
{{- if and $isKong $.Values.ingress.hsts.enabled }}{{ $plugins = append $plugins (printf "%s-hsts" $fullName) }}{{ end -}}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $fullName }}-rl{{ $suffix }}
  labels:
    {{- include "dpg-api.labels" $ | nindent 4 }}
plugin: rate-limiting
config:
  minute: {{ $limit | int }}
  policy: redis
  limit_by: ip
  fault_tolerant: true
  redis:
    host: {{ $redis.host | quote }}
    port: {{ $redis.port }}
    password: "{vault://env/redis-password}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-endpoints{{ $suffix }}
  labels:
    {{- include "dpg-api.labels" $ | nindent 4 }}
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: {{ join "," $plugins | quote }}
    {{- if and $isKong $.Values.ingress.forceSSLRedirect }}
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: {{ $.Values.ingress.httpsRedirectStatusCode | int | quote }}
    {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
