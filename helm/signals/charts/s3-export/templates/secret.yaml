{{- /*
DB Secrets holding the read-only DATABASE_URL. Normally the chart renders a
single shared <fullname>-db Secret from the top-level .Values.databaseUrl
(injected from the generated global-secrets.yaml). A per-instance databaseUrl
renders its own <fullname>-db-<slug> Secret; existingDatabaseSecret references a
pre-created one. The URL must use the dedicated READ-ONLY role, never the app user.
*/ -}}
{{- if .Values.databaseUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpg-s3-export.fullname" . }}-db
  labels:
    {{- include "dpg-s3-export.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
{{- end }}
{{- range .Values.instances }}
{{- if and .databaseUrl (not .existingDatabaseSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpg-s3-export.fullname" $ }}-db-{{ include "dpg-s3-export.instanceSlug" .id }}
  labels:
    {{- include "dpg-s3-export.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .databaseUrl | quote }}
{{- end }}
{{- end }}
