{{- /*
DB Secrets holding the read-only DATABASE_URL. Normally the chart renders a
single shared <fullname>-db Secret from the top-level .Values.databaseUrl
(injected from the generated global-secrets.yaml). A per-instance databaseUrl
renders its own <fullname>-db-<slug> Secret; existingDatabaseSecret references a
pre-created one. The URL must use the dedicated READ-ONLY role, never the app user.
*/ -}}
{{- if .Values.databaseUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpg-s3-export.fullname" . }}-db
  labels:
    {{- include "dpg-s3-export.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
{{- end }}
{{- range .Values.instances }}
{{- if and .databaseUrl (not .existingDatabaseSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpg-s3-export.fullname" $ }}-db-{{ include "dpg-s3-export.instanceSlug" .id }}
  labels:
    {{- include "dpg-s3-export.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .databaseUrl | quote }}
{{- end }}
{{- end }}
{{- /*
S3 credentials Secret. Rendered only when BOTH halves are set and no
existingCredentialsSecret was given — a half-filled pair is a misconfiguration,
not a partial feature, and rendering it would produce a job that authenticates
with an empty key and fails at the first PUT.

Keys are the ENV VAR NAMES, not arbitrary labels: cronjob.yaml mounts this with
`envFrom.secretRef`, which injects each key verbatim as an environment variable.
Rename either and the SDK simply does not see a credential.
*/ -}}
{{- if and (not .Values.s3.existingCredentialsSecret) .Values.s3.credentials.accessKeyId .Values.s3.credentials.secretAccessKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpg-s3-export.fullname" . }}-s3
  labels:
    {{- include "dpg-s3-export.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.credentials.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.credentials.secretAccessKey | quote }}
{{- end }}
