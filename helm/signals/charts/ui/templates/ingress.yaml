{{- if .Values.ingress.enabled -}}
{{- /*
  Template-driven ingress for the signals UI. The routing STRUCTURE is fixed
  here — path / (catch-all). Hosts come from global.publicHosts (defaulting to
  the single global.publicHost); other scalars from ingress.* (className /
  tlsSecret / clusterIssuer / plugin).

  global.publicHosts is the ONE place the served hostnames are set; the api
  subchart's ingress reads the same list so every host that serves the UI also
  serves /api (same-origin per portal). Multiple hosts let one UI instance back
  several per-domain portals (e.g. provider + seeker); the image then picks
  VITE_SERVED_BINDINGS per request from the Host header (ui.hostBindings). All
  hosts share one multi-SAN cert.

  This object owns the cert-manager issuance for the shared host cert
  (ingress.tlsSecret); the api subchart reuses the same secret.
*/ -}}
{{- $fullName := include "dpg-ui.fullname" . -}}
{{- $hosts := .Values.global.publicHosts | default (list (required "global.publicHost is required" .Values.global.publicHost)) -}}
{{- /*
  ui.blockedHosts: hosts that must keep serving /api but NOT the portal — e.g. a
  legacy unified domain retired from end users while still being the identity
  embedded in existing rows' item_instance_url / network.json instance_url (which
  the api dereferences at boot in cacheReferencedItemSchemas). Such a host is
  dropped from the RULES below and served instead by blocked-host-ingress.yaml,
  which terminates it. It deliberately stays in the `tls` list so the shared cert
  keeps its SAN and Kong can still complete the TLS handshake for that SNI.

  Removing it from the rules (rather than layering a second Ingress on the same
  host+path) is what keeps Kong's routing unambiguous: two routes for the same
  host at path / have no defined precedence, unlike the more-specific-path
  pattern the otp-ratelimit / admin-console-block ingresses rely on.
*/ -}}
{{- $blocked := .Values.blockedHosts | default (list) -}}
{{- $ruleHosts := list -}}
{{- range $hosts }}
{{- if not (has . $blocked) }}
{{- $ruleHosts = append $ruleHosts . }}
{{- end }}
{{- end }}
{{- if not $ruleHosts }}
{{- fail (printf "ui.blockedHosts blocks every host in global.publicHosts (%v) — the portal would be unreachable" $hosts) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "dpg-ui.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- if .Values.ingress.plugin }}
    konghq.com/plugins: {{ .Values.ingress.plugin | quote }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
  rules:
    {{- range $ruleHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
