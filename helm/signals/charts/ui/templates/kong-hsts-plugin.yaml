{{- /*
HSTS header via a namespaced KongPlugin (response-transformer), referenced
only by this chart's own Ingress through konghq.com/plugins (see
templates/ingress.yaml) — scoped to the signals UI route, not cluster-wide.

Kong has no dedicated "hsts" plugin; response-transformer's `add.headers` is
the standard way to inject a static response header. Pairs with
ingress.forceSSLRedirect (konghq.com/protocols: https +
https-redirect-status-code), which handles the http->https redirect itself —
this plugin only adds the header once a client is already on https.
See GITHUB-ISSUES-COMPILATION.md Issue #10.
*/ -}}
{{- if and (eq .Values.ingress.className "kong") .Values.ingress.hsts.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "dpg-ui.fullname" . }}-hsts
  labels:
    {{- include "dpg-ui.labels" . | nindent 4 }}
plugin: response-transformer
config:
  add:
    headers:
      - {{ printf "Strict-Transport-Security:max-age=%d%s%s" (.Values.ingress.hsts.maxAge | int) (ternary "; includeSubDomains" "" .Values.ingress.hsts.includeSubDomains) (ternary "; preload" "" .Values.ingress.hsts.preload) | quote }}
{{- end }}
