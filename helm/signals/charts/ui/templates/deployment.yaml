apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dpg-ui.fullname" . }}
  labels:
    {{- include "dpg-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dpg-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.reference.enabled }}
        # Rolls the pods when a reference dataset changes. The volume below is a
        # whole-directory mount (not subPath), so kubelet DOES hot-update the
        # files in place — but nginx serves from disk per request and the widget
        # caches per page load, so a rollout is still the predictable way to
        # guarantee every client sees the new list.
        checksum/reference: {{ include (print $.Template.BasePath "/reference-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dpg-ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "dpg-ui.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "dpg-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: API_UPSTREAM
              value: {{ .Values.apiUpstream | quote }}
            {{- if .Values.hostBindings }}
            # Host-routed served binding: the image builds a per-request
            # host -> VITE_SERVED_BINDINGS map from this list so one instance
            # serves several per-domain portals. Format:
            # "<host>=<network>/<domain>;<host>=<network>/<domain>".
            - name: UI_HOST_BINDINGS
              value: {{ .Values.hostBindings | quote }}
            {{- end }}
            - name: UI_VARIANT
              value: {{ .Values.uiVariant | default "signals" | quote }}
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            {{- if .Values.reference.enabled }}
            # Whole-directory mount, so it SHADOWS the datasets baked into the
            # image at the same path. Only the single selected region
            # (colleges-<VITE_COLLEGE_DATASET>.json) is reachable while this is
            # enabled — any other region 404s even though the image contains it.
            # Intended: a release serves one region, and the ConfigMap is capped
            # at 1 MiB so it could not carry them all anyway.
            - name: reference-data
              mountPath: /usr/share/nginx/html/reference
              readOnly: true
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "dpg-ui.fullname" . }}-runtime
            items:
              - key: config.js
                path: config.js
        {{- if .Values.reference.enabled }}
        - name: reference-data
          configMap:
            name: {{ include "dpg-ui.fullname" . }}-reference
            # No `items` filter needed: the ConfigMap holds exactly one key and
            # that key already IS the filename the widget fetches.
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
