# Default values for dpg-ui.

# Shared host(s) for the ingress. Overridden by the umbrella chart's global
# (Helm propagates parent global to subcharts).
global:
  publicHost: dpg.example.com
  # publicHosts: list of all hostnames this release serves. Empty ->
  # [publicHost] (single host, as before). Read by BOTH the ui and api ingress
  # templates, so every host that serves the UI also serves /api (same-origin).
  # Set this (one place) + ui.hostBindings to run single-instance multi-domain.
  publicHosts: []

replicaCount: 1

# nginx in the UI image reverse-proxies /api/* to this upstream.
# Default matches the umbrella release name `dpg` in the same namespace.
apiUpstream: "http://dpg-api:2742"

# UI variant exposed to the container as the UI_VARIANT env var.
# Defaults to "signals"; override per environment via signals-values.yaml.
uiVariant: "signals"

image:
  repository: ghcr.io/blue-dots-economy/signals-dpg/ui
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101         # nginx user in nginx:alpine
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Template-driven ingress (templates/ingress.yaml). Path / (catch-all) is fixed
# in the template; only these scalars vary per environment. This object owns the
# cert-manager issuance for the shared host cert. Host comes from global.publicHost.
ingress:
  enabled: false
  className: ""               # e.g. kong
  tlsSecret: ""               # cert-manager secret, e.g. signals-ui-tls
  clusterIssuer: ""           # e.g. letsencrypt-prod
  plugin: ""                  # KongClusterPlugin tier, e.g. rl-signals-ui
  # Kong route-level protocol restriction: only accept https, and 301-redirect
  # a plain-http request to https instead of erroring (GITHUB-ISSUES #10).
  # No-op unless className is "kong".
  forceSSLRedirect: true
  # HSTS via a per-chart KongPlugin (response-transformer), referenced
  # alongside `plugin` above through the ingress's konghq.com/plugins
  # annotation — see templates/kong-hsts-plugin.yaml. No-op unless
  # className is "kong".
  hsts:
    enabled: true
    maxAge: 31536000           # 1 year
    includeSubDomains: true
    preload: true

# Host-routed served binding. Maps request Host -> VITE_SERVED_BINDINGS so a
# single instance behaves as the matching per-domain portal. Empty -> static
# config.js (today's behaviour). Format (";"-separated):
#   "provider.example.com=net/provider;seeker.example.com=net/seeker"
# Hosts listed here MUST also appear in global.publicHosts (so the ui + api
# ingresses route them).
hostBindings: ""

# Hosts retired from END USERS but still required by the API. Each host listed
# here is dropped from the ui ingress rules and answered by a Kong
# request-termination route instead (blocked-host-ingress.yaml), while the api
# subchart keeps serving /api on that same host — Kong matches the more specific
# path first. Must still appear in global.publicHosts so the api ingress and the
# shared TLS cert continue to cover it.
#
# Use this to retire a legacy unified domain that existing rows still reference
# in item_instance_url / item_schema_url (the api dereferences those at boot):
#   blockedHosts:
#     - dev-signals.example.com
blockedHosts: []
# Response Kong returns on a blocked host. 410 Gone states the address is
# permanently retired; 404 also works if you'd rather not advertise that.
blockedHostStatusCode: 410
blockedHostMessage: ""

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Runtime config.js values injected as window.__DPG_UI_CONFIG__.
# Rendered into a ConfigMap and mounted at /usr/share/nginx/html/config.js,
# overriding the image default.
runtimeConfig:
  VITE_API_URL: ""
  VITE_API_URLS: ""
  VITE_DEFAULT_API_URL: ""
  VITE_SHOW_INSTANCE_SELECTOR: "false"
  # Brand skin over the network (UI selects it at runtime). Empty = standard
  # dots; one UI build serves all brands. Examples: "upsdm", "onetac".
  VITE_BRAND_NAME: ""
  # Region code selecting which state's college/institute list backs the
  # reference-autocomplete field: "ka" | "up". THE SINGLE KNOB — it picks both
  # the dataset the UI requests and the one file the reference ConfigMap below
  # ships (colleges-<code>.json), so the two cannot disagree.
  VITE_COLLEGE_DATASET: "ka"
  # Base URL the reference datasets are fetched from. Leave EMPTY to use the
  # UI's own /reference/ path (served by its nginx from the ConfigMap below).
  # Set to an absolute URL only to host the lists off-cluster (CDN/registry) —
  # that host must then send permissive CORS headers, since the browser fetches
  # it directly. Setting this makes reference.enabled below redundant.
  VITE_REFERENCE_BASE_URL: ""

# College/institute reference list delivered to the UI's nginx as a ConfigMap
# mounted at /usr/share/nginx/html/reference/, so the list updates with a value
# edit + rollout instead of a UI image rebuild — the same ConfigMap-delivery
# model as consent config.
#
# EXACTLY ONE dataset ships, chosen by VITE_COLLEGE_DATASET above. There is no
# list to keep in sync: scripts/fetch-configs.sh pulls colleges-<region>.json
# from canonical signals-dpg at deploy time into files/reference/ (gitignored,
# fetched fresh so it can't drift), and this chart renders that same region.
# One region is also a hard requirement, not just tidiness — a ConfigMap is one
# etcd object capped at 1 MiB, and the two known datasets minified come to
# 1,101,321 B, so shipping both would be rejected by the apiserver.
# One region is ~353 KB (ka) / ~748 KB (up).
reference:
  # false -> no ConfigMap, no mount; the UI falls back to the datasets baked
  # into its image at build time (behaviour before this was added). Use this if
  # you instead point VITE_REFERENCE_BASE_URL at an external host.
  enabled: true
  # Render-time size guard, kept under the 1 MiB etcd ceiling with room for
  # ConfigMap metadata. Raising it past ~1048576 only moves the failure from
  # `helm template` to the apiserver, where the error is far less obvious.
  maxBytes: 1000000

podDisruptionBudget:
  enabled: false
  minAvailable: 1
