{{- if .Values.api.ingress.enabled -}}
{{- /*
  Template-driven ingress for the signals search API. Path /signals-search +
  strip-path "true" (search API serves natively under /signals-search).
  Hosts come from global.publicHosts (defaulting to the single global.publicHost
  — the SAME list the ui and api ingresses use), so every host that serves the
  UI also serves /signals-search.

  No cert-manager annotation: the ui subchart owns issuance of the shared host
  cert (api.ingress.tlsSecret); this object only references it, avoiding a
  duplicate certificate for the same host.
*/ -}}
{{- $fullName := include "search.fullname" . -}}
{{- $hosts := .Values.global.publicHosts | default (list (required "global.publicHost is required" .Values.global.publicHost)) -}}
{{- $isKong := eq .Values.api.ingress.className "kong" -}}
{{- /* Kong only accepts these on a route's https_redirect_status_code; anything
   else is rejected by the controller at admission, which silently takes the
   whole route out of service. Fail the render instead. */ -}}
{{- if and $isKong .Values.api.ingress.forceSSLRedirect -}}
{{- $code := .Values.api.ingress.httpsRedirectStatusCode | int -}}
{{- if not (has $code (list 426 301 302 307 308)) }}{{ fail (printf "api.ingress.httpsRedirectStatusCode must be one of 426/301/302/307/308, got %v" $code) }}{{ end -}}
{{- end -}}
{{- /* konghq.com/plugins takes a comma-separated list — combine the existing
   rate-limit-tier reference (if any) with this chart's own HSTS plugin (if
   enabled), rather than clobbering one with the other. */ -}}
{{- $plugins := list -}}
{{- if .Values.api.ingress.plugin }}{{ $plugins = append $plugins .Values.api.ingress.plugin }}{{ end -}}
{{- if and $isKong .Values.api.ingress.hsts.enabled }}{{ $plugins = append $plugins (printf "%s-hsts" $fullName) }}{{ end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "search.labels" . | nindent 4 }}
  annotations:
    konghq.com/strip-path: "true"
    {{- if $plugins }}
    konghq.com/plugins: {{ join "," $plugins | quote }}
    {{- end }}
    {{- if and $isKong .Values.api.ingress.forceSSLRedirect }}
    {{- /* Route-level protocol restriction: only match https, and redirect a
       plain-http request instead of erroring (GITHUB-ISSUES #10). */}}
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: {{ .Values.api.ingress.httpsRedirectStatusCode | int | quote }}
    {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.api.ingress.tlsSecret }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.api.ingress.tlsSecret }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /signals-search
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.api.port }}
    {{- end }}
{{- end }}
