{{- /* toggle: global.apiRateLimit.enabled (global-values.yaml) wins, else the chart's apiRateLimit.enabled */ -}}
{{- $apiRlEnabled := dig "apiRateLimit" "enabled" .Values.apiRateLimit.enabled (.Values.global | default dict) -}}
{{- if and .Values.api.ingress.enabled $apiRlEnabled .Values.apiRateLimit.groups }}
{{- /*
  Per-API rate limiting for signals-search (external base /signals-search,
  strip-path TRUE — the search API serves at root). Like aggregator-api, each
  route uses a regex path that captures everything after /signals-search/ as $1
  plus a uniform konghq.com/rewrite: "/$1" to strip ONLY that prefix. Multi-host
  like the other signals ingresses (global.publicHosts).

  Paths sharing the same effective limit are grouped into one KongPlugin + one
  Ingress; each path is its own Kong route with its own per-IP counter.
  policy: redis + limit_by: ip + {vault://env/redis-password} mirror the cluster
  rate-limit tiers; Kong resolves the vault reference from its own pod env.
*/ -}}
{{- $fullName := include "search.fullname" . -}}
{{- $hosts := .Values.global.publicHosts | default (list (required "global.publicHost is required" .Values.global.publicHost)) -}}
{{- /* single source: global.apiRateLimit.defaultMinute (global-values.yaml), fallback to the chart default */ -}}
{{- $default := dig "apiRateLimit" "defaultMinute" .Values.apiRateLimit.defaultMinute (.Values.global | default dict) -}}
{{- $redis := .Values.apiRateLimit.redis -}}
{{- $isKong := eq .Values.api.ingress.className "kong" -}}
{{- $byLimit := dict -}}
{{- /* A group's `limit` is a CAP, not a free-standing value: the effective limit
   is min(limit, default). An override exists to make one path TIGHTER than the
   API baseline, and an absolute number cannot do that portably — an env that
   lowers global.apiRateLimit.defaultMinute below a hardcoded override would
   silently make the overridden path the LOOSEST route on the service, which is
   the opposite of why the override was written. Clamping keeps the intent true
   in every environment. To genuinely loosen one path, raise the default and
   cap the others. */ -}}
{{- range .Values.apiRateLimit.groups }}
  {{- $n := min (int (.limit | default $default)) (int $default) -}}
  {{- $k := printf "%v" $n -}}
  {{- $cur := index $byLimit $k | default (list) -}}
  {{- $_ := set $byLimit $k (append $cur .path) -}}
{{- end }}
{{- range $limit, $paths := $byLimit }}
{{- /* Default-limit group gets a STABLE name (no value suffix) so it never churns
       when the limit is retuned; override groups keep -<value> so distinct limits
       don't collide. The real limit is config.minute, not the name. */ -}}
{{- $suffix := ternary "" (printf "-%v" $limit) (eq (int $limit) (int $default)) -}}
{{- /* These per-group routes have a HIGHER regex-priority than the
   /signals-search catch-all, so a request matching one is served here and never
   sees the catch-all's plugin set. Re-apply HSTS + force-SSL, or the
   rate-limited search paths answer with no HSTS header over plain http. */ -}}
{{- $plugins := list (printf "%s-rl%s" $fullName $suffix) -}}
{{- if and $isKong $.Values.api.ingress.hsts.enabled }}{{ $plugins = append $plugins (printf "%s-hsts" $fullName) }}{{ end -}}
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ $fullName }}-rl{{ $suffix }}
  labels:
    {{- include "search.labels" $ | nindent 4 }}
plugin: rate-limiting
config:
  minute: {{ $limit | int }}
  policy: redis
  limit_by: ip
  fault_tolerant: true
  redis:
    host: {{ $redis.host | quote }}
    port: {{ $redis.port }}
    password: "{vault://env/redis-password}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-endpoints{{ $suffix }}
  labels:
    {{- include "search.labels" $ | nindent 4 }}
  annotations:
    konghq.com/rewrite: "/$1"
    konghq.com/regex-priority: "100"
    konghq.com/plugins: {{ join "," $plugins | quote }}
    {{- if and $isKong $.Values.api.ingress.forceSSLRedirect }}
    konghq.com/protocols: "https"
    konghq.com/https-redirect-status-code: {{ $.Values.api.ingress.httpsRedirectStatusCode | int | quote }}
    {{- end }}
spec:
  {{- with $.Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $paths }}
          - path: "/~/signals-search/({{ . }}(?:/.*)?)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.api.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
