{{- /*
HSTS header via a namespaced KongPlugin (response-transformer), referenced only
by this chart's own Ingresses through konghq.com/plugins — the /signals-search
catch-all (templates/ingress.yaml) and the more-specific generated routes
(api-endpoint-groups-ingress.yaml). Scoped to the search routes, not
cluster-wide.

Kong has no dedicated "hsts" plugin; response-transformer's `add.headers` is the
standard way to inject a static response header. Pairs with
api.ingress.forceSSLRedirect, which handles the http->https redirect itself.
Mirrors helm/signals/charts/ui/templates/kong-hsts-plugin.yaml.
*/ -}}
{{- if and (eq .Values.api.ingress.className "kong") .Values.api.ingress.hsts.enabled }}
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: {{ include "search.fullname" . }}-hsts
  labels:
    {{- include "search.labels" . | nindent 4 }}
plugin: response-transformer
config:
  add:
    headers:
      - {{ printf "Strict-Transport-Security:max-age=%d%s%s" (.Values.api.ingress.hsts.maxAge | int) (ternary "; includeSubDomains" "" .Values.api.ingress.hsts.includeSubDomains) (ternary "; preload" "" .Values.api.ingress.hsts.preload) | quote }}
{{- end }}
