apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "search.fullname" . }}-api
  labels: {{- include "search.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "search.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "search.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "search.serviceAccountName" . }}
      {{- include "search.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["node", "dist/api/main.js"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef: { name: {{ include "search.fullname" . }} }
          env:
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: REDIS_PASSWORD } }
            - name: EMBEDDING_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: EMBEDDING_API_KEY } }
            {{- if .Values.geocode.enabled }}
            {{- /* Geocoder wiring is ALL-OR-NONE in signals-search's loadConfig() (an empty
                  string counts as set), and the WORKER runs the same loadConfig() — so these
                  four live ONLY here on the API Deployment, never in the shared ConfigMap
                  the worker envFroms. Token URL defaults to the in-cluster shared Keycloak
                  (global.keycloak.*, resolved like the api chart). */}}
            {{- $g := .Values.global | default dict }}
            {{- $gkc := $g.keycloak | default dict }}
            {{- $realm := $gkc.realm | default $g.keycloakRealm }}
            {{- $tokenUrl := .Values.geocode.keycloakTokenUrl }}
            {{- if not $tokenUrl }}
            {{- if not $realm }}{{ fail "search.geocode.enabled but no Keycloak realm resolved — set global.keycloakRealm (or search.geocode.keycloakTokenUrl)" }}{{ end }}
            {{- if not $gkc.internalBaseUrl }}{{ fail "search.geocode.enabled but no internal Keycloak URL resolved — set global.keycloak.internalBaseUrl (or search.geocode.keycloakTokenUrl)" }}{{ end }}
            {{- $tokenUrl = printf "%s/realms/%s/protocol/openid-connect/token" (trimSuffix "/" $gkc.internalBaseUrl) $realm }}
            {{- end }}
            {{- if and .Values.secrets.create (not .Values.secrets.data.KEYCLOAK_CLIENT_SECRET) }}
            {{- fail "search.geocode.enabled needs search.secrets.data.KEYCLOAK_CLIENT_SECRET (== keycloak secrets.signalsSearchClientSecret), or set secrets.create=false with an existing Secret holding that key" }}
            {{- end }}
            # Signals API root, no /api suffix. Service is {release}-api (dpg-api.fullname).
            - name: SIGNALS_GEOCODE_URL
              value: {{ .Values.geocode.signalsUrl | default (printf "http://%s-api:%v" .Release.Name .Values.geocode.signalsPort) | quote }}
            - name: KEYCLOAK_TOKEN_URL
              value: {{ $tokenUrl | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.geocode.clientId | quote }}
            - name: GEOCODE_TIMEOUT_MS
              value: {{ .Values.geocode.timeoutMs | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "search.secretName" . }}, key: KEYCLOAK_CLIENT_SECRET } }
            {{- end }}
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
          volumeMounts:
            - name: schemas
              mountPath: {{ .Values.networkConfigPath }}
              readOnly: true
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: schemas
          configMap:
            name: {{ include "search.schemasConfigMapName" . }}
